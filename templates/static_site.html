<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>本地视频库（静态）</title>
  <style>
    :root {
      --bg: #0e1116; --bg2: #151a22; --bg3: #1c2330; --border: #2a3344;
      --text: #e8edf5; --muted: #8b97ab; --accent: #00c8d4; --radius: 10px;
      --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
    header {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 18px; border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #141920, var(--bg));
      position: sticky; top: 0; z-index: 20;
    }
    .brand { font-weight: 700; font-size: 1.1rem; white-space: nowrap; }
    .brand span { color: var(--accent); }
    .badge {
      font-size: 0.75rem; color: var(--muted); border: 1px solid var(--border);
      padding: 2px 8px; border-radius: 999px;
    }
    input[type=search] {
      flex: 0 1 360px;
      width: 360px;
      min-width: 160px;
      max-width: 50vw;
      padding: 8px 12px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--bg2); color: var(--text); outline: none;
      transition: width 0.22s ease, flex-basis 0.22s ease, max-width 0.22s ease,
        border-color 0.15s ease, box-shadow 0.22s ease, background 0.15s ease;
    }
    input[type=search]:focus {
      flex-basis: 820px;
      width: 820px;
      max-width: min(920px, 78vw);
      border-color: var(--accent);
      background: #18202b;
      box-shadow: 0 0 0 3px rgba(0, 200, 212, 0.12);
    }
    .hint { font-size: 0.78rem; color: var(--muted); max-width: 420px; }
    .export-tip {
      display: none; align-items: center; gap: 8px;
      margin: 0 18px; padding: 6px 10px;
      font-size: 0.78rem; color: var(--muted);
      background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    }
    .export-tip.show { display: inline-flex; }
    .export-tip .tip-x {
      border: none; background: transparent; color: var(--muted);
      cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 2px;
    }
    .export-tip .tip-x:hover { color: var(--text); }
    .layout { display: flex; min-height: calc(100vh - 58px); }
    aside {
      width: 220px; flex-shrink: 0; border-right: 1px solid var(--border);
      background: var(--bg2); overflow: auto; padding: 10px;
      position: relative; z-index: 20;
    }
    .ch {
      display: flex; justify-content: space-between; gap: 8px;
      padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 2px;
    }
    .ch:hover { background: #243044; }
    .ch.active { background: rgba(0,200,212,.12); color: var(--accent); font-weight: 600; }
    .ch .n { color: var(--muted); font-size: 0.75rem; }
    main {
      flex: 1; min-width: 0; overflow: auto;
      display: flex; flex-direction: column;
    }
    /* 完整筛选不吸顶，滚走后把内容区让出来 */
    .filters {
      display: flex; flex-direction: column; gap: 0;
      padding: 12px 18px 4px;
      margin: 0;
      background: linear-gradient(180deg, #12161d 0%, var(--bg) 100%);
      flex-shrink: 0;
    }
    .filter-row {
      display: flex; align-items: flex-start; gap: 10px;
      margin-bottom: 10px;
    }
    .filter-label {
      flex: 0 0 42px; max-width: 72px; padding-top: 6px;
      font-size: 0.82rem; color: var(--muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .filter-tags { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; min-width: 0; }
    #subFolderRows {
      max-height: min(36vh, 280px);
      overflow-x: hidden;
      overflow-y: auto;
      margin-bottom: 4px;
    }
    #subFolderRows:empty { display: none; margin: 0; }
    .tag {
      border: 1px solid transparent; background: var(--bg3); color: var(--text);
      padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 0.86rem;
      font-family: inherit; line-height: 1.35;
      display: inline-flex; align-items: baseline; gap: 5px;
    }
    .tag:hover { background: #243044; border-color: var(--border); }
    .tag .tag-n {
      color: var(--muted); font-size: 0.72em; font-weight: 500; opacity: 0.85;
    }
    .tag.active {
      background: rgba(0,200,212,.15); color: var(--accent);
      border-color: rgba(0,200,212,.35); font-weight: 600;
    }
    .tag.active .tag-n { color: var(--accent); opacity: 0.7; }
    /* 完整筛选不吸顶；滑动后吸顶显示当前选中的那一行筛选标签 */
    .scope-sticky {
      position: sticky; top: 0; z-index: 5;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 10px;
      min-height: 48px;
      padding: 8px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(14, 17, 22, 0.96);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }
    .scope-bar,
    .sticky-filter-row {
      grid-column: 1;
      grid-row: 1;
      min-width: 0;
    }
    .scope-bar {
      font-size: 0.82rem; color: var(--muted);
      display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center;
    }
    .scope-bar .sep { opacity: 0.4; }
    .scope-bar .count { color: var(--text); }
    .sticky-filter-row {
      display: flex;
      align-items: center;
      gap: 10px;
      visibility: hidden;
      pointer-events: none;
    }
    .scope-sticky.is-stuck.has-filter-row .scope-bar {
      visibility: hidden;
      pointer-events: none;
    }
    .scope-sticky.is-stuck.has-filter-row .sticky-filter-row {
      visibility: visible;
      pointer-events: auto;
    }
    .sticky-filter-row .filter-label {
      flex: 0 0 42px; max-width: 72px;
      font-size: 0.82rem; color: var(--muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sticky-filter-row .filter-tags {
      display: flex; flex-wrap: nowrap; gap: 8px; flex: 1; min-width: 0;
      overflow-x: auto; padding-bottom: 2px;
    }
    .scope-filter-btn {
      grid-column: 2;
      grid-row: 1;
      flex-shrink: 0;
      border: 1px solid var(--border); background: var(--bg3); color: var(--text);
      padding: 4px 10px; border-radius: 999px; cursor: pointer;
      font-size: 0.78rem; font-family: inherit; white-space: nowrap;
    }
    .scope-filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .scope-sticky.is-stuck .scope-filter-btn { border-color: rgba(0,200,212,.35); color: var(--accent); }
    .content-body { padding: 14px 18px 40px; flex: 1; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px;
    }
    .card {
      background: var(--bg2); border-radius: var(--radius); overflow: hidden;
      border: 1px solid transparent; cursor: pointer;
      content-visibility: auto;
      contain-intrinsic-size: 200px 260px;
    }
    .card:hover { border-color: #009aa3; transform: translateY(-1px); }
    .thumb { aspect-ratio: 16/9; background: #0a0c10; position: relative; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb .mark {
      position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.75);
      color: #fff; font-size: 0.72rem; padding: 2px 6px; border-radius: 4px;
    }
    .dup-badge, .bad-badge {
      position: absolute; top: 8px; color: #fff; font-size: 0.7rem;
      padding: 2px 6px; border-radius: 4px; z-index: 2;
    }
    .dup-badge { left: 8px; background: rgba(200, 120, 40, 0.92); }
    .bad-badge { right: 8px; background: rgba(180, 50, 50, 0.92); }
    .body { padding: 10px 12px 12px; }
    .title {
      font-size: 0.9rem; line-height: 1.35; margin-bottom: 6px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .meta { font-size: 0.75rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
    .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
    .modal {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,.88); flex-direction: column;
    }
    .modal.open { display: flex; }
    .mbar {
      display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #0a0c10;
    }
    .mbar .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mbar button, .ma button {
      border: 1px solid var(--border); background: var(--bg3); color: var(--text);
      padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 0.82rem;
    }
    .mbar button.primary, .ma button.primary {
      background: var(--accent); border-color: var(--accent); color: #041016; font-weight: 600;
    }
    .player { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 8px; }
    .player video { width: 100%; max-width: 1200px; max-height: calc(100vh - 140px); background: #000; }
    .ma { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 14px; }
    .mi { padding: 0 16px 10px; color: var(--muted); font-size: 0.82rem; word-break: break-all; }
    @media (max-width: 800px) {
      aside { display: none; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">本地<span>视频库</span></div>
    <span class="badge">静态离线版</span>
    <input type="search" id="q" placeholder="搜索：拼音/首字母，ext:mkv genre:动作" title="支持拼音与语法过滤" />
    <div class="export-tip" id="exportTip">
      <span>请运行「打开图库.bat」（Windows）或「打开图库.command」（macOS）浏览。</span>
      <button type="button" class="tip-x" id="tipDismiss" title="不再显示">×</button>
    </div>
    <div class="hint" id="fileWarn" style="display:none;color:#ffb4a2"></div>
  </header>
  <div class="layout">
    <aside id="channels"></aside>
    <main id="mainScroll">
      <div class="filters" id="filters">
        <div class="filter-row">
          <div class="filter-label">排序</div>
          <div class="filter-tags" id="sortTags"></div>
        </div>
        <div class="filter-row">
          <div class="filter-label">视图</div>
          <div class="filter-tags" id="viewTags"></div>
        </div>
        <div class="filter-row" id="genreRow" style="display:none">
          <div class="filter-label">类型</div>
          <div class="filter-tags" id="genreTags"></div>
        </div>
        <div class="filter-row">
          <div class="filter-label">格式</div>
          <div class="filter-tags" id="extTags"></div>
        </div>
        <div id="subFolderRows"></div>
      </div>
      <div class="scope-sticky" id="scopeSticky">
        <div class="sticky-filter-row" id="stickyFilterRow"></div>
        <div class="scope-bar" id="scopeBar"></div>
        <button type="button" class="scope-filter-btn" id="scopeFilterBtn" title="回到筛选栏">筛选</button>
      </div>
      <div class="content-body">
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" style="display:none">没有视频</div>
      </div>
    </main>
  </div>
  <div class="modal" id="modal">
    <div class="mbar">
      <div class="t" id="mtitle"></div>
      <button type="button" id="btnClose" title="关闭">关闭</button>
    </div>
    <div class="player"><video id="player" controls playsinline></video></div>
    <div class="mi" id="minfo"></div>
    <div class="ma">
      <button type="button" class="primary" id="btnLocalOpen" title="在新标签打开视频文件">打开视频</button>
      <button type="button" id="btnCopyPath" title="复制本地文件路径">复制路径</button>
      <button type="button" id="btnReveal" title="打开视频所在文件夹">打开位置</button>
    </div>
  </div>
  <div class="modal" id="seriesModal">
    <div class="mbar">
      <div class="t" id="seriesModalTitle">剧集</div>
      <button type="button" id="seriesModalClose" title="关闭">关闭</button>
    </div>
    <div class="mi" id="seriesModalList" style="flex:1;overflow:auto;max-height:70vh"></div>
  </div>
  <script src="_cache/hls.min.js"></script>
  <script src="data.js"></script>
  <script>
    const DATA = window.__VG_DATA__ || { videos: [], root: "", exported_at: "" };
    const state = { cat: "", folder: "", folderAll: false, genre: "", ext: "", q: "", sort: "mtime_desc", view: "series", cur: null };
    let hls = null;

    const SORTS = [
      { id: "mtime_desc", label: "最新" },
      { id: "mtime_asc", label: "最早" },
      { id: "size_desc", label: "最大" },
      { id: "duration_desc", label: "最长" },
      { id: "duration_asc", label: "最短" },
      { id: "name", label: "名称" },
    ];
    const VIRTUAL_MIN = 150;
    const VIRTUAL_ROW_H = 268;
    const VIRTUAL_GAP = 14;
    const GENRE_ORDER = [
      "动作","喜剧","爱情","剧情","科幻","恐怖","悬疑","犯罪","警匪","枪战","战争","冒险","奇幻","玄幻","仙侠","武侠","功夫","动画","灾难","青春","古装","历史","宫廷","家庭","儿童","运动","音乐","西部","黑色","纪录片","短片","同性","医疗","律政","职场","都市","农村","谍战","僵尸","超级英雄","机器人","公路","美食","旅行","自然","神话","童话","励志","治愈","惊悚","恐怖喜剧","动作喜剧","爱情喜剧","犯罪悬疑","科幻动作","武侠仙侠","戏曲","脱口秀","真人秀","晚会"
    ];

    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }
    function normFolder(f) {
      return String(f || "").replace(/\\/g, "/").replace(/^\/+|\/+$/g, "");
    }
    function videoCat(v) {
      const f = normFolder(v.folder);
      return f ? f.split("/")[0] : "";
    }
    function videoGenres(v) {
      return Array.isArray(v.genres) ? v.genres : [];
    }

    function cats() {
      const map = {};
      for (const v of DATA.videos) {
        const c = v.category || videoCat(v) || "";
        map[c] = (map[c] || 0) + 1;
      }
      return map;
    }

    function inCategory(v) {
      if (state.cat === "__root__") return !normFolder(v.folder);
      if (!state.cat) return true;
      return (v.category || videoCat(v)) === state.cat;
    }

    function categoryVideos() {
      return DATA.videos.filter(inCategory);
    }

    function baseScoped() {
      let list = categoryVideos();
      const folder = normFolder(state.folder);
      if (folder) {
        // 有子分类时：folderAll（默认）含子目录全部；取消全部则只看本层根目录
        const hasChildren = subfolderFacets(list, folder).length > 0;
        list = list.filter((v) => {
          const f = normFolder(v.folder);
          if (hasChildren && !state.folderAll) return f === folder;
          return f === folder || f.startsWith(folder + "/");
        });
      }
      if (state.ext) {
        const ext = state.ext.startsWith(".") ? state.ext : ("." + state.ext);
        list = list.filter((v) => (v.ext || "").toLowerCase() === ext.toLowerCase());
      }
      if (state.q) {
        const parsed = parseSearchQuery(state.q);
        if (parsed.ext) {
          const ext = parsed.ext.startsWith(".") ? parsed.ext : ("." + parsed.ext);
          list = list.filter((v) => (v.ext || "").toLowerCase() === ext.toLowerCase());
        }
        if (parsed.genre) {
          list = list.filter((v) => videoGenres(v).some((g) => String(g).toLowerCase().includes(parsed.genre)));
        }
        if (parsed.actor) {
          const a = parsed.actor;
          list = list.filter((v) => {
            const actors = (v.actors || []).join(" ").toLowerCase();
            const blob = (v.search_q || (v.name + " " + (v.folder || ""))).toLowerCase();
            return actors.includes(a) || blob.includes(a);
          });
        }
        if (parsed.category) {
          const c = parsed.category;
          list = list.filter((v) => String(v.category || "").toLowerCase().includes(c));
        }
        for (const term of parsed.terms) {
          list = list.filter((v) => {
            const blob = (v.search_q || (v.name + " " + (v.folder || "") + " " + (v.actors || []).join(" "))).toLowerCase();
            return blob.includes(term);
          });
        }
      }
      return list;
    }

    function parseSearchQuery(q) {
      const out = { terms: [], ext: "", genre: "", actor: "", category: "" };
      const re = /(ext|type|genre|g|actor|a|cast|channel|cat):("[^"]+"|'[^']+'|\S+)|\S+/gi;
      let m;
      while ((m = re.exec(String(q || ""))) !== null) {
        const raw = m[0];
        if (m[1]) {
          const field = m[1].toLowerCase();
          let val = (m[2] || "").replace(/^["']|["']$/g, "");
          if (field === "ext" || field === "type") out.ext = val.toLowerCase();
          else if (field === "genre" || field === "g") out.genre = val.toLowerCase();
          else if (field === "actor" || field === "a" || field === "cast") out.actor = val.toLowerCase();
          else if (field === "channel" || field === "cat") out.category = val.toLowerCase();
        } else if (raw && raw.indexOf(":") < 0) {
          out.terms.push(raw.toLowerCase());
        }
      }
      return out;
    }

    function filtered() {
      let list = baseScoped();
      if (state.genre) {
        list = list.filter((v) => videoGenres(v).includes(state.genre));
      }
      if ((state.view || "series") === "series") {
        list = collapseToSeriesCards(list);
      }
      const rev = state.sort !== "mtime_asc" && state.sort !== "name" && state.sort !== "duration_asc";
      list.sort((a, b) => {
        if (state.sort === "name") return (a.name || "").localeCompare(b.name || "", "zh");
        if (state.sort.startsWith("size")) return (a.size || 0) - (b.size || 0);
        if (state.sort.startsWith("duration")) return (a.duration || 0) - (b.duration || 0);
        return (a.mtime || 0) - (b.mtime || 0);
      });
      if (rev) list.reverse();
      return list;
    }

    function collapseToSeriesCards(videos) {
      const by = {};
      const singles = [];
      for (const v of videos) {
        const sid = v.series_id || "";
        if (sid) {
          if (!by[sid]) by[sid] = [];
          by[sid].push(v);
        } else {
          singles.push(v);
        }
      }
      const cards = [];
      for (const sid of Object.keys(by)) {
        const items = by[sid].slice().sort((a, b) =>
          (a.season || 0) - (b.season || 0) || (a.episode || 0) - (b.episode || 0)
        );
        if (items.length < 2) {
          singles.push(...items);
          continue;
        }
        const cover = items[items.length - 1];
        const title = cover.series_title || cover.name || "剧集";
        cards.push({
          id: sid,
          kind: "series",
          name: title,
          series_id: sid,
          series_title: title,
          ep_count: items.length,
          folder: cover.folder || "",
          size: items.reduce((s, x) => s + (x.size || 0), 0),
          size_h: cover.size_h || "",
          mtime: Math.max(...items.map((x) => x.mtime || 0)),
          mtime_h: cover.mtime_h || "",
          duration: items.reduce((s, x) => s + (x.duration || 0), 0) || null,
          duration_h: "",
          genres: cover.genres || [],
          thumb: cover.thumb || "",
          dup: items.some((x) => x.dup),
          bad: items.some((x) => x.bad),
          _episodes: items,
        });
      }
      return cards.concat(singles);
    }

    function genreFacets(list) {
      const map = {};
      for (const v of list) {
        for (const g of videoGenres(v)) map[g] = (map[g] || 0) + 1;
      }
      return Object.keys(map)
        .map((name) => ({ name, count: map[name] }))
        .sort((a, b) => {
          const ia = GENRE_ORDER.indexOf(a.name);
          const ib = GENRE_ORDER.indexOf(b.name);
          return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || b.count - a.count || a.name.localeCompare(b.name, "zh");
        });
    }

    function extFacets(list) {
      const map = {};
      for (const v of list) {
        const ext = (v.ext || "").toLowerCase() || "unknown";
        map[ext] = (map[ext] || 0) + 1;
      }
      return Object.keys(map)
        .map((ext) => ({
          ext,
          count: map[ext],
          label: ext === "unknown" ? "未知" : ext.replace(".", "").toUpperCase(),
        }))
        .sort((a, b) => b.count - a.count || a.ext.localeCompare(b.ext));
    }

    function subfolderFacets(list, prefix) {
      prefix = normFolder(prefix);
      const counts = {};
      for (const v of list) {
        const f = normFolder(v.folder);
        if (!f) continue;
        let rest;
        if (prefix) {
          if (f === prefix) continue;
          if (!f.startsWith(prefix + "/")) continue;
          rest = f.slice(prefix.length + 1);
        } else {
          rest = f;
        }
        const nxt = rest.split("/")[0];
        if (!nxt) continue;
        const full = prefix ? (prefix + "/" + nxt) : nxt;
        if (f === full || f.startsWith(full + "/")) {
          counts[nxt] = (counts[nxt] || 0) + 1;
        }
      }
      return Object.keys(counts)
        .map((name) => ({
          id: prefix ? (prefix + "/" + name) : name,
          name,
          count: counts[name],
        }))
        .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, "zh"));
    }

    function subfolderLevels(catVideos) {
      const cat = state.cat;
      if (!cat || cat === "__root__") return [];
      let folder = normFolder(state.folder);
      if (folder === cat) folder = "";
      if (folder && folder !== cat && !folder.startsWith(cat + "/")) {
        folder = cat + "/" + folder;
      }
      const prefixes = [cat];
      if (folder.startsWith(cat + "/")) {
        let acc = cat;
        for (const part of folder.slice(cat.length + 1).split("/")) {
          if (!part) continue;
          acc = acc + "/" + part;
          prefixes.push(acc);
        }
      }
      const levels = [];
      for (let i = 0; i < prefixes.length; i++) {
        const prefix = prefixes[i];
        const items = subfolderFacets(catVideos, prefix);
        if (!items.length) break;
        let selected = "";
        if (folder.startsWith(prefix + "/")) {
          selected = prefix + "/" + folder.slice(prefix.length + 1).split("/")[0];
        }
        levels.push({
          label: i === 0 ? "子类" : prefix.split("/").pop(),
          selected,
          all_id: prefix === cat ? "" : prefix,
          items,
        });
      }
      return levels;
    }

    function getVirtualCols() {
      const grid = $("grid");
      const w = (grid && grid.clientWidth) || 800;
      const min = window.matchMedia("(max-width: 800px)").matches ? 150 : 200;
      return Math.max(1, Math.floor((w + VIRTUAL_GAP) / (min + VIRTUAL_GAP)));
    }

    let cachedList = [];
    let virtualBound = false;
    function bindVirtualScroll() {
      if (virtualBound) return;
      virtualBound = true;
      let raf = 0;
      const onScroll = () => {
        if (cachedList.length < VIRTUAL_MIN) return;
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => { raf = 0; paintVirtual(); });
      };
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onScroll);
    }

    function paintVirtual() {
      const grid = $("grid");
      if (!grid) return;
      const cols = getVirtualCols();
      const total = cachedList.length;
      const totalRows = Math.ceil(total / cols) || 1;
      const rowStride = VIRTUAL_ROW_H + VIRTUAL_GAP;
      const scrollTop = window.scrollY || document.documentElement.scrollTop || 0;
      const viewH = window.innerHeight || 800;
      const gridTop = grid.getBoundingClientRect().top + scrollTop;
      const relTop = Math.max(0, scrollTop - gridTop);
      const firstRow = Math.max(0, Math.floor(relTop / rowStride) - 3);
      const lastRow = Math.min(totalRows - 1, Math.ceil((relTop + viewH) / rowStride) + 3);
      const start = firstRow * cols;
      const end = Math.min(total, (lastRow + 1) * cols);
      const padTop = firstRow * rowStride;
      const padBot = Math.max(0, (totalRows - lastRow - 1) * rowStride);
      grid.innerHTML =
        `<div style="grid-column:1/-1;height:${padTop}px" aria-hidden="true"></div>` +
        cachedList.slice(start, end).map(cardHtml).join("") +
        `<div style="grid-column:1/-1;height:${padBot}px" aria-hidden="true"></div>`;
    }

    function renderGrid() {
      cachedList = filtered();
      $("empty").style.display = cachedList.length ? "none" : "block";
      bindVirtualScroll();
      if (cachedList.length >= VIRTUAL_MIN) {
        paintVirtual();
        return;
      }
      $("grid").innerHTML = cachedList.map(cardHtml).join("");
    }

    function destroyHls() {
      if (hls) { try { hls.destroy(); } catch (_) {} hls = null; }
    }

    const BRIDGE_PORT = Number((DATA && DATA.bridge_port) || 8767);
    const BRIDGE_ORIGIN = `http://127.0.0.1:${BRIDGE_PORT}`;
    const ON_HTTP = location.protocol === "http:" || location.protocol === "https:";
    let closingFromPop = false;
    let bridgeReady = ON_HTTP && location.hostname === "127.0.0.1";

    async function tryBridgePost(action, path, vid) {
      const payload = JSON.stringify({ action, path, id: vid || "" });
      const urls = [];
      if (ON_HTTP) urls.push("/api/local");
      urls.push(`${BRIDGE_ORIGIN}/api/local`);
      let lastErr = "无法连接本地助手";
      for (const url of urls) {
        try {
          const r = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: payload,
          });
          const data = await r.json();
          if (data && data.ok) return data;
          lastErr = (data && data.msg) || ("HTTP " + r.status);
        } catch (e) {
          lastErr = String(e && e.message ? e.message : e);
        }
      }
      throw new Error(lastErr);
    }

    async function pingBridge() {
      try {
        const r = await fetch(`${BRIDGE_ORIGIN}/api/ping`, { cache: "no-store" });
        const data = await r.json();
        bridgeReady = !!(data && data.ok);
        return bridgeReady;
      } catch (_) {
        bridgeReady = ON_HTTP && location.hostname === "127.0.0.1";
        return bridgeReady;
      }
    }

    async function ensureHttpGallery() {
      if (ON_HTTP) return;
      const ok = await pingBridge();
      if (!ok) return;
      const file = location.pathname.split("/").pop() || "index.html";
      location.replace(`${BRIDGE_ORIGIN}/${file}${location.search || ""}${location.hash || ""}`);
    }

    function openItem(v) {

      const st = {

      };
      if (location.hash !== "#play") {
        history.pushState(st, "", file + "#play");
      } else {
        history.replaceState(st, "", file + "#play");
      }

      if (v.playlist && window.Hls && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(v.playlist);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        hls.on(Hls.Events.ERROR, (_, d) => {
          if (d && d.fatal) {
            destroyHls();
            $("minfo").textContent = "浏览器 HLS 失败，请点「系统播放器」。\n" + (v.path || v.src || "");
          }
        });
        return;
      }
      if (v.playlist && video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = v.playlist;
        video.play().catch(() => {});
        return;
      }
      if (v.src) {
        video.src = v.src;
        video.play().catch(() => {
          $("minfo").textContent = "浏览器内嵌播放失败，请用「系统播放器」。\n" + (v.path || v.src);
        });
      }
    }

    function toFileUrl(absPath) {
      if (!absPath) return "";
      let p = String(absPath).replace(/\\/g, "/");
      // D:/a/b -> file:///D:/a/b
      if (/^[a-zA-Z]:\//.test(p)) return "file:///" + p;
      if (p.startsWith("/")) return "file://" + p;
      return "file:///" + p;
    }

    function folderFileUrl(absPath) {
      if (!absPath) return "";
      let p = String(absPath).replace(/\\/g, "/");
      const i = p.lastIndexOf("/");
      if (i <= 0) return toFileUrl(p);
      return toFileUrl(p.slice(0, i + 1));
    }

    function openInBrowser(url) {
      if (!url) return false;
      const a = document.createElement("a");
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      a.remove();
      return true;
    }

    async function localAction(action) {
      const v = state.cur;
      if (!v) return;
      const path = v.path || "";
      const fileUrl = v.file_url || toFileUrl(path) || v.src || "";

      if (action === "path") {
        if (!path && !fileUrl) {
          alert("没有本地路径");
          return;
        }
        const text = path || fileUrl;
        try {
          await navigator.clipboard.writeText(text);
          $("minfo").textContent = "已复制路径：\n" + text;
        } catch (_) {
          prompt("复制路径：", text);
        }
        return;
      }

      if (action === "reveal") {
        try {
          const data = await tryBridgePost("reveal", path, v.id);
          bridgeReady = true;
          $("minfo").textContent = (data.msg || "已在文件夹中显示") + "\n" + (data.path || path);
          return;
        } catch (_) {
          bridgeReady = false;
        }
        // 优先用相对目录（http / file 都能打开所在文件夹页）
        let url = "";
        if (v.src) {
          const rel = String(v.src).replace(/\\/g, "/");
          const i = rel.lastIndexOf("/");
          url = i >= 0 ? rel.slice(0, i + 1) : "./";
        }
        if (!url) url = folderFileUrl(path);
        if (!openInBrowser(url)) {
          alert("无法打开位置");
          return;
        }
        $("minfo").textContent = "已打开所在文件夹\n" + (path || url);
        return;
      }

      if (action === "open") {
        try {
          const data = await tryBridgePost("open", path, v.id);
          bridgeReady = true;
          $("minfo").textContent = (data.msg || "已调用系统播放器") + "\n" + (data.path || path);
          return;
        } catch (_) {
          bridgeReady = false;
        }
        // 助手不可用时降级为浏览器新标签播放。
        // http 下优先相对路径；file:// 下优先 file:/// 绝对路径
        const url = (ON_HTTP && v.src) ? v.src : (fileUrl || v.src || "");
        if (!openInBrowser(url)) {
          alert("没有可打开的视频路径");
          return;
        }
        $("minfo").textContent = "已在新标签打开视频\n" + (path || url);
      }
    }

    function setupScopeSticky() {
      const main = $("mainScroll");
      const filters = $("filters");
      const sticky = $("scopeSticky");
      const btn = $("scopeFilterBtn");
      if (!main || !filters || !sticky || !btn) return;
      if (sticky.dataset.bound === "1") return;
      sticky.dataset.bound = "1";
      // 筛选栏滚出视口后，吸顶条高亮「筛选」提示可回去
      if ("IntersectionObserver" in window) {
        const io = new IntersectionObserver(
          (entries) => {
            const visible = entries.some((e) => e.isIntersecting);
            sticky.classList.toggle("is-stuck", !visible);
          },
          { root: main, threshold: 0 }
        );
        io.observe(filters);
      }
      btn.addEventListener("click", () => {
        filters.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    function refresh() {
      let catList = categoryVideos();
      if (state.ext) {
        const ext = state.ext.startsWith(".") ? state.ext : ("." + state.ext);
        catList = catList.filter((v) => (v.ext || "").toLowerCase() === ext.toLowerCase());
      }
      if (state.q) {
        const q = state.q.toLowerCase();
        catList = catList.filter((v) => (v.name + " " + (v.folder || "")).toLowerCase().includes(q));
      }
      const scoped = baseScoped();
      renderChannels();
      renderSorts();
      renderGenreTags(scoped);
      renderExtTags(categoryVideos());
      renderSubTags(catList);
      renderStickyFilterRow();
      renderGrid();
      renderScopeBar();
    }

    function onFilterChange(push) {
      refresh();
      if (push) pushFilterHistory();
    }

    $("channels").addEventListener("click", (e) => {
      const el = e.target.closest("[data-cat]");
      if (!el) return;
      state.cat = el.dataset.cat || "";
      state.folder = "";
      state.folderAll = false;
      state.genre = "";
      onFilterChange(true);
    });
    $("sortTags").addEventListener("click", (e) => {
      const b = e.target.closest("[data-sort]");
      if (!b) return;
      state.sort = b.dataset.sort;
      onFilterChange(true);
    });
    $("viewTags").addEventListener("click", (e) => {
      const b = e.target.closest("[data-view]");
      if (!b) return;
      state.view = b.dataset.view || "series";
      try { localStorage.setItem("vg_static_view", state.view); } catch (_) {}
      onFilterChange(true);
    });
    $("genreTags").addEventListener("click", (e) => {
      const b = e.target.closest("[data-genre]");
      if (!b) return;
      state.genre = b.dataset.genre || "";
      onFilterChange(true);
    });
    $("extTags").addEventListener("click", (e) => {
      const b = e.target.closest("[data-ext]");
      if (!b) return;
      state.ext = b.dataset.ext || "";
      onFilterChange(true);
    });
    $("subFolderRows").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-folder]");
      if (!btn) return;
      applyFolderButton(btn);
    });
    $("scopeSticky").addEventListener("click", (e) => {
      if (e.target.closest("#scopeFilterBtn")) return;
      const folderBtn = e.target.closest("[data-folder]");
      if (folderBtn) {
        applyFolderButton(folderBtn);
        return;
      }
      const sortBtn = e.target.closest("[data-sort]");
      if (sortBtn) {
        state.sort = sortBtn.dataset.sort;
        onFilterChange(true);
        return;
      }
      const genreBtn = e.target.closest("[data-genre]");
      if (genreBtn) {
        state.genre = genreBtn.dataset.genre || "";
        onFilterChange(true);
        return;
      }
      const extBtn = e.target.closest("[data-ext]");
      if (extBtn) {
        state.ext = extBtn.dataset.ext || "";
        onFilterChange(true);
      }
    });
    let qTimer = 0;
    $("q").addEventListener("input", (e) => {
      state.q = e.target.value.trim();
      refresh();
      clearTimeout(qTimer);
      qTimer = setTimeout(() => pushFilterHistory(), 400);
    });
    $("grid").addEventListener("click", (e) => {
      const card = e.target.closest(".card");
      if (!card) return;
      const kind = card.dataset.kind || "";
      if (kind === "series") {
        const cardData = cachedList.find((x) => x.id === card.dataset.id && x.kind === "series");
        openSeriesModal(cardData);
        return;
      }
      const v = DATA.videos.find((x) => x.id === card.dataset.id);
      if (v) openItem(v);
    });

    function openSeriesModal(card) {
      const box = $("seriesModalList");
      const title = $("seriesModalTitle");
      if (!card || !box) return;
      title.textContent = card.name || "剧集";
      const eps = card._episodes || DATA.videos.filter((x) => (x.series_id || "") === card.series_id)
        .sort((a, b) => (a.season || 0) - (b.season || 0) || (a.episode || 0) - (b.episode || 0));
      box.innerHTML = eps.map((ep) => {
        const label = (ep.season != null && ep.episode != null)
          ? `S${String(ep.season).padStart(2, "0")}E${String(ep.episode).padStart(2, "0")} · ${esc(ep.name || "")}`
          : esc(ep.name || "");
        return `<button type="button" data-epid="${esc(ep.id)}" style="display:block;width:100%;text-align:left;margin:6px 0;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--text);cursor:pointer">${label}<br><span style="opacity:.7;font-size:.8em">${esc(ep.size_h || "")} · ${esc(ep.folder || "")}</span></button>`;
      }).join("") || "暂无分集";
      $("seriesModal").classList.add("open");
    }
    $("seriesModalClose").addEventListener("click", () => $("seriesModal").classList.remove("open"));
    $("seriesModal").addEventListener("click", (e) => {
      if (e.target === $("seriesModal")) $("seriesModal").classList.remove("open");
    });
    $("seriesModalList").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-epid]");
      if (!btn) return;
      const v = DATA.videos.find((x) => x.id === btn.dataset.epid);
      $("seriesModal").classList.remove("open");
      if (v) openItem(v);
    });
    $("btnClose").addEventListener("click", closePlayer);
    $("btnLocalOpen").addEventListener("click", () => localAction("open"));
    $("btnCopyPath").addEventListener("click", () => localAction("path"));
    $("btnReveal").addEventListener("click", () => localAction("reveal"));
    $("modal").addEventListener("click", (e) => {
      if (e.target === $("modal")) closePlayer();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && $("modal").classList.contains("open")) closePlayer();
    });
    window.addEventListener("popstate", (e) => {
      if ($("modal").classList.contains("open") || location.hash === "#play") {
        // 从播放页返回：只关播放器
        if ($("modal").classList.contains("open")) {
          closingFromPop = true;
          destroyHls();
          const video = $("player");
          video.pause();
          video.removeAttribute("src");
          video.load();
          $("modal").classList.remove("open");
          state.cur = null;
          closingFromPop = false;
        }
        if (e.state && e.state.vgFilter) applyFilterState(e.state);
        return;
      }
      if (e.state && e.state.vgFilter) applyFilterState(e.state);
      else if (!e.state) {
        // 回到最初
        readFiltersFromUrl();
        refresh();
      }
    });

    if (!DATA.videos || !DATA.videos.length) {
      $("empty").style.display = "block";
      $("empty").textContent = "data.js 无数据。请先在服务版里扫描并点「导出静态站」。";
    } else {
      for (const v of DATA.videos) {
        if (!v.category) v.category = videoCat(v);
        if (!Array.isArray(v.genres)) v.genres = [];
      }
      readFiltersFromUrl();
      try {
        const savedView = localStorage.getItem("vg_static_view");
        if (savedView === "flat" || savedView === "series") state.view = savedView;
      } catch (_) {}
      if (location.hash === "#play") {
        history.replaceState(null, "", location.pathname + location.search);
      }
      if (!ON_HTTP) {
        // file:// 也可浏览；打开视频/位置走浏览器链接
      }
      const TIP_KEY = "vg_static_tip_dismissed";
      try {
        if (!localStorage.getItem(TIP_KEY)) {
          $("exportTip").classList.add("show");
        }
      } catch (_) {}
      $("tipDismiss").addEventListener("click", () => {
        $("exportTip").classList.remove("show");
        try { localStorage.setItem(TIP_KEY, "1"); } catch (_) {}
      });
      setupScopeSticky();
      refresh();
    }
  </script>
</body>
</html>
