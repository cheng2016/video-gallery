    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }
    function escapeAttr(s) { return escapeHtml(s); }

    // events
    $("channelList").addEventListener("click", (e) => {
      const unmount = e.target.closest("[data-unmount]");
      if (unmount) {
        e.preventDefault();
        e.stopPropagation();
        const path = unmount.getAttribute("data-unmount");
        if (!confirm("从片库移出：\n" + path + "\n（不删除磁盘文件）")) return;
        fetch("/api/roots", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "remove", path }),
        }).then((r) => r.json()).then((data) => {
          alert(data.msg || (data.ok ? "已移除" : "失败"));
          if (state.lib === path) state.lib = "";
          return refresh();
        }).catch((err) => alert("失败: " + err));
        return;
      }
      const expand = e.target.closest("[data-expand-lib]");
      const diskHeader = e.target.closest("[data-disk-header]");
      if (expand || diskHeader) {
        e.preventDefault();
        e.stopPropagation();
        const path = expand
          ? expand.getAttribute("data-expand-lib")
          : diskHeader.getAttribute("data-disk-header");
        if (!(state.libExpanded instanceof Set)) state.libExpanded = new Set();
        const existing = [...state.libExpanded].find((p) => sameLibPath(p, path));
        if (existing) state.libExpanded.delete(existing);
        else state.libExpanded.add(path);
        renderChannels(state.categories || [], state.totalCount || 0);
        return;
      }
      const item = e.target.closest(".channel-item");
      if (!item || !item.hasAttribute("data-cat")) return;
      const nextLib = item.getAttribute("data-lib");
      const prevLib = state.lib || "";
      state.lib = nextLib == null ? (state.lib || "") : (nextLib || "");
      state.category = item.dataset.cat || "";
      state.folder = "";
      state.folderAll = false;
      // 换盘时清掉上一盘残留的格式/类型，避免「该盘全部」被滤成空白
      if (!sameLibPath(prevLib, state.lib)) {
        state.ext = "";
        state.genre = "";
      }
      if (state.lib) {
        if (!(state.libExpanded instanceof Set)) state.libExpanded = new Set();
        state.libExpanded.add(state.lib);
      }
      saveUiPrefs();
      refresh();
      if (isMobile()) $("sidebar").classList.remove("open");
    });

    let cleanupType = "dup";

    function thumbHtml(id, thumbV, hasThumb, root) {
      const vid = id || "";
      const tv = thumbV || (hasThumb ? 1 : 0);
      if (!vid) {
        return `<div class="media-row-thumb"><span class="ph">无图</span></div>`;
      }
      const rootQ = root ? `&root=${encodeURIComponent(root)}` : "";
      return `<div class="media-row-thumb">
        <img src="/thumb/${escapeAttr(vid)}?v=${tv}${rootQ}" alt="" loading="lazy" decoding="async"
          onerror="this.style.display='none';this.parentNode.querySelector('.ph').style.display='flex'" />
        <span class="ph" style="display:none">无图</span>
      </div>`;
    }

    function pickKeepId(items, mode) {
      if (!items.length) return "";
      if (mode === "newest") {
        return items.slice().sort((a, b) => (b.mtime || 0) - (a.mtime || 0))[0].id;
      }
      if (mode === "largest") {
        return items.slice().sort((a, b) => (b.size || 0) - (a.size || 0))[0].id;
      }
      return items[0].id;
    }

    function fillCleanupScopeSelects(data) {
      const libSel = $("cleanupLib");
      const catSel = $("cleanupCat");
      if (!libSel || !catSel) return;
      const roots = data.roots || state.mountedRoots || [];
      const prevLib = cleanupLib;
      libSel.innerHTML = `<option value="">全部盘</option>` + roots.map((r) => {
        const path = r.path || "";
        const label = r.label || path;
        const n = r.count != null ? `（${r.count}）` : "";
        return `<option value="${escapeAttr(path)}">${escapeHtml(label)}${n}</option>`;
      }).join("");
      if (prevLib && [...libSel.options].some((o) => sameLibPath(o.value, prevLib))) {
        const hit = [...libSel.options].find((o) => sameLibPath(o.value, prevLib));
        if (hit) libSel.value = hit.value;
      } else {
        libSel.value = "";
        cleanupLib = "";
      }
      cleanupLib = libSel.value || "";

      const cats = data.categories || [];
      const prevCat = cleanupCat;
      catSel.innerHTML = `<option value="">全部频道</option>` + cats.map((c) => {
        const id = c.id == null ? "" : String(c.id);
        const name = c.name || id || "未分类";
        const n = c.count != null ? `（${c.count}）` : "";
        return `<option value="${escapeAttr(id)}">${escapeHtml(name)}${n}</option>`;
      }).join("");
      if (prevCat && [...catSel.options].some((o) => o.value === prevCat)) {
        catSel.value = prevCat;
      } else {
        catSel.value = "";
        cleanupCat = "";
      }
      cleanupCat = catSel.value || "";
    }

    async function loadCleanup(type, opts) {
      opts = opts || {};
      cleanupType = type || "dup";
      $("cleanupTabDup").classList.toggle("primary", cleanupType === "dup");
      $("cleanupTabBad").classList.toggle("primary", cleanupType === "bad");
      if (!cleanupScopeReady || opts.fromBrowse) {
        cleanupLib = state.lib || "";
        cleanupCat = state.category || "";
        cleanupScopeReady = true;
      }
      const body = $("cleanupBody");
      const hint = $("cleanupHint");
      body.innerHTML = "加载中…";
      if (hint) hint.textContent = "正在按所选范围扫描…";
      try {
        const params = new URLSearchParams();
        params.set("type", cleanupType);
        if (cleanupLib) params.set("lib", cleanupLib);
        if (cleanupCat) params.set("category", cleanupCat);
        const data = await fetch("/api/cleanup?" + params).then((r) => r.json());
        if (!data.ok) {
          body.textContent = data.msg || "加载失败";
          return;
        }
        fillCleanupScopeSelects(data);
        // Keep selects aligned with what the API actually used
        if (data.scope) {
          if (data.scope.lib != null) cleanupLib = data.scope.lib || "";
          if (data.scope.category != null) cleanupCat = data.scope.category || "";
          if ($("cleanupLib") && cleanupLib) {
            const hit = [...$("cleanupLib").options].find((o) => sameLibPath(o.value, cleanupLib));
            if (hit) $("cleanupLib").value = hit.value;
          }
          if ($("cleanupCat")) $("cleanupCat").value = cleanupCat;
        }
        const scope = data.scope || {};
        const scopeBits = [];
        if (cleanupLib) {
          const r = (data.roots || []).find((x) => sameLibPath(x.path, cleanupLib));
          scopeBits.push(r ? r.label : "当前盘");
        } else {
          scopeBits.push("全部盘");
        }
        if (cleanupCat === "__root__") scopeBits.push("未分类");
        else if (cleanupCat) scopeBits.push(cleanupCat);
        else scopeBits.push("全部频道");
        scopeBits.push(`范围内 ${scope.video_count != null ? scope.video_count : "?"} 部`);
        if (hint) {
          hint.innerHTML = `<strong>范围</strong>：${escapeHtml(scopeBits.join(" · "))}。`
            + ` <strong>判定</strong>：${escapeHtml(scope.rules || "同名或同体积的不同文件")}。`
            + ` 切换上方「盘 / 频道」后会重新扫描。`;
        }
        const groups = (data.groups || []).filter((g) => (g.items || []).length);
        if (!groups.length) {
          body.textContent = cleanupType === "bad"
            ? "当前范围内没有标记为损坏的文件"
            : "当前范围内没有发现重复组（可换频道或选「全部频道」再试）";
          body.dataset.groups = "[]";
          return;
        }
        body.innerHTML = groups.map((g, gi) => {
          const items = g.items || [];
          const keepNewest = pickKeepId(items, "newest");
          const rows = items.map((it) => {
            const isKeep = cleanupType === "dup" && it.id === keepNewest;
            const checked = cleanupType === "bad" ? "checked" : (isKeep ? "" : "checked");
            const keepTag = isKeep ? ` <span style="color:var(--accent)">保留·最新</span>` : "";
            const reason = it.reason ? ` · ${escapeHtml(it.reason)}` : "";
            const lib = it.lib_label ? ` · ${escapeHtml(it.lib_label)}` : "";
            return `
            <div class="media-row">
              <input type="checkbox" class="cleanup-check media-row-check" data-id="${escapeAttr(it.id)}" data-root="${escapeAttr(it.root || "")}" data-rel="${escapeAttr(it.rel || "")}" ${checked} />
              ${thumbHtml(it.thumb_id || it.id, it.thumb_v, it.has_thumb, it.root)}
              <div class="media-row-body">
                <strong title="${escapeAttr(it.name || "")}">${escapeHtml(it.name || "")}${keepTag}</strong>
                <div class="media-row-meta">${escapeHtml(it.size_h || "")} · ${escapeHtml(it.mtime_h || "")} · ${escapeHtml(it.folder || "")}${lib}${reason}<br>${escapeHtml(it.path || "")}</div>
                <div class="media-row-actions">
                  <button type="button" class="btn cleanup-reveal" data-id="${escapeAttr(it.id)}" data-root="${escapeAttr(it.root || "")}">打开位置</button>
                  ${cleanupType === "dup" ? `<button type="button" class="btn cleanup-keep-one" data-id="${escapeAttr(it.id)}">只留这个</button>` : ""}
                </div>
              </div>
            </div>`;
          }).join("");
          const tools = cleanupType === "dup"
            ? `<button type="button" class="btn cleanup-keep-mode" data-mode="newest" data-gi="${gi}">只留最新</button>
               <button type="button" class="btn cleanup-keep-mode" data-mode="largest" data-gi="${gi}">只留最大</button>`
            : "";
          return `<div class="cleanup-group" style="border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:12px" data-gi="${gi}">
            <div style="margin-bottom:8px"><strong>${escapeHtml(g.reason || "")}</strong> · ${items.length} 项 · 勾选=删除</div>
            ${rows}
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
              ${tools}
              <button type="button" class="btn primary cleanup-del-group" data-gi="${gi}">删除勾选（进回收站）</button>
            </div>
          </div>`;
        }).join("");
        body.dataset.groups = JSON.stringify(groups);
      } catch (err) {
        body.textContent = "加载失败: " + err;
      }
    }

      if (reveal) {
        e.preventDefault();

        try {

            method: "POST",

      const keepOne = e.target.closest(".cleanup-keep-one");

        const items = (groups[gi] && groups[gi].items) || [];

        panel.querySelectorAll(".cleanup-check").forEach((c) => {
          c.checked = c.dataset.id !== keepId;

        return;

      const del = e.target.closest(".cleanup-del-group");

        .map((c) => ({ id: c.dataset.id, root: c.dataset.root || "", rel: c.dataset.rel || "" }))
        .filter((it) => it.id);

        alert("请先勾选要删除的文件");

      if (!confirm(`将 ${items.length} 个文件移到回收站，并从片库移除。继续？`)) return;
      try {
        const r = await fetch("/api/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items, trash: true }),

        const data = await r.json();

    async function loadHistory(kind) {
      histKind = kind || "resume";
      $("histTabResume").classList.toggle("primary", histKind === "resume");
      $("histTabRecent").classList.toggle("primary", histKind === "recent");
      $("histTabDone").classList.toggle("primary", histKind === "done");
      const body = $("historyBody");
      const rows = historyEntries(histKind).slice(0, 80);
      if (!rows.length) {
        body.textContent = histKind === "done" ? "还没有已看完的记录" : (histKind === "recent" ? "暂无观看记录" : "没有未看完的片");
        return;
      }
      body.innerHTML = "加载中…";
      try {
        const data = await fetch("/api/videos-by-ids", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ids: rows.map((r) => r.id), hints: historyHints(rows) }),
        }).then((r) => r.json());
        const byId = {};
        (data.videos || []).forEach((v) => { byId[v.id] = v; });
        const offlineRoots = new Set(data.offline_roots || []);
        body.innerHTML = rows.map((r) => {
          const v = byId[r.id];
          const title = escapeHtml((v && v.name) || r.name || r.id);
          let meta;
          if (v) {
            const disk = (v.root || r.root || "").replace(/\\/g, "/");
            const diskHint = disk ? disk.split("/").filter(Boolean)[0] || disk : "";
            meta = `${escapeHtml(v.size_h || "")} · ${escapeHtml(v.folder || "")}` +
              (diskHint ? ` · ${escapeHtml(diskHint)}` : "");
          } else if (r.root && offlineRoots.has(r.root)) {
            meta = escapeHtml("磁盘未连接：" + r.root);
          } else if (r.root) {
            meta = escapeHtml(r.folder || r.root || "（其他磁盘）");
          } else {
            meta = escapeHtml(r.folder || "（不在当前片库）");
          }
          const dur = Number(r.duration) || 0;
          const pct = (!r.done && dur > 0) ? Math.min(99, Math.round((r.t / dur) * 100)) + "%" : (r.done ? "已看完" : "");
          const thumbRoot = (v && v.root) || r.root || "";
          const thumb = thumbHtml(r.id, v && v.thumb_v, v && v.has_thumb, thumbRoot);
          return `<button type="button" class="media-row-btn" data-hist-id="${escapeAttr(r.id)}" data-hist-root="${escapeAttr(r.root || (v && v.root) || "")}">
            ${thumb}
            <span class="media-row-body">
              <strong>${title} ${pct ? `<span style="opacity:.7;font-weight:400">${pct}</span>` : ""}</strong>
              <span class="media-row-meta">${meta}</span>
            </span>
          </button>`;
        }).join("");
      } catch (err) {
        body.textContent = "加载失败: " + err;
      }
    }

      $("libNav").addEventListener("click", async (e) => {
        const unmount = e.target.closest("[data-unmount]");
        if (unmount) {
          e.preventDefault();
          e.stopPropagation();
          const path = unmount.getAttribute("data-unmount");
          if (!confirm("从片库移出：\n" + path + "\n（不删除磁盘文件）")) return;
          try {
            const r = await fetch("/api/roots", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "remove", path }),
            });
            const data = await r.json();
            alert(data.msg || (data.ok ? "已移除" : "失败"));
            if (state.lib === path) state.lib = "";
            try { await refresh(); } catch (_) {}
          } catch (err) {
            alert("失败: " + err);
          }
          return;
        }
        const item = e.target.closest(".lib-nav-item[data-lib]");
        if (!item) return;
        selectLib(item.getAttribute("data-lib") || "");
      });
    }

    $("rescanBtn").addEventListener("click", async () => {
      if (!confirm("增量重新扫描？\n会对比文件变化（新增/删除/修改），未改动的复用缓存，比全盘重做更快。")) return;
      await scanSelectedDrive(true);
    });

    // —— 转换队列 ——
    let queuePollTimer = 0;
    async function loadQueueModal() {
      const body = $("queueBody");
      if (!body) return;
      try {
        const data = await fetch("/api/convert/queue").then((r) => r.json());
        const par = $("queueParallel");
        if (par && data.parallel) par.value = String(data.parallel);
        const jobs = data.jobs || [];
        if (!jobs.length) {
          body.textContent = "队列为空。播放页可「转成 MP4 / 修复声音」；清理页可批量加入。";
          return;
        }
        body.innerHTML = jobs.map((j) => {
          const st = j.status || "";
          const canCancel = st === "queued" || st === "running";
          const kind = j.kind === "fix_audio" ? "修声音" : "转MP4";
          return `<div class="media-row">
            <div class="media-row-body">
              <strong>${escapeHtml(j.name || j.vid)} <span style="opacity:.7;font-weight:400">${kind} · ${escapeHtml(st)} ${j.percent ? j.percent + "%" : ""}</span></strong>
              <div class="media-row-meta">${escapeHtml(j.msg || "")}</div>
              <div class="media-row-actions">
                ${canCancel ? `<button type="button" class="btn queue-cancel" data-jid="${escapeAttr(j.id)}">取消</button>` : ""}
              </div>
            </div>
          </div>`;
        }).join("");
        const qbtn = $("queueBtn");
        if (qbtn && data.active) qbtn.textContent = `队列(${data.active})`;
        else if (qbtn) qbtn.textContent = "队列";
      } catch (err) {
        body.textContent = "加载失败: " + err;
      }
    }
    function openQueueModal() {
      $("queueModal").classList.add("open");
      loadQueueModal();
      if (queuePollTimer) clearInterval(queuePollTimer);
      queuePollTimer = setInterval(loadQueueModal, 1500);
    }
    function closeQueueModal() {
      $("queueModal").classList.remove("open");
      if (queuePollTimer) { clearInterval(queuePollTimer); queuePollTimer = 0; }
    }
    if ($("queueBtn")) $("queueBtn").addEventListener("click", openQueueModal);
    if ($("queueModalClose")) $("queueModalClose").addEventListener("click", closeQueueModal);
    if ($("queueModal")) $("queueModal").addEventListener("click", (e) => {
      if (e.target === $("queueModal")) closeQueueModal();
    });
    if ($("queueRefreshBtn")) $("queueRefreshBtn").addEventListener("click", loadQueueModal);
    if ($("queueParallel")) {
      $("queueParallel").addEventListener("change", async () => {
        const parallel = Number($("queueParallel").value) || 1;
        await fetch("/api/convert/batch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ids: [], kind: "mp4", parallel }),
        }).catch(() => {});
        loadQueueModal();
      });
    }
    if ($("queueBody")) {
      $("queueBody").addEventListener("click", async (e) => {
        const btn = e.target.closest(".queue-cancel");
        if (!btn) return;
        const jid = btn.dataset.jid;
        await fetch("/api/convert-mp4/job/" + encodeURIComponent(jid) + "/cancel", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: "{}",
        });
        loadQueueModal();
      });
    }

    // —— 换封面 ——
    if ($("btnCover")) {
      $("btnCover").addEventListener("click", () => {
        const p = $("coverPanel");
        if (!p) return;
        p.style.display = p.style.display === "none" ? "flex" : "none";
        const video = $("player");
        if (video && $("coverSeek") && video.currentTime > 0) {
          $("coverSeek").value = String(Math.floor(video.currentTime * 10) / 10);
        }
      });
    }
    async function applyCoverSeek(seek) {
      if (!currentPlayId) return;
      $("modalInfo").textContent = "正在截取封面…";
      try {
        const root = (currentPlayMeta && currentPlayMeta.root) || "";
        const url = "/api/thumb/" + encodeURIComponent(currentPlayId) + (root ? ("?root=" + encodeURIComponent(root)) : "");
        const r = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ seek }),
        });
        const data = await r.json();
        $("modalInfo").textContent = data.msg || (data.ok ? "封面已更新" : "失败");
        if (data.ok) {
          try { await refresh(); } catch (_) {}
        }
      } catch (e) {
        $("modalInfo").textContent = "换封面失败: " + e;
      }
    }
    if ($("btnCoverSeek")) {
      $("btnCoverSeek").addEventListener("click", () => {
        const seek = Number($("coverSeek") && $("coverSeek").value) || 3;
        applyCoverSeek(seek);
      });
    }
    if ($("btnCoverNow")) {
      $("btnCoverNow").addEventListener("click", () => {
        const video = $("player");
        const seek = video ? (video.currentTime || 0) : 3;
        if ($("coverSeek")) $("coverSeek").value = String(Math.floor(seek * 10) / 10);
        applyCoverSeek(seek);
      });
    }
    if ($("coverFile")) {
      $("coverFile").addEventListener("change", async () => {
        const f = $("coverFile").files && $("coverFile").files[0];
        if (!f || !currentPlayId) return;
        const fd = new FormData();
        fd.append("file", f);
        const root = (currentPlayMeta && currentPlayMeta.root) || "";
        const url = "/api/thumb/" + encodeURIComponent(currentPlayId) + (root ? ("?root=" + encodeURIComponent(root)) : "");
        $("modalInfo").textContent = "正在上传封面…";
        try {
          const r = await fetch(url, { method: "POST", body: fd });
          const data = await r.json();
          $("modalInfo").textContent = data.msg || (data.ok ? "封面已更新" : "失败");
          if (data.ok) try { await refresh(); } catch (_) {}
        } catch (e) {
          $("modalInfo").textContent = "上传失败: " + e;
        }
        $("coverFile").value = "";
      });
    }

    renderMountChips();

    // —— 隐私模式 ——
    async function openPrivacyModal() {
      try {
        const data = await fetch("/api/privacy").then((r) => r.json());
        if (!data.ok) {
          alert(data.msg || "无法读取隐私设置");
          return;
        }
        $("privacyEncrypt").checked = !!data.encrypt_thumbs;
        const loc = data.cache_location === "disk" ? "disk" : "program";
        document.querySelectorAll('input[name="privacyCacheLoc"]').forEach((el) => {
          el.checked = el.value === loc;
        });
        $("privacyPathHint").textContent = "当前：" + (data.cache_hint || data.cache_path || "");
        $("privacyModal").classList.add("open");
      } catch (e) {
        alert("读取失败: " + e);
      }
    }
    if ($("privacyBtn")) $("privacyBtn").addEventListener("click", openPrivacyModal);
    if ($("privacyModalClose")) $("privacyModalClose").addEventListener("click", () => $("privacyModal").classList.remove("open"));
    if ($("privacyCancel")) $("privacyCancel").addEventListener("click", () => $("privacyModal").classList.remove("open"));
    if ($("privacyModal")) $("privacyModal").addEventListener("click", (e) => {
      if (e.target === $("privacyModal")) $("privacyModal").classList.remove("open");
    });
    if ($("privacySave")) $("privacySave").addEventListener("click", async () => {
      const encrypt = !!($("privacyEncrypt") && $("privacyEncrypt").checked);
      const locEl = document.querySelector('input[name="privacyCacheLoc"]:checked');
      const cache_location = (locEl && locEl.value) || "program";
      try {
        const r = await fetch("/api/privacy", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ encrypt_thumbs: encrypt, cache_location }),
        });
        const data = await r.json();
        if (!data.ok) {
          alert(data.msg || "保存失败");
          return;
        }
        $("privacyModal").classList.remove("open");
        alert(data.msg || "已保存");
        try { await refresh(); } catch (_) {}
      } catch (e) {
        alert("保存失败: " + e);
      }
    });

    $("exportStaticBtn").addEventListener("click", async () => {
      if (!state.root) {
        alert("请先打开/扫描一个盘");
        return;
      }
      if (!confirm(
        "导出纯静态站？\n\n" +
        "会生成到当前盘根目录下的 _video_gallery_static/\n" +
        "内含 index.html、预览图、data.js。\n" +
        "之后双击「打开图库.bat」即可浏览，无需启动本服务。\n" +
        "（视频文件不会被复制，仍引用原路径。）"
      )) return;
      $("exportStaticBtn").disabled = true;
      $("exportStaticBtn").textContent = "正在导出…";
      $("status").textContent = "正在导出静态站…";
      try {
        const r = await fetch("/api/export-static", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ open_folder: true }),
        });
        const data = await r.json();
        if (!data.ok) {
          alert(data.msg || "导出失败");
          $("exportStaticBtn").disabled = false;
          $("exportStaticBtn").textContent = "导出静态站";
          return;
        }
        startPoll();
        // 轮询直到结束
        const waitDone = async () => {
          for (let i = 0; i < 600; i++) {
            await new Promise((res) => setTimeout(res, 1000));
            const st = await fetch("/api/export-static/status").then((x) => x.json()).catch(() => null);
            if (!st) continue;
            if (st.exporting) {
              if (st.msg) $("status").textContent = st.msg;
              continue;
            }
            $("exportStaticBtn").textContent = "导出静态站";
            $("exportStaticBtn").disabled = false;
            if (st.ok) {
              $("status").textContent = st.msg || ("已导出: " + (st.path || ""));
              alert(st.msg || "导出完成");
            } else {
              alert(st.msg || "导出失败");
            }
            return;
          }
          $("exportStaticBtn").textContent = "导出静态站";
          $("exportStaticBtn").disabled = false;
          alert("导出仍在进行，请稍后再看状态栏或导出目录。");
        };
        waitDone();
      } catch (e) {
        alert("导出请求失败: " + e);
        $("exportStaticBtn").disabled = false;
        $("exportStaticBtn").textContent = "导出静态站";
      }
    });

    $("menuBtn").addEventListener("click", toggleSidebar);
    $("sidebarHideBtn").addEventListener("click", () => setSidebarHidden(true));
    $("sidebarShowBtn").addEventListener("click", () => setSidebarHidden(false));

    try {
      if (localStorage.getItem("vg_sidebar_hidden") === "1" && !isMobile()) {
        setSidebarHidden(true);
      }
    } catch (_) {}

    setupScopeSticky();

    // 打开页面：先自动检测盘符数量，再刷新列表
    (async () => {
      $("status").textContent = "正在自动检测本机盘符…";
      const driveData = await loadDrives();
      const n = (driveData.drives || state.drives || []).length;
      const letters = (state.drives || []).map((d) => d.letter).join("、");
      $("status").textContent = n
        ? `已自动检测到 ${n} 个盘符${letters ? "：" + letters : ""}。选择盘符后点「扫描所选盘」，不同盘会自动加入同一片库。`
        : "未检测到盘符，请检查硬盘是否已连接，或重启 start.bat";

      await refreshTree();
      await refresh();
      const d = await fetchTree();
      startPoll();
      if (!d.scanning && n) {
        // 若服务端还没在扫，状态里保留盘符检测结果
        const cur = $("status").textContent || "";
        if (!cur.includes("扫描")) {
          $("status").textContent =
            `已自动检测到 ${n} 个盘符${letters ? "：" + letters : ""} · 当前 ${d.root || selectedDrivePath() || ""}`;
        }
      }
    })();
  </script>
</body>
</html>
