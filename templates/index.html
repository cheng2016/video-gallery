    function startPoll() {
      if (state._poll) return;
      let wasBusy = true;
      let lastThumbProgress = "";
      let lastScanProgress = "";
      let lastLibGen = state._libGen || 0;
      let lastScanFound = -1;
      let thumbRefreshTimer = 0;
      // lastFullRefresh now lives on state._lastFullRefresh so every caller
      // (polling, click handlers, filter changes) shares the same throttle
      // clock instead of letting clicks trigger a full rebuild and the next
      // polling tick fire a second one <1s later (visual jitter).
      if (typeof state._lastFullRefresh !== "number") state._lastFullRefresh = 0;
      let driveTick = 0;
      let pollInFlight = false;

      state._poll = setInterval(async () => {
        if (pollInFlight) return;
        pollInFlight = true;
        try {
          const r = await fetch("/api/status");
          const d = await r.json();
          state._lastScanning = !!d.scanning;
          state._updating = !!d.updating;
          if (typeof d.full_logging === "boolean") {
            state._fullLogging = d.full_logging;
          }
          if (typeof d.lan_share === "boolean") {
            syncLanShareUi(d.lan_share, null, "poll");
          } else {
            clientLog("lan_share_ui_sync", {
              source: "poll",
              skipped: true,
              reason: "lan_share_missing_in_status",
              lan_share_typeof: typeof d.lan_share,
              status_keys: Object.keys(d || {}).slice(0, 20),
            }, "WARN");
          }
          // A directory is already browsable while thumbnails/metadata run,
          // but polling must stay alive so a newly published disk generation
          // is painted instead of leaving the sidebar on the previous disk.
          const busy = !!(
            d.scanning || d.updating || d.meta_running || (d.thumb_pending || 0) > 0
          );
          const gen = d.lib_gen || 0;
          const found = d.scan_found || 0;
          const genChanged = gen !== lastLibGen;
          // Bumped from 100 → 500 so large scans do not trigger a full page
          // rebuild every couple of seconds.  The count label is still updated
          // in realtime via the status banner, users can see progress without
          // their grid jumping back to the top.
          const foundJump = found > 0 && (lastScanFound < 0 || found - lastScanFound >= 500);
          const now = Date.now();

          const bits = [];
          if (d.scan_progress) bits.push(d.scan_progress);
          if (d.thumb_progress) bits.push(d.thumb_progress);
          if (d.meta_progress) bits.push(d.meta_progress);
          if (found > 0 && d.scanning) bits.push("本盘 " + found);
          const detail = bits.join(" · ");
          if (detail) {
            const head = state.multi
              ? ("片库扫描中" + (state.lib ? " · 当前盘" : " · 全部"))
              : (d.root ? ("当前: " + d.root) : "扫描中");
            $("status").textContent = head + " · " + detail;
            $("status").title = $("status").textContent;
          }
          const scanBusy = !!d.scanning || !!d.background_busy;
          $("rescanBtn").disabled = scanBusy;
          $("scanDriveBtn").disabled = scanBusy;
          $("driveSelect").disabled = scanBusy;

          if (busy) {
            wasBusy = true;
            // Throttle against all refresh callers, not only polling.
            const canFull = now - state._lastFullRefresh >= 3000;
            // soft=true = polling-triggered refresh: preserve user scroll
            // position so browsing during a scan does not keep bouncing the
            // grid back to offset 0.
            if (canFull && (genChanged || foundJump)) {
              state._lastFullRefresh = now;
              lastLibGen = gen;
              lastScanFound = found;
              state._libGen = gen;
              // genChanged means publish_unified_library merged a new disk
              // into STATE.videos → MUST refresh sidebar mounts too or
              // G:\\:0 stays on 0 even though STATE.videos grows.
              await refresh({ soft: true, nav: true });
            } else if (
              canFull &&
              d.scan_progress &&
              d.scan_progress !== lastScanProgress &&
              String(d.scan_progress).includes("扫描完成")
            ) {
              state._lastFullRefresh = now;
              lastLibGen = gen;
              state._libGen = gen;
              // Scan finished → lib_gen is about to bump; sync sidebar.
              await refresh({ soft: true, nav: true });
            } else if (d.thumb_progress && d.thumb_progress !== lastThumbProgress) {
              lastThumbProgress = d.thumb_progress;
              if (now - thumbRefreshTimer > 3000) {
                thumbRefreshTimer = now;
                refreshVisibleThumbs();
              }
            }
          } else if (wasBusy) {
            wasBusy = false;
            lastLibGen = gen;
            state._libGen = gen;
            // All background work drained — make sure sidebar mounts land on
            // final counts instead of stale per-disk zeros.
            await refresh({ soft: true, nav: true });
            refreshVisibleThumbs();
            clearInterval(state._poll);
            state._poll = null;
          }
          lastScanProgress = d.scan_progress || lastScanProgress;
          driveTick += 1;
          if (driveTick % 6 === 0) await loadDrives();
          if (typeof d.lan_share === "boolean") {
            // Re-apply after soft refresh: cached /api/tree may briefly disagree.
            syncLanShareUi(d.lan_share, null, "poll_end");
          }
        } catch (e) {
          console.warn(e);
        } finally {
          pollInFlight = false;
        }
      }, 2000);
    }

    const THUMB_PENDING_SRC = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270">' +
      '<rect fill="#1a1d24" width="480" height="270"/>' +
      '<polygon points="210,100 210,170 280,135" fill="#4a5568"/></svg>'
    );
    const THUMB_CONCURRENCY = 8;
    const thumbsLoaded = new Set();
    const thumbWait = [];
    let thumbBusy = 0;
    let thumbObserver = null;
    let pageThumbObserver = null;

    function thumbUrlFor(id, tv, root) {
      return "/thumb/" + encodeURIComponent(id) + "?v=" + (tv || 0) + "&defer=1"
        + (root ? ("&root=" + encodeURIComponent(root)) : "");
    }

    function lazyThumbMarkup(id, tv, root) {
      const url = thumbUrlFor(id, tv, root);
      return `src="${THUMB_PENDING_SRC}" data-thumb-url="${escapeAttr(url)}" alt="" decoding="async"`;
    }

    function resetThumbQueue() {
      thumbWait.length = 0;
      if (thumbObserver) {
        thumbObserver.disconnect();
        thumbObserver = null;
      }
      if (pageThumbObserver) {
        pageThumbObserver.disconnect();
        pageThumbObserver = null;
      }
    }

    function onThumbVisible(entries, observer) {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        observer.unobserve(entry.target);
        queueThumb(entry.target);
      }
    }

    function bindThumbObserver() {
      if (thumbObserver) return thumbObserver;
      const root = $("contentScroll");
      thumbObserver = new IntersectionObserver(onThumbVisible, {
        root: root || null,
        rootMargin: "240px 0px",
        threshold: 0.01,
      });
      return thumbObserver;
    }

    function bindPageThumbObserver() {
      if (pageThumbObserver) return pageThumbObserver;
      pageThumbObserver = new IntersectionObserver(onThumbVisible, {
        root: null,
        rootMargin: "160px 0px",
        threshold: 0.01,
      });
      return pageThumbObserver;
    }

    function watchThumbs(scope) {
      const root = scope || document;
      const scroll = $("contentScroll");
      root.querySelectorAll("img[data-thumb-url]").forEach((img) => {
        if (img.dataset.thumbReady === "1") return;
        const url = img.dataset.thumbUrl;
        if (url && thumbsLoaded.has(url)) {
          img.src = url;
          img.dataset.thumbReady = "1";
          return;
        }
        if (img.dataset.thumbWatched === "1") return;
        img.dataset.thumbWatched = "1";
        const obs = (scroll && scroll.contains(img)) ? bindThumbObserver() : bindPageThumbObserver();
        obs.observe(img);
      });
    }

    function queueThumb(img) {
      if (!img || img.dataset.thumbReady === "1" || img.dataset.thumbLoading === "1") return;
      thumbWait.push(img);
      pumpThumbs();
    }

    function pumpThumbs() {
      while (thumbBusy < THUMB_CONCURRENCY && thumbWait.length) {
        const img = thumbWait.shift();
        if (!img || !img.isConnected || img.dataset.thumbReady === "1") continue;
        startThumb(img);
      }
    }

    function startThumb(img) {
      const url = img.dataset.thumbUrl;
      if (!url) return;
      img.dataset.thumbLoading = "1";
      thumbBusy += 1;
      // One request only — a separate probe Image used to double /thumb load and
      // starve the server when switching channels on large libraries.
      img.onload = () => {
        img.dataset.thumbLoading = "";
        thumbBusy = Math.max(0, thumbBusy - 1);
        thumbLoadReady(img);
        pumpThumbs();
      };
      img.onerror = () => {
        img.dataset.thumbLoading = "";
        thumbBusy = Math.max(0, thumbBusy - 1);
        if (img.isConnected) thumbLoadFailed(img);
        else pumpThumbs();
      };
      img.src = url;
    }

    function thumbLoadReady(img) {
      const src = img.currentSrc || img.src || "";
      if (src.startsWith("data:image/svg+xml")) return;
      img.dataset.thumbReady = "1";
      img.dataset.thumbAttempt = "0";
      if (img.dataset.thumbUrl) thumbsLoaded.add(img.dataset.thumbUrl);
      if (img._thumbRetryTimer) clearTimeout(img._thumbRetryTimer);
      img.style.display = "";
      img.style.opacity = "";
      const ph = img.parentNode && img.parentNode.querySelector(".ph");
      if (ph) ph.style.display = "none";
    }

    function thumbLoadFailed(img) {
      if (!img.dataset.thumbUrl && img.src && !img.src.startsWith("data:")) img.dataset.thumbUrl = img.src;
      const attempt = (Number(img.dataset.thumbAttempt) || 0) + 1;
      img.dataset.thumbAttempt = String(attempt);
      img.dataset.thumbReady = "";
      img.dataset.thumbLoading = "";
      img.dataset.thumbWatched = "1";
      img.onerror = null;
      img.onload = null;
      img.src = THUMB_PENDING_SRC;
      if (attempt >= 10) {
        pumpThumbs();
        return;
      }
      const delay = Math.min(4000, Math.round(400 * Math.pow(1.55, attempt - 1)));
      if (img._thumbRetryTimer) clearTimeout(img._thumbRetryTimer);
      img._thumbRetryTimer = setTimeout(() => {
        if (!img.isConnected) return;
        const url = new URL(img.dataset.thumbUrl, location.href);
        url.searchParams.set("_retry", String(Date.now()));
        img.dataset.thumbUrl = url.pathname + url.search;
        queueThumb(img);
      }, delay);
      pumpThumbs();
    }

    function requestThumbReload(img, url) {
      if (img._thumbRetryTimer) clearTimeout(img._thumbRetryTimer);
      img.dataset.thumbUrl = url;
      img.dataset.thumbAttempt = "0";
      img.dataset.thumbReady = "";
      img.dataset.thumbLoading = "";
      img.dataset.thumbWatched = "1";
      img.src = THUMB_PENDING_SRC;
      queueThumb(img);
    }

    function refreshVisibleThumbs() {
      const root = $("contentScroll") || document;
      const view = root.getBoundingClientRect ? root.getBoundingClientRect() : { top: 0, bottom: window.innerHeight };
      document.querySelectorAll("#grid .card img[data-thumb-url], #grid .card img").forEach((img) => {
        const card = img.closest(".card");
        if (!card) return;
        const box = card.getBoundingClientRect();
        if (box.bottom < view.top - 80 || box.top > view.bottom + 80) return;
        const id = card.dataset.cover || card.dataset.id;
        const rootPath = card.dataset.root || "";
        if (!id) return;
        requestThumbReload(
          img,
          "/thumb/" + id + "?v=" + Date.now() + "&defer=1" + (rootPath ? ("&root=" + encodeURIComponent(rootPath)) : "")
        );
      });
    }

    async function scanSelectedDrive(force) {
      const path = selectedDrivePath();
      if (!path) {
        alert("请先选择磁盘或目录");
        return;
      }
      $("scanDriveBtn").disabled = true;
      $("rescanBtn").disabled = true;
      $("driveSelect").disabled = true;
      $("status").textContent = `正在扫描 ${path}，新盘会自动加入片库…`;
      const sameDrive = state.root && path && (
        String(state.root).replace(/[\\/]+$/, "").toLowerCase() ===
        String(path).replace(/[\\/]+$/, "").toLowerCase()
      );
      if (!sameDrive) {
        state.folder = "";
        state.folderAll = false;
        state.category = "";
        state.expanded = new Set([""]);
      }
      saveUiPrefs();
      try {
        const r = await fetch("/api/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            path,
            thumbs: true,
            force: !!force,
            trigger: force ? "rescan_button" : "scan_button",
          }),
        });
        const data = await r.json();
        if (!r.ok || !data.ok) {
          alert(data.msg || "无法开始扫描");
          $("scanDriveBtn").disabled = false;
          $("rescanBtn").disabled = false;
          $("driveSelect").disabled = false;
          return;
        }
        if (data.msg) $("status").textContent = data.msg;
        await refresh();
        startPoll();
      } catch (e) {
        alert("请求失败: " + e);
        $("scanDriveBtn").disabled = false;
        $("rescanBtn").disabled = false;
        $("driveSelect").disabled = false;
      }
    }

    function sameLibPath(a, b) {
      return String(a || "").replace(/[\\/]+$/, "").toLowerCase() ===
        String(b || "").replace(/[\\/]+$/, "").toLowerCase();
    }

    function libCacheKey(lib) {
      return String(lib || "").replace(/\\/g, "/").replace(/\/+$/, "").toLowerCase();
    }

    // === Sidebar / tags fingerprint helpers ==================================
    // 严格比对「两次渲染输入是否完全相同」；相同时跳过 innerHTML 重写，
    // 避免 polling soft refresh 期间标签/频道/树看起来在"闪一下/变化"。
    function _fpJson(v) {
      try { return JSON.stringify(v); } catch (_) { return ""; }
    }
    function _fpSidebar(treeData) {
      if (!treeData) return "";
      const roots = (treeData.roots || []).map((r) =>
        `${String(r.path || "")}\n${String(r.label || "")}\n${Number(r.count || 0)}\n${_fpJson(r.categories || [])}`
      ).join("||");
      return [
        "sb-v1",
        String(treeData.lib || ""),
        String(treeData.count || 0),
        String(!!treeData.scanning),
        String(!!treeData.multi),
        String(treeData.root || ""),
        _fpJson(treeData.categories || []),
        _fpJson(treeData.types || []),
        _fpJson(treeData.tree || null),
        roots,
      ].join("\x01");
    }
    function _fpCategoriesShort(arr) {
      return (arr || []).map((c) => `${String(c.id === "" ? "__root__" : (c.id || c.name || ""))}:${Number(c.count || 0)}`).join(",");
    }
    function _fpTypesShort(arr) {
      return (arr || []).map((t) => `${String(t.ext || "")}:${Number(t.count || 0)}`).join(",");
    }
    // 短 hash（6 位 36 进制），指纹太长时写入日志只留前缀方便肉眼识别
    function _fpPrefix(fp, n) { return String(fp || "").slice(0, n || 16); }

    function rememberNav(treeData) {
      if (!treeData) return;
      state.navCache = treeData;
      if (treeData.lib_gen != null) state._libGen = treeData.lib_gen;
      if (treeData.tree) state.trees[libCacheKey(treeData.lib)] = treeData.tree;
      // Scoped /api/tree?lib=D: only knows one disk. Keep the all-disks total.
      if (!(treeData.lib || "").trim() && treeData.count != null) {
        state.catalogCount = treeData.count || 0;
      }
    }

    function catalogTotal(fallback) {
      const grand = (state.mountedRoots || []).reduce((s, r) => s + (r.count || 0), 0);
      if (grand > 0) return grand;
      if (state.catalogCount > 0) return state.catalogCount;
      return fallback || 0;
    }

    function treeFromCache(lib) {
      const key = libCacheKey(lib);
      if (state.trees[key]) return state.trees[key];
      const overview = state.trees[""];
      if (lib && overview && Array.isArray(overview.children)) {
        const child = overview.children.find((c) => sameLibPath(c.lib, lib));
        if (child) {
          state.trees[key] = child;
          return child;
        }
      }
      return null;
    }

    function highlightNav() {
      const channelItems = document.querySelectorAll("#channelList .channel-item[data-cat]");
      channelItems.forEach((el) => {
        const lib = el.getAttribute("data-lib") || "";
        const cat = el.getAttribute("data-cat") || "";
        el.classList.toggle("active", sameLibPath(lib, state.lib || "") && cat === (state.category || ""));
      });
      document.querySelectorAll("#channelList .channel-item.channel-disk").forEach((el) => {
        const path = el.getAttribute("data-disk-header") || "";
        el.classList.toggle("disk-scoped", sameLibPath(state.lib, path));
      });
      document.querySelectorAll("#tree .tree-item").forEach((el) => {
        const lib = el.getAttribute("data-lib") || "";
        const path = el.getAttribute("data-path") || "";
        let on = false;
        if (lib) {
          on = sameLibPath(state.lib, lib) && (path ? state.folder === path : !state.folder);
        } else {
          on = state.folder === path;
        }
        el.classList.toggle("active", on);
      });
      document.querySelectorAll("#extTags .tag[data-ext]").forEach((el) => {
        el.classList.toggle("active", (el.getAttribute("data-ext") || "") === (state.ext || ""));
      });
      const activeChannels = Array.from(channelItems)
        .filter((el) => el.classList.contains("active"))
        .map((el) => String(el.textContent || "").trim().replace(/\s+/g, " ").slice(0, 80));
      const activeFolders = Array.from(document.querySelectorAll("#tree .tree-item.active"))
        .map((el) => el.getAttribute("data-path") || "")
        .slice(0, 8);
      clientLog("nav_highlight", filterStateFields({
        channel_count: channelItems.length,
        active_channels: activeChannels.join(" | "),
        active_channel_count: activeChannels.length,
        active_tree_paths: activeFolders.join(" | "),
        tree_active_count: activeFolders.length,
      }));
    }

    function syncNavFromCache() {
      const started = clientNow();
      const cached = treeFromCache(state.lib);
      const painted = libCacheKey(state.paintedTreeLib);
      const want = libCacheKey(state.lib);
      if (cached && painted !== want) {
        const treeFp = _fpJson(cached || null);
        // folder tree 节点指纹相同就不重写 innerHTML，避免 DOM 节点被重新创建
        // 导致选中高亮/滚动位置被重置，眼睛看到的"左侧树跳动"。
        if (state._treeFingerprint !== treeFp) {
          state.tree = cached;
          if ($("tree")) $("tree").innerHTML = renderTree(cached);
          state._treeFingerprint = treeFp;
        }
        state.paintedTreeLib = state.lib || "";
      }
      highlightNav();
      renderCategoryTags(state.categories || []);
      renderSortTags();
      clientLog("nav_cache_synced", filterStateFields({
        elapsed_ms: Number(clientElapsedMs(started).toFixed(1)),
        cache_hit: !!cached,
        painted_lib: state.paintedTreeLib || "",
        tree_fp_changed: cached && (state._treeFingerprint === _fpJson(cached || null)),
      }));
    }

    async function applyNavChrome(treeData) {
      const started = clientNow();
      const fp = _fpSidebar(treeData);
      // 侧栏 5 大容器（mount chips / channels / sortTags / extTags / folder tree）
      // 的完整输入指纹。若与上次完全相同，仅更新高亮/标题，不做任何 innerHTML
      // 重写 → 眼睛看到的"标签闪一下/变化"被彻底压制。
      if (fp && state._sidebarFingerprint === fp) {
        lastScanning = !!treeData.scanning;
        state.tree = treeData.tree;
        state.root = treeData.root || state.root;
        if (treeData.multi || (treeData.roots || []).length > 1) state.multi = true;
        state.paintedTreeLib = treeData.lib || "";
        highlightNav();
        updateAsideTitles();
        clientLog("nav_chrome_rendered", filterStateFields({
          elapsed_ms: Number(clientElapsedMs(started).toFixed(1)),
          tree_lib: treeData.lib || "",
          category_count: (treeData.categories || []).length,
          root_count: (treeData.roots || []).length,
          type_count: (treeData.types || []).length,
          skip_reason: "fingerprint_match",
          fingerprint_prefix: _fpPrefix(fp, 24),
        }));
        return;
      }
      state._sidebarFingerprint = fp;
      lastScanning = !!treeData.scanning;
      state.tree = treeData.tree;
      state.root = treeData.root || state.root;
      await renderMountChips(treeData.roots || []);
      if (treeData.multi || (treeData.roots || []).length > 1) state.multi = true;
      updateAsideTitles();
      renderChannels(treeData.categories || [], catalogTotal(treeData.count || 0));
      renderSortTags();
      renderExtTags(treeData.types || [], "tree_nav");
      if ($("tree")) $("tree").innerHTML = treeData.tree ? renderTree(treeData.tree) : "";
      state.paintedTreeLib = treeData.lib || "";
      clientLog("nav_chrome_rendered", filterStateFields({
        elapsed_ms: Number(clientElapsedMs(started).toFixed(1)),
        tree_lib: treeData.lib || "",
        category_count: (treeData.categories || []).length,
        root_count: (treeData.roots || []).length,
        type_count: (treeData.types || []).length,
        rebuild: true,
        fingerprint_prefix: _fpPrefix(fp, 24),
      }));
    }

    function normalizeMountRoots(roots) {
      return (roots || []).map((r) => {
        if (typeof r === "string") {
          return { path: r, label: r, count: 0, categories: [] };
        }
        return {
          path: r.path || "",
          label: r.label || r.path || "",
          count: r.count || 0,
          categories: Array.isArray(r.categories) ? r.categories : [],
          current: !!r.current,
        };
      }).filter((r) => r.path);
    }

    async function renderMountChips(rootsFromApi) {
      const started = clientNow();
      // 多根切换已并入频道列表，这里只同步数据
      let roots = rootsFromApi;
      if (!roots) {
        try {
          const data = await fetch("/api/roots").then((r) => r.json());
          roots = data.roots || [];
        } catch (_) {
          roots = state.mountedRoots || [];
        }
      }
      state.mountedRoots = normalizeMountRoots(roots);
      state.multi = state.mountedRoots.length > 1;
      if (state.lib && !state.mountedRoots.some((r) => sameLibPath(r.path, state.lib))) {
        state.lib = "";
      }
      if (!state.multi) state.lib = "";
      if (!(state.libExpanded instanceof Set)) state.libExpanded = new Set();
      // 多盘时默认全部展开，方便看到「盘 → 频道」
      if (state.multi) {
        state.mountedRoots.forEach((r) => state.libExpanded.add(r.path));
      }
      const box = $("libNav");
      if (box) {
        box.classList.remove("show");
        box.innerHTML = "";
      }
      updateAsideTitles();
      clientLog("mounts_rendered", filterStateFields({
        elapsed_ms: Number(clientElapsedMs(started).toFixed(1)),
        root_count: state.mountedRoots.length,
        multi: state.multi,
        selected_lib: state.lib || "",
        category_counts: state.mountedRoots.map((root) => `${root.path}:${(root.categories || []).length}`).join("|").slice(0, 500),
      }));
    }

    function selectLib(libPath) {
      const next = libPath || "";
      if (state.lib === next) return;
      state.lib = next;
      state.folder = "";
      state.folderAll = false;
      state.category = "";
      if (next) {
        if (!(state.libExpanded instanceof Set)) state.libExpanded = new Set();
        state.libExpanded.add(next);
      }
      state.expanded = new Set([""]);
      saveUiPrefs();
      refresh({ nav: false });
    }

    function renderChannels(categories, total) {
      const started = clientNow();
      const finish = (mode, extra) => clientLog("channel_rendered", filterStateFields({
        elapsed_ms: Number(clientElapsedMs(started).toFixed(1)),
        mode,
        category_count: state.categories.length,
        mounted_root_count: (state.mountedRoots || []).length,
        rendered_items: $("channelList") ? $("channelList").querySelectorAll(".channel-item").length : 0,
        sidebar_hidden: document.body.classList.contains("sidebar-hidden"),
        ...(extra || {}),
      }));
      state.categories = categories || [];
      // 频道行只在「已选盘、未选盘下频道」时出现；单盘/全部目录时由左侧频道承载，
      // 避免右侧再重复一行并把筛选栏撑高。
      renderCategoryTags(state.categories);
      if (!state.multi) {
        const allActive = !state.category;
        let html = `<div class="channel-item ${allActive ? "active" : ""}" data-cat="" data-lib="">
          <span class="ico">${CHANNEL_ICO.__all__}</span>
          <span class="label">全部</span>
          <span class="badge">${total || 0}</span>
        </div>`;
        for (const c of state.categories) {
          const id = c.id === "" ? "__root__" : c.id;
          const isActive = state.category === id;
          const ico = CHANNEL_ICO[c.name] || CHANNEL_ICO[c.id] || "▸";
          html += `<div class="channel-item ${isActive ? "active" : ""}" data-cat="${escapeAttr(id)}" data-lib="">
            <span class="ico">${ico}</span>
            <span class="label">${escapeHtml(c.name)}</span>
            <span class="badge">${c.count}</span>
          </div>`;
        }
        const key = `ch-single|multi=0|cat=${String(state.category || "")}|total=${Number(total || 0)}|${_fpCategoriesShort(state.categories)}`;
        if (state._lastChannelsKey === key && state._lastChannelsHtml === html) {
          finish("single", { skip_reason: "html_identical", key_prefix: _fpPrefix(key, 24) });
          return;
        }
        $("channelList").innerHTML = html;
        state._lastChannelsKey = key;
        state._lastChannelsHtml = html;
        finish("single", { rebuild: true, key_prefix: _fpPrefix(key, 24) });
        return;
      }

      // 多根：全部视频 → 各盘分组 → 该盘下的全部视频/频道
      if (!(state.libExpanded instanceof Set)) state.libExpanded = new Set();
      if (state.lib) {
        const hit = (state.mountedRoots || []).find((r) => sameLibPath(r.path, state.lib));
        if (hit) state.libExpanded.add(hit.path);
      }
      if (state.libExpanded.size === 0) {
        (state.mountedRoots || []).forEach((r) => state.libExpanded.add(r.path));
      }
      const roots = state.mountedRoots || [];
      // 多盘「全部视频」必须是各盘合计，不能用当前盘 / 当前列表的 count。
      const allBadge = catalogTotal(total);
      const allDisksActive = !state.lib && !state.category;
      let html = `<div class="channel-item ${allDisksActive ? "active" : ""}" data-lib="" data-cat="">
        <span class="ico">${CHANNEL_ICO.__all__}</span>
        <span class="label">全部视频</span>
        <span class="badge">${allBadge}</span>
      </div>`;

      for (const root of roots) {
        const expanded = [...state.libExpanded].some((p) => sameLibPath(p, root.path));
        const diskOn = sameLibPath(state.lib, root.path);
        html += `<div class="channel-item channel-disk ${diskOn ? "disk-scoped" : ""}" data-disk-header="${escapeAttr(root.path)}" title="${escapeAttr(root.path)}">
          <span class="ch-twisty" data-expand-lib="${escapeAttr(root.path)}">${expanded ? "▼" : "▶"}</span>
          <span class="ico">▣</span>
          <span class="label">${escapeHtml(root.label || root.path)}</span>
          <span class="badge">${root.count || 0}</span>
          <span class="ch-twisty lib-nav-x" data-unmount="${escapeAttr(root.path)}" title="移出片库">×</span>
        </div>`;
        if (!expanded) continue;
        html += `<div class="channel-children">`;

    function treeNodeKey(node) {
      const lib = node && node.lib ? String(node.lib) : "";
      const path = (node && node.path) || "";
      return lib ? `${lib}::${path}` : path;
    }

    function renderTree(node, depth = 0) {
      if (!node) return "";
      // 多根：盘节点（有 lib、无 path）或其子文件夹
      const hasChildren = node.children && node.children.length > 0;
      const path = node.path || "";
      const lib = node.lib || "";
      const key = treeNodeKey(node);
      // 激活：点到该盘（无文件夹）或点到该盘下某文件夹
      let isActive = false;
      if (lib) {
        if (!path) isActive = sameLibPath(state.lib, lib) && !state.folder;
        else isActive = sameLibPath(state.lib, lib) && state.folder === path;
      } else {
        isActive = state.folder === path;
      }
      const expanded = state.expanded.has(key) || state.expanded.has(path) || depth === 0
        || (lib && sameLibPath(state.lib, lib) && !path);

      let html = `<div class="tree-item ${isActive ? "active" : ""} ${lib && !path ? "tree-disk" : ""}"
        data-path="${escapeAttr(path)}"
        data-lib="${escapeAttr(lib)}"
        data-tree-key="${escapeAttr(key)}"
        style="padding-left:${10 + depth * 12}px"
        title="${escapeAttr(lib || path || "")}">
        <span class="twisty" data-toggle-key="${escapeAttr(key)}">${hasChildren ? (expanded ? "▼" : "▶") : "·"}</span>
        <span class="label">${escapeHtml(node.name)}</span>
        <span class="badge">${node.count || 0}</span>
      </div>`;

      if (hasChildren && expanded) {
        html += `<div class="tree-children">`;
        for (const c of node.children) html += renderTree(c, depth + 1);
        html += `</div>`;
      }
      return html;
    }

    function setupScopeSticky() {
      const root = $("contentScroll");
      const filters = $("filters");
      const sticky = $("scopeSticky");
      const btn = $("scopeFilterBtn");
      if (!root || !filters || !sticky || !btn) return;
      if (sticky.dataset.bound === "1") return;
      sticky.dataset.bound = "1";
      let stickyLogTimer = 0;
      const logStickyLayout = (reason) => {
        const read = (el) => {
          if (!el) return null;
          const r = el.getBoundingClientRect();
          const cs = getComputedStyle(el);
          return {
            top: Math.round(r.top), bottom: Math.round(r.bottom),
            width: Math.round(r.width), height: Math.round(r.height),
            client_height: el.clientHeight, scroll_height: el.scrollHeight,
            min_height: cs.minHeight, max_height: cs.maxHeight,
            display: cs.display, visibility: cs.visibility,
          };
        };
        const row = $("stickyFilterRow");
        const tags = row ? row.querySelector(".filter-tags") : null;
        clientLog("sticky_layout", {
          reason: String(reason || "unknown"),
          scroll_top: Math.round(root.scrollTop),
          sticky: JSON.stringify(read(sticky)),
          sticky_row: JSON.stringify(read(row)),
          sticky_tags: JSON.stringify(read(tags)),
          is_stuck: sticky.classList.contains("is-stuck"),
          has_filter_row: sticky.classList.contains("has-filter-row"),
          tag_count: row ? row.querySelectorAll(".tag").length : 0,
        });
      };
      const scheduleStickyLog = (reason) => {
        clearTimeout(stickyLogTimer);
        stickyLogTimer = setTimeout(() => logStickyLayout(reason), 80);
      };
      if ("IntersectionObserver" in window) {
        const io = new IntersectionObserver(
          (entries) => {
            const visible = entries.some((e) => e.isIntersecting);
            sticky.classList.toggle("is-stuck", !visible);
            scheduleStickyLog("intersection");
          },
          { root, threshold: 0 }
        );
        io.observe(filters);
      }
      root.addEventListener("scroll", () => scheduleStickyLog("scroll"), { passive: true });
      scheduleStickyLog("setup");
      btn.addEventListener("click", () => {
        filters.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    function getVirtualCols() {
      const grid = $("grid");
      const w = (grid && grid.clientWidth) || 800;
      const min = window.matchMedia("(max-width: 900px)").matches ? 160 : 220;
      const calculated = Math.max(1, Math.floor((w + VIRTUAL_GAP) / (min + VIRTUAL_GAP)));
      // Do not let scrollHeight/scrollbar layout feedback change the column
      // count during ordinary scroll renders.  A column-count change changes
      // the virtual catalog height by tens of thousands of pixels and looks
      // like the whole list was loaded.  Recalculate on an explicit resize
      // (see bindVirtualScroll) or when the layout is explicitly invalidated.
      const previous = state._virtualCols;
      if (!Number.isFinite(previous)) {
        state._virtualCols = calculated;
      } else if (previous !== calculated) {
        clientLog("virtual_columns_changed", {
          previous_cols: previous,
          calculated_cols: calculated,
          kept_cols: previous,
          grid_width: w,
          content_width: $("contentScroll")?.clientWidth || 0,
          window_width: window.innerWidth,
          mobile_media: window.matchMedia("(max-width: 900px)").matches,
          scroll_top: Math.round($("contentScroll")?.scrollTop || 0),
          scroll_height: $("contentScroll")?.scrollHeight || 0,
          reason: "layout_feedback_during_render",
        }, "WARN");
      }
      return state._virtualCols;
    }

    function updateGridHint() {
      const wrap = $("loadMoreWrap");
      const hint = $("loadMoreHint");
      const grid = $("grid");
      const shown = state.virtualEnabled
        ? state.loadedVideos.length
        : (grid ? grid.querySelectorAll(".card").length : 0);
      if (!wrap || !hint) return;
      if (state.hasMore) {
        wrap.style.display = "block";
        hint.textContent = `已加载 ${shown}/${state.totalCount}，继续下滑加载…`;
      } else if (shown > 0) {
        wrap.style.display = "block";
        hint.textContent = shown >= state.totalCount
          ? `共 ${state.totalCount} 个`
          : `已显示 ${shown} 个`;
      } else {
        wrap.style.display = "none";
      }
    }

    const MAX_LOADED_VIDEOS = 3000;

    function renderVirtualGrid() {
      const grid = $("grid");
      const root = $("contentScroll");
      if (!grid || !root) return;
      const cols = getVirtualCols();
      const loadedBase = Number(state.loadedBaseOffset) || 0;
      const loadedTotal = loadedBase + state.loadedVideos.length;
      // While more pages remain, the scrollbar should represent the portion
      // that is actually loaded.  Using state.totalCount here made the first
      // 20-card page get a full-catalog scrollHeight, so its thumb looked as
      // if all 758/781 videos had already been loaded.  Once the final page
      // arrives, switch to the final catalog total.
      let total = state.hasMore
        ? loadedTotal
        : Math.max(state.totalCount || 0, loadedTotal);
      // During a scan totalCount changes on every _publish_live() call which
      // makes the spacer heights jump and visibly pushes the scroll position.
      // Rounding up to the nearest batch-size multiple keeps the spacer stable
      // until a whole row of new items arrives.
      if (lastScanning && total > 0) {
        const batch = Math.max(state.pageSize || 20, 20);
        total = Math.ceil(total / batch) * batch;
      }
      const totalRows = Math.ceil(total / cols) || 1;
      const rowStride = VIRTUAL_ROW_H + VIRTUAL_GAP;
      const scrollTop = root.scrollTop;
      const viewH = root.clientHeight;
      const scrollHeight = root.scrollHeight;
      const firstRow = Math.max(0, Math.floor(scrollTop / rowStride) - 3);
      const lastRow = Math.min(totalRows - 1, Math.ceil((scrollTop + viewH) / rowStride) + 3);
      const globalStart = firstRow * cols;
      const globalEnd = Math.min(total, (lastRow + 1) * cols);
      const start = Math.max(0, globalStart - loadedBase);
      const end = Math.max(start, Math.min(state.loadedVideos.length, globalEnd - loadedBase));
      const renderStartRow = Math.max(firstRow, Math.floor(loadedBase / cols));
      const padTop = renderStartRow * rowStride;
      // The bottom spacer now represents only the loaded prefix while more
      // pages remain.  This keeps the first-page thumb proportional to the
      // first page and lets it shrink naturally as pages are appended.
      const loadedRows = Math.ceil(state.loadedVideos.length / Math.max(cols, 1));
      const loadedContentH = loadedRows * rowStride;

          elapsed_ms: 0,
          pad_top_before: beforePadTop,
          pad_top_after: padTop,
          pad_top_delta: padTopJump,
          pad_bot_before: beforePadBot,
          pad_bot_after: padBot,
          pad_bot_delta: padBotJump,
          loaded_base: loadedBase,
          loaded_videos: loadedNow,
          total_count: total,
          first_row: firstRow,
          last_row: lastRow,
          scroll_top: beforeCompScrollTop,
          scroll_height: scrollHeight,
          client_height: viewH,
          jump_reason: jumpReason,
          base_shifted: baseShifted,
          loaded_shifted: loadedShifted,
          total_shifted: totalShifted,

        elapsed_ms: Number(clientElapsedMs(refreshStarted).toFixed(1)),
        render_ms: Number(clientElapsedMs(renderStartedAt).toFixed(1)),
        token,
        mode: refreshRenderMode,
        input_rows: Array.isArray(data.videos) ? data.videos.length : 0,
        loaded_before: renderBeforeLoaded,
        loaded_after: state.loadedVideos ? state.loadedVideos.length : 0,
        total: state.totalCount || 0,
        has_more: !!state.hasMore,
        offset: state.offset || 0,
        scroll_top_before: Math.round(renderBeforeScrollTop),
        scroll_top_after: $("contentScroll") ? Math.round($("contentScroll").scrollTop) : 0,
        grid_card_count: $("grid") ? $("grid").querySelectorAll(".card").length : 0,
      }), "INFO", refreshOperationId);
      const libTip = state.lib
        ? ((state.mountedRoots.find((r) => sameLibPath(r.path, state.lib)) || {}).label || state.lib)
        : (state.multi ? "全部目录" : "");
      const showN = (data.raw_count != null ? data.raw_count : data.count) || 0;
      // 剧集视图：卡片数是合集数，左边频道统计的是片子数——标题写清楚避免「右边数量不对」
      if (!lastScanning && state.view === "series" && data.count != null && data.raw_count != null && data.count !== data.raw_count) {
        $("countLabel").textContent = (libTip ? `${libTip} · ` : "") + `合集 ${data.count} · 共 ${data.raw_count} 部`;
      } else {
        $("countLabel").textContent = lastScanning
          ? `扫描中… ${showN} 个`
          : (libTip ? `${libTip} · ${showN} 个` : `${showN} 个视频`);
      }
    }

    let loadMoreCallCount = 0;
    let loadMoreAbortCount = 0;

    async function loadMore(trigger) {
      const callSeq = ++loadMoreCallCount;
      const triggerName = trigger || "unknown";
      // Heal a stale hasMore=false left by soft refresh while preserving a
      // partially loaded buffer (e.g. 40/59). Without this, the sentinel keeps
      // firing but every attempt is skipped as no_more.
      if (!state.hasMore && !loadingMore) {
        const loadedTotal =
          (Number(state.loadedBaseOffset) || 0)
          + (state.loadedVideos ? state.loadedVideos.length : 0);
        const total = Number(state.totalCount) || 0;
        if (total > 0 && loadedTotal < total) {
          state.hasMore = true;
          try { updateGridHint(); } catch (_) {}
          clientLog("load_more_has_more_repaired", {
            seq: callSeq,
            trigger: triggerName,
            loaded_total: loadedTotal,
            total,
            offset: state.offset || 0,
          }, "WARN");
        }
      }
      if (!state.hasMore || loadingMore) {
        clientLog("load_more_skipped", {
          elapsed_ms: 0,
          seq: callSeq,
          trigger: triggerName,
          reason: loadingMore ? "already_loading" : (!state.hasMore ? "no_more" : "unknown"),
          loading_more: !!loadingMore,
          has_more: !!state.hasMore,
          offset: state.offset || 0,
          total: state.totalCount || 0,
          loaded: state.loadedVideos.length,
          loaded_base: Number(state.loadedBaseOffset) || 0,
          abort_count_so_far: loadMoreAbortCount,
        }, (loadingMore && state.hasMore) ? "WARN" : "INFO");
        return;
      }
      loadingMore = true;
      const hint = $("loadMoreHint");
      if (hint) hint.textContent = "加载中…";
      const root = $("contentScroll");
      const beforeTop = root ? root.scrollTop : 0;
      const beforeHeight = root ? root.scrollHeight : 0;
      const beforeOffset = state.offset || 0;
      const startedAt = performance.now();
      try {
        clientLog("load_more_start", {
          elapsed_ms: 0,
          seq: callSeq,
          trigger: triggerName,
          offset: beforeOffset,
          page_size: state.pageSize || 0,
          loaded: state.loadedVideos.length,
          loaded_base: Number(state.loadedBaseOffset) || 0,
          total: state.totalCount || 0,
          has_more: !!state.hasMore,
          scroll_top: Math.round(beforeTop),
          scroll_height: beforeHeight,
          client_height: root ? root.clientHeight : 0,
        }, "INFO");
        const data = await fetchVideos(state.offset, "load_more");
        if (!data) {
          // fetchVideos already logged page_load_aborted on cancel; just mark.
          loadMoreAbortCount += 1;
          clientLog("load_more_no_data", {
            elapsed_ms: Number((performance.now() - startedAt).toFixed(1)),
            seq: callSeq,
            trigger: triggerName,
            offset_before: beforeOffset,
            offset_after: state.offset || 0,
            abort_count_so_far: loadMoreAbortCount,
          }, "WARN");
          return;
        }
        const batch = data.videos || [];
        state.hasMore = !!data.has_more;
        state.offset += batch.length;
        if (!batch.length) state.hasMore = false;
        renderGrid(batch, false, true);
        const afterTop = root ? root.scrollTop : 0;
        const afterHeight = root ? root.scrollHeight : 0;
        const deltaTop = afterTop - beforeTop;
        const deltaHeight = afterHeight - beforeHeight;
        // If adding N rows shifted the viewport more than a couple of rows
        // we log it: it usually means the user kept scrolling while the
        // batch rendered and our layout pushed the content relative to them.
        const jumped = Math.abs(deltaTop) >= Math.max(200, (root ? root.clientHeight : 0) * 0.4);
        clientLog("load_more_done", {
          elapsed_ms: Number((performance.now() - startedAt).toFixed(1)),
          seq: callSeq,
          trigger: triggerName,
          batch: batch.length,
          offset_before: beforeOffset,
          offset_after: state.offset || 0,
          has_more_after: !!state.hasMore,
          total: state.totalCount || 0,
          count: data.count || 0,
          raw_count: data.raw_count || 0,
          scroll_top_before: Math.round(beforeTop),
          scroll_top_after: Math.round(afterTop),
          scroll_top_delta_px: Math.round(deltaTop),
          scroll_height_before: beforeHeight,
          scroll_height_after: afterHeight,
          scroll_height_delta_px: deltaHeight,
          jumped,
          abort_count_so_far: loadMoreAbortCount,
        }, jumped ? "WARN" : "INFO");
      } catch (e) {
        if (isAbortError(e)) {
          loadMoreAbortCount += 1;
          clientLog("load_more_aborted", {
            elapsed_ms: Number((performance.now() - startedAt).toFixed(1)),
            seq: callSeq,
            trigger: triggerName,
            offset_before: beforeOffset,
            offset_after: state.offset || 0,
            abort_count_so_far: loadMoreAbortCount,
            reason: "abort",
          }, "WARN");
          return;
        }
        console.warn(e);
        if (hint) hint.textContent = "加载失败，请继续下滑重试";
        state.hasMore = true;
        clientLog("load_more_failed", {
          elapsed_ms: Number((performance.now() - startedAt).toFixed(1)),
          seq: callSeq,
          trigger: triggerName,
          offset_before: beforeOffset,
          error: String((e && e.message) || e).slice(0, 240),
        }, "ERROR");
      } finally {
        loadingMore = false;
      }
    }

    function syncLanShareUi(enabled, urls, source) {
      // Button highlight must follow /api/share immediately. refreshTree can
      // briefly reuse a cached /api/tree body (max-age=6) that still has
      // lan_share=false, which used to leave the top-bar button looking off.
      const src = String(source || "unknown");
      const on = !!enabled;
      const btn = $("lanBtn");
      const beforeState = !!state.lanShare;
      const beforeDom = !!(btn && btn.classList.contains("primary"));
      state.lanShare = on;
      if (btn) {
        btn.classList.toggle("primary", on);
        btn.title = on
          ? "局域网分享已开启：同一 WiFi 设备可访问；再点可复制地址或关闭"
          : "允许同一 WiFi 下其它设备访问";
      }
      const afterDom = !!(btn && btn.classList.contains("primary"));
      const lanUrls = (Array.isArray(urls) ? urls : [])
        .map((u) => String(u || ""))
        .filter((u) => u && !u.includes("127.0.0.1"));
      const changed = beforeState !== on || beforeDom !== afterDom;
      const mismatchBefore = beforeState !== beforeDom;
      const mismatchAfter = on !== afterDom;
      // Always log explicit user/boot/refresh sources. Poll only logs when the
      // button actually flips or state/DOM disagree — otherwise logs drown.
      const quietSource = src === "poll" || src === "poll_end";
      if (!quietSource || changed || mismatchBefore || mismatchAfter || !btn) {
        clientLog("lan_share_ui_sync", {
          source: src,
          requested: on,
          state_before: beforeState,
          state_after: on,
          dom_before: beforeDom,
          dom_after: afterDom,
          btn_found: !!btn,
          changed,
          mismatch_before: mismatchBefore,
          mismatch_after: mismatchAfter,
          url_count: Array.isArray(urls) ? urls.length : 0,
          lan_url_count: lanUrls.length,
          lan_urls: lanUrls.slice(0, 3),
        }, (mismatchAfter || !btn) ? "WARN" : (changed ? "INFO" : "INFO"));
      }
      return on;
    }

    async function refreshTree(opts) {
      const data = await fetchTree(opts);
      rememberNav(data);
      await applyNavChrome(data);
      let status = "";
      if (state.multi) {
        const names = (data.roots || []).map((r) => r.label).join(" + ");
        status += `片库: ${names || "多目录"}`;
        if (state.lib) {
          const cur = (data.roots || []).find((r) => sameLibPath(r.path, state.lib));
          status += ` · ${cur ? cur.label : state.lib}`;
        } else {
          status += " · 全部";
        }
      } else if (data.root) {
        status += `当前: ${data.root}`;
      }
      // 状态栏只保留短摘要，完整信息放 title 悬停查看，避免顶栏撑爆盖住「继续看」
      const bits = [];
      if (data.scan_progress) bits.push(data.scan_progress);
      if (data.thumb_progress) bits.push(data.thumb_progress);
      if (data.meta_progress) bits.push(data.meta_progress);
      if (data.exporting && data.export_msg) bits.push(data.export_msg);
      else if (data.export_ok === true && data.export_path) bits.push("静态站已导出");
      if (!data.has_ffmpeg) bits.push("无 ffmpeg");
      const lanOn = syncLanShareUi(data.lan_share, data.lan_urls, "refresh_tree_api");
      if (typeof data.lan_share !== "boolean") {
        clientLog("lan_share_ui_sync", {
          source: "refresh_tree_api",
          skipped: true,
          reason: "lan_share_missing_in_tree_api",
          lan_share_typeof: typeof data.lan_share,
        }, "WARN");
      }
      if (lanOn) {
        const share = (data.lan_urls || []).filter((u) => !u.includes("127.0.0.1")).slice(0, 2);
        bits.push(share.length ? ("局域网 " + share.join(" · ")) : "局域网已开");
      }
      const detail = bits.join(" · ");
      if (detail) status += (status ? " · " : "") + detail;
      state.hasFfmpeg = !!data.has_ffmpeg;
      const statusEl = $("status");
      statusEl.textContent = status;
      statusEl.title = status;
      $("rescanBtn").disabled = data.scanning;
      $("scanDriveBtn").disabled = data.scanning;
      $("driveSelect").disabled = data.scanning;
      if ($("exportStaticBtn")) {
        $("exportStaticBtn").disabled = !!(data.scanning || data.exporting || !data.root || !(data.count > 0));
        $("exportStaticBtn").textContent = data.exporting ? "正在导出…" : "导出静态站";
      }
      return data;
    }

    function updateAsideTitles() {
      const ch = $("channelAsideTitle");

    const HARD_EXTS = new Set([".mkv", ".avi", ".wmv", ".flv", ".rmvb", ".rm", ".ts", ".m2ts", ".mpg", ".mpeg"]);
    let hlsPlayer = null;
    let segPlay = null;
    let currentPlayId = "";
    let currentPlayMeta = { name: "", folder: "" };
    let currentPlayKind = "";
    let convertPollTimer = 0;
    let currentConvertJobId = "";
    let playProgressTimer = 0;

    function playbackQuery(root) {
      const params = new URLSearchParams();
      if (root) params.set("root", root);
      if (currentOperationId) params.set("op", currentOperationId);
      const query = params.toString();
      return query ? ("?" + query) : "";
    }

    function mediaErrorFields(video) {
      const err = video && video.error;
      return {
        video_id: currentPlayId,
        kind: currentPlayKind,
        src: video ? (video.currentSrc || video.src || "") : "",
        current_time: video ? Number(video.currentTime || 0).toFixed(2) : "0",
        duration: video && Number.isFinite(video.duration) ? Number(video.duration).toFixed(2) : "",
        ready_state: video ? video.readyState : "",
        network_state: video ? video.networkState : "",
        error_code: err ? err.code : "",
        error_message: err ? (err.message || "") : "",
      };
    }

    const playerForDiagnostics = $("player");
    playerForDiagnostics.addEventListener("error", () => {
      clientLog("player_error", mediaErrorFields(playerForDiagnostics), "ERROR", currentOperationId);
    });

    function destroyHls() {
      if (hlsPlayer) {
        try { hlsPlayer.destroy(); } catch (_) {}
        hlsPlayer = null;
      }
      segPlay = null;
    }

    function playTsSetSequential(id, total, startIndex, root) {
      const video = $("player");
      segPlay = { id, index: startIndex || 0, total };
      const go = (i) => {
        if (!segPlay || segPlay.id !== id) return;
        segPlay.index = i;
        $("modalInfo").textContent =
          `TS 分片 ${i + 1}/${total}（浏览器原生接力播放）· 也可点「系统播放器」`;
        const rootQ = playbackQuery(root);
        video.src = `/stream/${id}/seg/${i}${rootQ}`;
        clientLog("player_source_set", {
          video_id: id,
          source: "ts_segment",
          segment_index: i,
          url: video.src,
        }, "INFO", currentOperationId);
        video.play().catch((err) => {
          clientLog("player_play_rejected", {
            ...mediaErrorFields(video),
            reason: String(err),
          }, "WARN", currentOperationId);
        });
      };
      video.onended = () => {
        if (!segPlay || segPlay.id !== id) return;
        if (segPlay.index + 1 < total) go(segPlay.index + 1);
      };
      go(segPlay.index);
    }

    function playHls(url, fallback) {
      const video = $("player");
      if (window.Hls && Hls.isSupported()) {
        hlsPlayer = new Hls({ enableWorker: true });
        hlsPlayer.loadSource(url);
        hlsPlayer.attachMedia(video);
        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
          clientLog("hls_manifest_parsed", {
            video_id: currentPlayId,
            url,
          }, "INFO", currentOperationId);
          video.play().catch((err) => {
            clientLog("player_play_rejected", {
              ...mediaErrorFields(video),
              reason: String(err),
            }, "WARN", currentOperationId);
          });
        });
        hlsPlayer.on(Hls.Events.ERROR, (_, data) => {
          clientLog("hls_error", {
            video_id: currentPlayId,
            url,
            fatal: !!(data && data.fatal),
            type: data && data.type,
            details: data && data.details,
            response_code: data && data.response ? data.response.code : "",
            error: data && data.error ? String(data.error) : "",
          }, data && data.fatal ? "ERROR" : "WARN", currentOperationId);
          if (data && data.fatal) {
            destroyHls();
            if (typeof fallback === "function") fallback();
            else {
              $("modalInfo").textContent =
                "HLS 播放失败。请用「系统播放器」打开，或检查分片是否完整。";
            }
          }
        });
        return;
      }
      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url;
        video.play().catch((err) => {
          clientLog("player_play_rejected", {
            ...mediaErrorFields(video),
            reason: String(err),
          }, "WARN", currentOperationId);
        });
        return;
      }
      if (typeof fallback === "function") fallback();
    }

    async function cancelConvertMp4() {
      if (!currentConvertJobId) return;
      try {
        await fetch("/api/convert-mp4/job/" + encodeURIComponent(currentConvertJobId) + "/cancel", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}",
        });
        $("modalInfo").textContent = "正在取消…";
      } catch (e) {
        $("modalInfo").textContent = "取消失败: " + e;
      }
    }

    async function pollConvertJob(jobId, doneLabel) {
      stopConvertPoll();
      currentConvertJobId = jobId;
      setConvertUi(true);
      const tick = async () => {
        try {
          const r = await fetch("/api/convert-mp4/job/" + encodeURIComponent(jobId));
          const data = await r.json();
          if (!r.ok || !data.ok) {
            stopConvertPoll();
            currentConvertJobId = "";
            setConvertUi(false);
            $("modalInfo").textContent = (data && data.msg) || "查询进度失败";
            return;
          }
          const st = data.status || "";
          const pct = data.percent != null ? data.percent : 0;
          const msg = data.msg || "";
          if (st === "done") {
            stopConvertPoll();
            currentConvertJobId = "";
            setConvertUi(false);
            $("modalInfo").textContent = msg || (doneLabel || "完成，已加入片库");
            try { await refresh(); } catch (_) {}
            return;
          }
          if (st === "error" || st === "cancelled") {
            stopConvertPoll();
            currentConvertJobId = "";
            setConvertUi(false);
            $("modalInfo").textContent = st === "cancelled" ? "已取消" : ("失败：" + (msg || "未知错误"));
            return;
          }
          $("modalInfo").textContent = msg || (`处理中… ${pct}%`);
          const btn = $("btnToMp4");
          if (btn && btn.style.display !== "none") btn.textContent = pct ? `转换中 ${pct}%` : "转换中…";
          const fixBtn = $("btnFixAudio");
          if (fixBtn && fixBtn.style.display !== "none") fixBtn.textContent = pct ? `修复中 ${pct}%` : "修复中…";
        } catch (e) {
          stopConvertPoll();
          currentConvertJobId = "";
          setConvertUi(false);
          $("modalInfo").textContent = "查询进度失败: " + e;
        }
      };
      await tick();
      convertPollTimer = setInterval(tick, 1200);
    }

    async function startConvertMp4() {
      if (!currentPlayId) return;
      setConvertUi(true);
      const btn = $("btnToMp4");
      if (btn) btn.textContent = "转换中…";
      $("modalInfo").textContent = "正在提交转换任务…";
      try {
        const root = (currentPlayMeta && currentPlayMeta.root) || "";
        const rootQ = root ? ("?root=" + encodeURIComponent(root)) : "";
        const r = await fetch("/api/convert-mp4/" + encodeURIComponent(currentPlayId) + rootQ, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}",
        });
        const data = await r.json();
        if (!r.ok || !data.ok || !data.job_id) {
          currentConvertJobId = "";
          setConvertUi(false);
          $("modalInfo").textContent = (data && data.msg) || "无法开始转换";

        $("modalInfo").textContent = data.msg || "转换已开始…";

        currentConvertJobId = "";

        $("modalInfo").textContent = "请求失败: " + e;

    function bindPlayProgress(video) {
      if (playProgressTimer) {
        clearInterval(playProgressTimer);
        playProgressTimer = 0;
      }
      playProgressTimer = setInterval(() => {
        if (!currentPlayId || !video || video.paused) return;
        savePlayProgress(currentPlayId, video.currentTime || 0, video.duration || 0, currentPlayMeta);
      }, 4000);
    }

    function formatResumeTime(sec) {
      const s = Math.floor(sec || 0);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      if (h) return `${h}:${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
      return `${m}:${String(r).padStart(2, "0")}`;
    }

    function resumePlayback(video, id) {
      const t = getPlayProgress(id);
      if (!(t > 5)) return;
      const seek = () => {
        try {
          if (video.duration && t < video.duration - 2) {
            video.currentTime = t;
            const base = $("modalInfo").textContent || "";
            if (!base.includes("续播")) {
              $("modalInfo").textContent = base + `\n已从 ${formatResumeTime(t)} 续播`;
            }
          }
        } catch (_) {}
      };
      if (video.readyState >= 1) seek();
      else video.addEventListener("loadedmetadata", seek, { once: true });
    }

    function openPlayer(id, name, meta, ext, kind, segCount, extra) {
      destroyHls();
      stopConvertPoll();
      currentConvertJobId = "";
      currentPlayId = id;

      const audioCodec = (extra && extra.audio_codec) || "";

      let tip = meta || "";

        tip = "HLS 播放列表" + (tip ? " · " + tip : "");

        tip = `${segCount} 个 TS 分片合集` + (tip ? " · " + tip : "");
      } else if (hard || (ext && HARD_EXTS.has(String(ext).toLowerCase()))) {
        tip += (tip ? " · " : "") + "此格式浏览器可能无法播放，建议用「系统播放器」";
      }
      if (audioHard) {
        tip += (tip ? "\n" : "") +
          `浏览器可能听不到声音（音频为 ${audioCodec || "不兼容格式"}）。可点「修复声音」生成 AAC 版，或用「系统播放器」`;

      updateFixAudioButton(extra);

          "浏览器播放失败。请点「系统播放器」用本地播放器打开" + (path ? "：\n" + path : "");
      };
      clientLog("player_opened", {
        video_id: id,
        name: name || "",
        ext: ext || "",
        kind: kind || "",
        segment_count: segCount || 0,
        root: currentPlayMeta.root,
        rel: currentPlayMeta.rel,
        browser_hard: hard,
        audio_hard: audioHard,
      }, "INFO", currentOperationId);
      $("modal").classList.add("open");
      bindPlayProgress(video);

      if (kind === "m3u8") {
        const rootQ = playbackQuery(currentPlayMeta.root);
        playHls(`/playlist/${id}.m3u8${rootQ}`);
        resumePlayback(video, id);
        return;
      }
      if (kind === "ts_set") {
        const rootQ = playbackQuery(currentPlayMeta.root);
        playHls(`/playlist/${id}.m3u8${rootQ}`, () => playTsSetSequential(id, segCount || 1, 0, currentPlayMeta.root));
        resumePlayback(video, id);
        return;

      const rootQ = playbackQuery(currentPlayMeta.root);
      video.src = "/stream/" + id + rootQ;
      clientLog("player_source_set", {
        video_id: id,
        source: "stream",
        url: video.src,
      }, "INFO", currentOperationId);
      resumePlayback(video, id);
      video.play().catch((err) => {

        }, "WARN", currentOperationId);
      });

    async function localAction(action) {
      if (!currentPlayId) return;
      try {
        const r = await fetch("/api/local/" + currentPlayId, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, root: (currentPlayMeta && currentPlayMeta.root) || "" }),
        });
        const data = await r.json();
        if (!r.ok || !data.ok) {
          alert(data.msg || "操作失败");
          return;
        }
        if (data.remote && action === "open" && data.url) {
          await openRemoteWithClientPlayer(data.url);
          return;
        }
        if (action === "path" && data.path) {
          try {
            await navigator.clipboard.writeText(data.path);
            $("modalInfo").textContent = (data.remote ? "已复制播放地址：\n" : "已复制路径：\n") + data.path;
          } catch {
            prompt(data.remote ? "复制播放地址：" : "复制路径：", data.path);
          }
        } else if (data.msg) {
          $("modalInfo").textContent = data.msg + (data.path ? "\n" + data.path : "");
        }
      } catch (e) {
        alert("请求失败: " + e);
      }
    }

    function thumbHtml(id, thumbV, hasThumb, root) {
      const vid = id || "";
      const tv = thumbV || (hasThumb ? 1 : 0);
      if (!vid) {
        return `<div class="media-row-thumb"><span class="ph">无图</span></div>`;
      }
      return `<div class="media-row-thumb">
        <img ${lazyThumbMarkup(vid, tv, root || "")} />
        <span class="ph" style="display:none">无图</span>
      </div>`;
    }

    function pickKeepId(items, mode) {
      if (!items.length) return "";
      if (mode === "newest") {
        return items.slice().sort((a, b) => (b.mtime || 0) - (a.mtime || 0))[0].id;
      }
      if (mode === "largest") {
        return items.slice().sort((a, b) => (b.size || 0) - (a.size || 0))[0].id;
      }
      return items[0].id;
    }

    function fillCleanupScopeSelects(data) {
      const libSel = $("cleanupLib");
      const catSel = $("cleanupCat");
      if (!libSel || !catSel) return;
      const roots = data.roots || state.mountedRoots || [];
      const prevLib = cleanupLib;
      libSel.innerHTML = `<option value="">全部盘</option>` + roots.map((r) => {
        const path = r.path || "";
        const label = r.label || path;
        const n = r.count != null ? `（${r.count}）` : "";
        return `<option value="${escapeAttr(path)}">${escapeHtml(label)}${n}</option>`;
      }).join("");
      if (prevLib && [...libSel.options].some((o) => sameLibPath(o.value, prevLib))) {
        const hit = [...libSel.options].find((o) => sameLibPath(o.value, prevLib));
        if (hit) libSel.value = hit.value;
      } else {
        libSel.value = "";
        cleanupLib = "";
      }

    async function loadCleanup(type, opts) {
      opts = opts || {};
      cleanupType = type || "dup";
      $("cleanupTabDup").classList.toggle("primary", cleanupType === "dup");
      $("cleanupTabBad").classList.toggle("primary", cleanupType === "bad");
      if (!cleanupScopeReady || opts.fromBrowse) {
        cleanupLib = state.lib || "";
        cleanupCat = state.category || "";
        cleanupScopeReady = true;
      }
      const body = $("cleanupBody");
      const hint = $("cleanupHint");
      body.innerHTML = "加载中…";
      if (hint) hint.textContent = "正在按所选范围扫描…";
      try {
        const params = new URLSearchParams();
        params.set("type", cleanupType);
        if (cleanupLib) params.set("lib", cleanupLib);
        if (cleanupCat) params.set("category", cleanupCat);
        const data = await fetch("/api/cleanup?" + params).then((r) => r.json());
        if (!data.ok) {
          body.textContent = data.msg || "加载失败";
          return;
        }
        fillCleanupScopeSelects(data);
        // Keep selects aligned with what the API actually used
        if (data.scope) {
          if (data.scope.lib != null) cleanupLib = data.scope.lib || "";
          if (data.scope.category != null) cleanupCat = data.scope.category || "";
          if ($("cleanupLib") && cleanupLib) {
            const hit = [...$("cleanupLib").options].find((o) => sameLibPath(o.value, cleanupLib));
            if (hit) $("cleanupLib").value = hit.value;
          }
          if ($("cleanupCat")) $("cleanupCat").value = cleanupCat;
        }
        const scope = data.scope || {};
        const scopeBits = [];
        if (cleanupLib) {
          const r = (data.roots || []).find((x) => sameLibPath(x.path, cleanupLib));
          scopeBits.push(r ? r.label : "当前盘");
        } else {
          scopeBits.push("全部盘");
        }
        if (cleanupCat === "__root__") scopeBits.push("未分类");
        else if (cleanupCat) scopeBits.push(cleanupCat);
        else scopeBits.push("全部频道");
        scopeBits.push(`范围内 ${scope.video_count != null ? scope.video_count : "?"} 部`);
        if (hint) {
          hint.innerHTML = `<strong>范围</strong>：${escapeHtml(scopeBits.join(" · "))}。`
            + ` <strong>判定</strong>：${escapeHtml(scope.rules || "同体积后内容哈希相同的不同文件")}。`
            + ` 切换上方「盘 / 频道」后会重新扫描。`;
        }
        const groups = (data.groups || []).filter((g) => (g.items || []).length);
        if (!groups.length) {
          body.textContent = cleanupType === "bad"
            ? "当前范围内没有标记为损坏的文件"
            : "当前范围内没有发现重复组（可换频道或选「全部频道」再试）";
          body.dataset.groups = "[]";
          return;
        }
        body.innerHTML = groups.map((g, gi) => {
          const items = g.items || [];
          const keepNewest = pickKeepId(items, "newest");
          const rows = items.map((it) => {
            const isKeep = cleanupType === "dup" && it.id === keepNewest;
            const checked = cleanupType === "bad" ? "checked" : (isKeep ? "" : "checked");
            const keepTag = isKeep ? ` <span style="color:var(--accent)">保留·最新</span>` : "";
            const reason = it.reason ? ` · ${escapeHtml(it.reason)}` : "";
            const lib = it.lib_label ? ` · ${escapeHtml(it.lib_label)}` : "";
            return `
            <div class="media-row">
              <input type="checkbox" class="cleanup-check media-row-check" data-id="${escapeAttr(it.id)}" data-root="${escapeAttr(it.root || "")}" data-rel="${escapeAttr(it.rel || "")}" ${checked} />
              ${thumbHtml(it.thumb_id || it.id, it.thumb_v, it.has_thumb, it.root)}
              <div class="media-row-body">
                <strong title="${escapeAttr(it.name || "")}">${escapeHtml(it.name || "")}${keepTag}</strong>
                <div class="media-row-meta">${escapeHtml(it.size_h || "")} · ${escapeHtml(it.mtime_h || "")} · ${escapeHtml(it.folder || "")}${lib}${reason}<br>${escapeHtml(it.path || "")}</div>
                <div class="media-row-actions">
                  <button type="button" class="btn cleanup-reveal" data-id="${escapeAttr(it.id)}" data-root="${escapeAttr(it.root || "")}">打开位置</button>
                  ${cleanupType === "dup" ? `<button type="button" class="btn cleanup-keep-one" data-id="${escapeAttr(it.id)}">只留这个</button>` : ""}
                </div>
              </div>
            </div>`;
          }).join("");
          const tools = cleanupType === "dup"
            ? `<button type="button" class="btn cleanup-keep-mode" data-mode="newest" data-gi="${gi}">只留最新</button>
               <button type="button" class="btn cleanup-keep-mode" data-mode="largest" data-gi="${gi}">只留最大</button>`
            : "";
          return `<div class="cleanup-group" style="border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:12px" data-gi="${gi}">
            <div style="margin-bottom:8px"><strong>${escapeHtml(g.reason || "")}</strong> · ${items.length} 项 · 勾选=删除</div>
            ${rows}
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
              ${tools}
              <button type="button" class="btn primary cleanup-del-group" data-gi="${gi}">删除勾选（进回收站）</button>
            </div>
          </div>`;
        }).join("");
        body.dataset.groups = JSON.stringify(groups);
        watchThumbs(body);
      } catch (err) {
        body.textContent = "加载失败: " + err;
      }
    }

          body: JSON.stringify({ ids: rows.map((r) => r.id), hints: historyHints(rows) }),
        }).then((r) => r.json());

        (data.videos || []).forEach((v) => { byId[v.id] = v; });

          const v = byId[r.id];

              (diskHint ? ` · ${escapeHtml(diskHint)}` : "");

            meta = escapeHtml(r.folder || r.root || "（其他磁盘）");
          } else {
            meta = escapeHtml(r.folder || "（不在当前片库）");
          }
          const dur = Number(r.duration) || 0;
          const pct = (!r.done && dur > 0) ? Math.min(99, Math.round((r.t / dur) * 100)) + "%" : (r.done ? "已看完" : "");
          const thumbRoot = (v && v.root) || r.root || "";
          const thumb = thumbHtml(r.id, v && v.thumb_v, v && v.has_thumb, thumbRoot);

        body.textContent = "加载失败: " + err;
