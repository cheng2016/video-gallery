          const st = j.status || "";
          const canCancel = st === "queued" || st === "running";
          const kind = j.kind === "fix_audio" ? "修声音" : "转MP4";
          return `<div class="media-row">
            <div class="media-row-body">
              <strong>${escapeHtml(j.name || j.vid)} <span style="opacity:.7;font-weight:400">${kind} · ${escapeHtml(st)} ${j.percent ? j.percent + "%" : ""}</span></strong>
              <div class="media-row-meta">${escapeHtml(j.msg || "")}</div>
              <div class="media-row-actions">
                ${canCancel ? `<button type="button" class="btn queue-cancel" data-jid="${escapeAttr(j.id)}">取消</button>` : ""}
              </div>
            </div>
          </div>`;
        }).join("");
        const qbtn = $("queueBtn");
        if (qbtn && data.active) qbtn.textContent = `队列(${data.active})`;
        else if (qbtn) qbtn.textContent = "队列";
      } catch (err) {
        body.textContent = "加载失败: " + err;
      }
    }
    function openQueueModal() {
      $("queueModal").classList.add("open");
      loadQueueModal();
      if (queuePollTimer) clearInterval(queuePollTimer);
      queuePollTimer = setInterval(loadQueueModal, 1500);
    }
    function closeQueueModal() {
      $("queueModal").classList.remove("open");
      if (queuePollTimer) { clearInterval(queuePollTimer); queuePollTimer = 0; }
    }
    if ($("queueBtn")) $("queueBtn").addEventListener("click", openQueueModal);
    if ($("queueModalClose")) $("queueModalClose").addEventListener("click", closeQueueModal);
    if ($("queueModal")) $("queueModal").addEventListener("click", (e) => {
      if (e.target === $("queueModal")) closeQueueModal();
    });
    if ($("queueRefreshBtn")) $("queueRefreshBtn").addEventListener("click", loadQueueModal);
    if ($("queueParallel")) {
      $("queueParallel").addEventListener("change", async () => {
        const parallel = Number($("queueParallel").value) || 1;
        await fetch("/api/convert/batch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ids: [], kind: "mp4", parallel }),
        }).catch(() => {});
        loadQueueModal();
      });
    }
    if ($("queueBody")) {
      $("queueBody").addEventListener("click", async (e) => {
        const btn = e.target.closest(".queue-cancel");
        if (!btn) return;
        const jid = btn.dataset.jid;
        await fetch("/api/convert-mp4/job/" + encodeURIComponent(jid) + "/cancel", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: "{}",
        });
        loadQueueModal();
      });
    }

    // —— 换封面 ——
    if ($("btnCover")) {
      $("btnCover").addEventListener("click", () => {
        const p = $("coverPanel");
        if (!p) return;
        p.style.display = p.style.display === "none" ? "flex" : "none";
        const video = $("player");
        if (video && $("coverSeek") && video.currentTime > 0) {
          $("coverSeek").value = String(Math.floor(video.currentTime * 10) / 10);
        }
      });
    }

    function applyCoverLocally(videoId, data, rootHint) {
      // Cover updates must not call hard refresh(): that resets offset to 0 and
      // jumps the scrolled list. Patch the visible card + in-memory row only.
      const scroll = $("contentScroll");
      const beforeTop = scroll ? Math.round(scroll.scrollTop) : 0;
      const beforeHeight = scroll ? scroll.scrollHeight : 0;
      const beforeOffset = state.offset || 0;
      const beforeLoaded = state.loadedVideos ? state.loadedVideos.length : 0;
      const thumbId = String((data && data.thumb_id) || videoId || "");
      const thumbV = Number((data && data.thumb_v) || Date.now()) || Date.now();
      const root = String(rootHint || (currentPlayMeta && currentPlayMeta.root) || "");
      const url = thumbUrlFor(thumbId, thumbV, root);
      let cardsHit = 0;
      let imgsHit = 0;
      let rowsHit = 0;
      let continueHit = 0;

      document.querySelectorAll("#grid .card").forEach((card) => {
        const id = card.dataset.id || "";
        const cover = card.dataset.cover || "";
        if (id !== videoId && cover !== videoId && cover !== thumbId) return;
        cardsHit += 1;
        card.dataset.cover = thumbId;
        card.dataset.hasThumb = "1";
        const img = card.querySelector("img");
        if (!img) return;
        imgsHit += 1;
        if (img.dataset.thumbUrl) thumbsLoaded.delete(img.dataset.thumbUrl);
        requestThumbReload(img, url);
      });

      document.querySelectorAll("#continueBar .continue-chip").forEach((chip) => {
        if ((chip.dataset.playId || "") !== videoId) return;
        continueHit += 1;
        const img = chip.querySelector("img");
        if (!img) return;
        if (img.dataset.thumbUrl) thumbsLoaded.delete(img.dataset.thumbUrl);
        requestThumbReload(img, url);
      });

      if (Array.isArray(state.loadedVideos)) {
        state.loadedVideos.forEach((row) => {
          if (!row) return;
          const id = String(row.id || "");
          const coverId = String(row.thumb_id || row.cover_id || "");
          if (id !== videoId && coverId !== videoId && coverId !== thumbId) return;
          rowsHit += 1;
          row.has_thumb = true;
          row.thumb_v = thumbV;
          if (thumbId) row.thumb_id = thumbId;
        });
      }

      // Soft refresh used to stamp has_more from the page-at-offset response.
      // If we are mid-list (loaded < total) but hasMore was wrongly cleared,
      // heal it here so closing the player does not leave load-more dead.
      const loadedTotal =
        (Number(state.loadedBaseOffset) || 0)
        + (state.loadedVideos ? state.loadedVideos.length : 0);
      const total = Number(state.totalCount) || 0;
      let hasMoreRepaired = false;
      if (total > 0 && loadedTotal < total && !state.hasMore) {
        state.hasMore = true;
        hasMoreRepaired = true;
        try { updateGridHint(); } catch (_) {}
      }

      const afterTop = scroll ? Math.round(scroll.scrollTop) : 0;
      const afterHeight = scroll ? scroll.scrollHeight : 0;
      clientLog("cover_local_applied", {
        video_id: videoId,
        thumb_id: thumbId,
        thumb_v: thumbV,
        root,
        cards_hit: cardsHit,
        imgs_hit: imgsHit,
        loaded_rows_hit: rowsHit,
        continue_hit: continueHit,
        before_scroll_top: beforeTop,
        after_scroll_top: afterTop,
        scroll_delta_px: afterTop - beforeTop,
        before_scroll_height: beforeHeight,
        after_scroll_height: afterHeight,
        before_offset: beforeOffset,
        after_offset: state.offset || 0,
        before_loaded: beforeLoaded,
        after_loaded: state.loadedVideos ? state.loadedVideos.length : 0,
        loaded_total: loadedTotal,
        total,
        has_more: !!state.hasMore,
        has_more_repaired: hasMoreRepaired,
        modal_open: !!($("modal") && $("modal").classList.contains("open")),
      }, cardsHit || rowsHit ? "INFO" : "WARN");
      return { cardsHit, imgsHit, rowsHit, continueHit, beforeTop, afterTop, hasMoreRepaired };
    }

    async function applyCoverSeek(seek) {
      if (!currentPlayId) return;
      $("modalInfo").textContent = "正在截取封面…";
      const root = (currentPlayMeta && currentPlayMeta.root) || "";
      const scroll = $("contentScroll");
      clientLog("cover_seek_start", {
        video_id: currentPlayId,
        seek,
        root,
        scroll_top: scroll ? Math.round(scroll.scrollTop) : 0,
        offset: state.offset || 0,
        loaded: state.loadedVideos ? state.loadedVideos.length : 0,
      });
      try {
        const url = "/api/thumb/" + encodeURIComponent(currentPlayId) + (root ? ("?root=" + encodeURIComponent(root)) : "");
        const r = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ seek }),
        });
        const data = await r.json();
        $("modalInfo").textContent = data.msg || (data.ok ? "封面已更新" : "失败");
        if (data.ok) {
          const local = applyCoverLocally(currentPlayId, data, root);
          clientLog("cover_seek_done", {
            video_id: currentPlayId,
            seek,
            thumb_v: data.thumb_v || 0,
            thumb_id: data.thumb_id || "",
            cards_hit: local.cardsHit,
            scroll_top: local.afterTop,
            refresh_skipped: true,
          });
        } else {
          clientLog("cover_seek_failed", {
            video_id: currentPlayId,
            seek,
            msg: data.msg || "",
          }, "WARN");
        }
      } catch (e) {
        $("modalInfo").textContent = "换封面失败: " + e;
        clientLog("cover_seek_failed", {
          video_id: currentPlayId,
          seek,
          error: String(e && (e.stack || e) || "unknown"),
        }, "ERROR");
      }
    }
    if ($("btnCoverSeek")) {
      $("btnCoverSeek").addEventListener("click", () => {
        const seek = Number($("coverSeek") && $("coverSeek").value) || 3;
        applyCoverSeek(seek);
      });
    }
    if ($("btnCoverNow")) {
      $("btnCoverNow").addEventListener("click", () => {
        const video = $("player");
        const seek = video ? (video.currentTime || 0) : 3;
        if ($("coverSeek")) $("coverSeek").value = String(Math.floor(seek * 10) / 10);
        applyCoverSeek(seek);
      });
    }
    if ($("coverFile")) {
      $("coverFile").addEventListener("change", async () => {
        const f = $("coverFile").files && $("coverFile").files[0];
        if (!f || !currentPlayId) return;
        const fd = new FormData();
        fd.append("file", f);
        const root = (currentPlayMeta && currentPlayMeta.root) || "";
        const url = "/api/thumb/" + encodeURIComponent(currentPlayId) + (root ? ("?root=" + encodeURIComponent(root)) : "");
        $("modalInfo").textContent = "正在上传封面…";
        const scroll = $("contentScroll");
        clientLog("cover_upload_start", {
          video_id: currentPlayId,
          root,
          file_name: f.name || "",
          file_size: f.size || 0,
          scroll_top: scroll ? Math.round(scroll.scrollTop) : 0,
          offset: state.offset || 0,
          loaded: state.loadedVideos ? state.loadedVideos.length : 0,
        });
        try {
          const r = await fetch(url, { method: "POST", body: fd });
          const data = await r.json();
          $("modalInfo").textContent = data.msg || (data.ok ? "封面已更新" : "失败");
          if (data.ok) {
            const local = applyCoverLocally(currentPlayId, data, root);
            clientLog("cover_upload_done", {
              video_id: currentPlayId,
              thumb_v: data.thumb_v || 0,
              thumb_id: data.thumb_id || "",
              cards_hit: local.cardsHit,
              scroll_top: local.afterTop,
              refresh_skipped: true,
            });
          } else {
            clientLog("cover_upload_failed", {
              video_id: currentPlayId,
              msg: data.msg || "",
            }, "WARN");
          }
        } catch (e) {
          $("modalInfo").textContent = "上传失败: " + e;
          clientLog("cover_upload_failed", {
            video_id: currentPlayId,
            error: String(e && (e.stack || e) || "unknown"),
          }, "ERROR");
        }
        $("coverFile").value = "";
      });
    }

    renderMountChips();

    // —— 设置：隐私、性能与反馈 ——
    async function openPrivacyModal() {
      try {
        const data = await fetch("/api/privacy").then((r) => r.json());
        if (!data.ok) {
          alert(data.msg || "无法读取隐私设置");
          return;
        }
        $("privacyEncrypt").checked = !!data.encrypt_thumbs;
        $("probeVideoDuration").checked = !!data.probe_video_duration;
        $("probeVideoAudio").checked = !!data.probe_video_audio;
        $("fullLogging").checked = !!data.full_logging;
        const loc = data.cache_location === "disk" ? "disk" : "program";
        document.querySelectorAll('input[name="privacyCacheLoc"]').forEach((el) => {
          el.checked = el.value === loc;
        });
        $("privacyPathHint").textContent = "当前：" + (data.cache_hint || data.cache_path || "");
        $("privacyModal").classList.add("open");
      } catch (e) {
        alert("读取失败: " + e);
      }
    }
    if ($("settingsBtn")) $("settingsBtn").addEventListener("click", openPrivacyModal);
    if ($("privacyModalClose")) $("privacyModalClose").addEventListener("click", () => $("privacyModal").classList.remove("open"));
    if ($("privacyCancel")) $("privacyCancel").addEventListener("click", () => $("privacyModal").classList.remove("open"));
    if ($("privacyModal")) $("privacyModal").addEventListener("click", (e) => {
      if (e.target === $("privacyModal")) $("privacyModal").classList.remove("open");
    });
    if ($("privacySave")) $("privacySave").addEventListener("click", async () => {
      const encrypt = !!($("privacyEncrypt") && $("privacyEncrypt").checked);
      const probe_video_duration = !!($("probeVideoDuration") && $("probeVideoDuration").checked);
      const probe_video_audio = !!($("probeVideoAudio") && $("probeVideoAudio").checked);
      const full_logging = !!($("fullLogging") && $("fullLogging").checked);
      const locEl = document.querySelector('input[name="privacyCacheLoc"]:checked');
      const cache_location = (locEl && locEl.value) || "program";
      try {
        const r = await fetch("/api/privacy", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            encrypt_thumbs: encrypt,
            cache_location,
            probe_video_duration,
            probe_video_audio,
            full_logging,
          }),
        });
        const data = await r.json();
        if (!data.ok) {
          alert(data.msg || "保存失败");
          return;
        }
        state._fullLogging = !!data.full_logging;
        $("privacyModal").classList.remove("open");
        alert(data.msg || "已保存");
        try { await refresh(); } catch (_) {}
      } catch (e) {
        alert("保存失败: " + e);
      }
    });

    $("exportStaticBtn").addEventListener("click", async () => {
      if (!state.root) {
        alert("请先打开/扫描一个盘");
        return;
      }
      if (!confirm(
        "导出纯静态站？\n\n" +
        "会生成到当前盘根目录下的 _video_gallery_static/\n" +
        "内含 index.html、预览图、data.js。\n" +
        "电脑可直接打开 index.html 浏览封面墙。\n" +
        "运行「打开图库」后，同一 WiFi 下的手机浏览器也能打开控制台里的地址。\n" +
        "（视频文件不会被复制，仍引用原路径。）"
      )) return;
      $("exportStaticBtn").disabled = true;
      $("exportStaticBtn").textContent = "正在导出…";
      $("status").textContent = "正在导出静态站…";
      try {
        const r = await fetch("/api/export-static", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ open_folder: true }),
        });
        const data = await r.json();
        if (!data.ok) {
          alert(data.msg || "导出失败");
          $("exportStaticBtn").disabled = false;
          $("exportStaticBtn").textContent = "导出静态站";
          return;
        }
        startPoll();
        // 轮询直到结束
        const waitDone = async () => {
          for (let i = 0; i < 600; i++) {
            await new Promise((res) => setTimeout(res, 1000));
            const st = await fetch("/api/export-static/status").then((x) => x.json()).catch(() => null);
            if (!st) continue;
            if (st.exporting) {
              if (st.msg) $("status").textContent = st.msg;
              continue;
            }
            $("exportStaticBtn").textContent = "导出静态站";
            $("exportStaticBtn").disabled = false;
            if (st.ok) {
              $("status").textContent = st.msg || ("已导出: " + (st.path || ""));
              alert(st.msg || "导出完成");
            } else {
              alert(st.msg || "导出失败");
            }
            return;
          }
          $("exportStaticBtn").textContent = "导出静态站";
          $("exportStaticBtn").disabled = false;
          alert("导出仍在进行，请稍后再看状态栏或导出目录。");
        };
        waitDone();
      } catch (e) {
        alert("导出请求失败: " + e);
        $("exportStaticBtn").disabled = false;
        $("exportStaticBtn").textContent = "导出静态站";
      }
    });

    $("menuBtn").addEventListener("click", toggleSidebar);
    $("sidebarHideBtn").addEventListener("click", () => setSidebarHidden(true));
    $("sidebarShowBtn").addEventListener("click", () => setSidebarHidden(false));

    try {
      if (localStorage.getItem("vg_sidebar_hidden") === "1" && !isMobile()) {
        setSidebarHidden(true);
      }
    } catch (_) {}

    setupScopeSticky();

    // 打开页面：先自动检测磁盘/媒体目录数量，再刷新列表
    (async () => {
      $("status").textContent = "正在自动检测本机磁盘和媒体目录…";
      const driveData = await loadDrives();
      const n = (driveData.drives || state.drives || []).length;
      const letters = (state.drives || []).map((d) => d.letter).join("、");
      $("status").textContent = n
        ? `已自动检测到 ${n} 个磁盘/目录${letters ? "：" + letters : ""}。选择后点「扫描所选项」，不同磁盘会自动加入同一片库。`
        : "未检测到磁盘或媒体目录，请检查硬盘是否已连接，或重启应用";

      await refresh();
      // /api/tree may be browser-cached without the latest lan_share; /api/share is source of truth.
      try {
        clientLog("lan_share_boot", {
          stage: "share_fetch_start",
          state_lan: !!state.lanShare,
          dom_primary: !!($("lanBtn") && $("lanBtn").classList.contains("primary")),
        });
        const share = await fetch("/api/share", { cache: "no-store" }).then((r) => r.json());
        clientLog("lan_share_boot", {
          stage: "share_fetch_done",
          api_lan: !!share.lan,
          pref_lan: !!share.pref_lan,
          url_count: Array.isArray(share.urls) ? share.urls.length : 0,
          lan_url_count: (share.urls || []).filter((u) => !String(u).includes("127.0.0.1")).length,
          state_lan_before: !!state.lanShare,
          dom_primary_before: !!($("lanBtn") && $("lanBtn").classList.contains("primary")),
        });
        syncLanShareUi(!!share.lan, share.urls, "boot_share");
      } catch (err) {
        clientLog("lan_share_boot", {
          stage: "share_fetch_failed",
          error: String(err && (err.message || err) || "unknown").slice(0, 240),
        }, "ERROR");
      }
      startPoll();
      const d = state.navCache || {};
      if (!d.scanning && n) {
        // 若服务端还没在扫，状态里保留磁盘检测结果
        const cur = $("status").textContent || "";
        if (!cur.includes("扫描")) {
          $("status").textContent =
            `已自动检测到 ${n} 个磁盘/目录${letters ? "：" + letters : ""} · 当前 ${d.root || selectedDrivePath() || ""}`;
        }
      }
    })();
  </script>
</body>
</html>
