<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>本地视频库</title>
  <style>
    :root {
      --bg: #0e1116;
      --bg2: #151a22;
      --bg3: #1c2330;
      --border: #2a3344;
      --text: #e8edf5;
      --muted: #8b97ab;
      --accent: #00c8d4;
      --accent-dim: #009aa3;
      --tag: #2a2f3a;
      --tag-hover: #353b48;
      --hover: #243044;
      --danger: #e85d5d;
      --radius: 10px;
      --sidebar-w: 280px;
      --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }

    /* top bar */
    header {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 8px;
      padding: 10px 14px;
      background: linear-gradient(180deg, #141920 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 20;
      overflow-x: auto;
      overflow-y: hidden;
    }
    header .btn {
      padding: 7px 11px;
      font-size: 0.82rem;
      flex-shrink: 0;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      background: rgba(255,255,255,0.025);
      flex-shrink: 0;
    }
    .header-actions .btn {
      border-color: transparent;
      background: transparent;
    }
    .header-actions .btn:hover {
      background: var(--hover);
      border-color: var(--border);
    }
    .header-actions a.btn {
      text-decoration: none;
      color: inherit;
      display: inline-flex;
      align-items: center;
    }
    .brand {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand span { color: var(--accent); }
    .search-wrap {
      flex: 1 1 160px;
      width: auto;
      min-width: 120px;
      max-width: 280px;
      position: relative;
      transition: max-width 0.22s ease;
    }
    .search-wrap:focus-within {
      flex: 1 1 320px;
      max-width: min(420px, 36vw);
    }
    .search-wrap input {
      width: 100%;
      padding: 9px 14px 9px 36px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.22s ease, background 0.15s ease;
    }
    .search-wrap input:focus {
      border-color: var(--accent);
      background: #18202b;
      box-shadow: 0 0 0 3px rgba(0, 200, 212, 0.12);
    }
    .search-wrap::before {
      content: "⌕";
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 1rem;
    }
    .meta {
      color: var(--muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .btn:hover { background: var(--hover); border-color: var(--accent-dim); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); }

    .drive-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 1;
      min-width: 0;
    }
    .drive-bar label {
      color: var(--muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .drive-bar select {
      min-width: 140px;
      max-width: 220px;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    .drive-bar select:focus { border-color: var(--accent); }
    .drive-hint {
      font-size: 0.75rem;
      color: var(--muted);
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lib-nav {
      display: none;
      flex-direction: column;
      gap: 2px;
      padding: 8px 10px 10px;
      border-bottom: 1px solid var(--border);
    }
    .lib-nav.show { display: flex; }
    .lib-nav-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 0 6px 4px;
    }
    .lib-nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      width: 100%;
      font-size: 0.85rem;
    }
    .lib-nav-item:hover { background: var(--hover); }
    .lib-nav-item.active {
      background: rgba(56, 132, 255, 0.16);
      border-color: var(--accent-dim);
    }
    .lib-nav-item .lib-nav-text {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lib-nav-item .badge {
      margin-left: auto;
      opacity: 0.75;
      font-size: 0.75rem;
    }
    .lib-nav-item .lib-nav-x {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
    }
    .lib-nav-item .lib-nav-x:hover { color: var(--danger); }
    .lib-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(56, 132, 255, 0.2);
      color: #9ec1ff;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .card-meta .lib-badge { margin-right: 4px; }
    .cover-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 8px 14px 12px;
      border-top: 1px solid var(--border);
      background: var(--bg2);
      font-size: 0.85rem;
    }
    .cover-panel label { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
    .cover-panel input[type="number"] {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 6px;
    }
    .drive-count {
      display: inline-block;
      min-width: 1.2em;
      padding: 0 6px;
      margin-left: 2px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      line-height: 1.4;
      vertical-align: middle;
    }

    /* layout */
    .main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* sidebar */
    aside {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.2s, margin 0.2s, opacity 0.2s;
      position: relative;
      z-index: 40;
    }
    aside.collapsed {
      width: 0;
      border-right: none;
      opacity: 0;
      pointer-events: none;
    }
    .aside-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 12px 6px 16px;
      gap: 8px;
    }
    .aside-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0;
    }
    .aside-hide {
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .aside-hide:hover { color: var(--text); border-color: var(--accent-dim); }
    .sidebar-show {
      display: none;
      position: absolute;
      left: 10px;
      top: 70px;
      z-index: 25;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
    body.sidebar-hidden .sidebar-show { display: block; }
    body.sidebar-hidden aside { width: 0; border: none; opacity: 0; pointer-events: none; }

    .type-list {
      display: none;
    }
    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px 16px;
    }
    .channel-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      user-select: none;
      margin-bottom: 2px;
    }
    .channel-item:hover { background: var(--hover); }
    .channel-item.active {
      background: rgba(0, 200, 212, 0.12);
      color: var(--accent);
      font-weight: 600;
    }
    .channel-item .ico {
      width: 22px;
      text-align: center;
      opacity: 0.85;
      flex-shrink: 0;
    }
    .channel-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .channel-item .badge {
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--bg3);
      padding: 1px 7px;
      border-radius: 999px;
    }
    .channel-item .ch-twisty {
      width: 16px;
      flex-shrink: 0;
      text-align: center;
      opacity: 0.7;
      font-size: 0.7rem;
      cursor: pointer;
      user-select: none;
    }
    .channel-item.channel-disk {
      font-weight: 600;
      margin-top: 4px;
      background: rgba(255,255,255,0.03);
    }
    .channel-item.channel-disk.disk-scoped {
      color: var(--accent);
      background: rgba(0, 200, 212, 0.08);
    }
    .channel-item.channel-nested.muted {
      opacity: 0.55;
      pointer-events: none;
    }
    .channel-children {
      padding: 2px 0 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .channel-item.channel-nested {
      padding-left: 8px;
      font-weight: 400;
      font-size: 0.9rem;
    }
    .tree-item.tree-disk .label { font-weight: 600; }
    .lib-nav { display: none !important; }

    .filters {
      padding: 12px 20px 4px;
      background: linear-gradient(180deg, #12161d 0%, var(--bg) 100%);
      flex-shrink: 0;
    }
    .filter-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .filter-label {
      flex-shrink: 0;
      min-width: 42px;
      max-width: 72px;
      padding-top: 6px;
      font-size: 0.82rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    #subFolderRows {
      max-height: min(36vh, 280px);
      overflow-x: hidden;
      overflow-y: auto;
      margin-bottom: 2px;
    }
    #subFolderRows:empty { display: none; margin: 0; }
    .tag {
      border: 1px solid transparent;
      background: var(--bg3);
      color: var(--text);
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.86rem;
      font-family: inherit;
      line-height: 1.35;
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
    }
    .tag:hover { background: var(--tag-hover); border-color: var(--border); }
    .tag.active {
      background: rgba(0, 200, 212, 0.15);
      color: var(--accent);
      border-color: rgba(0, 200, 212, 0.35);
      font-weight: 600;
    }
    .tag .tag-n {
      font-size: 0.72em;
      font-weight: 500;
      color: var(--muted);
      opacity: 0.85;
      letter-spacing: 0;
      transform: translateY(-0.05em);
    }
    .tag.active .tag-n {
      color: var(--accent);
      opacity: 0.7;
    }
    .tree-panel {
      display: none;
      padding: 0 8px 12px;
      border-top: 1px solid var(--border);
      max-height: 40%;
      overflow: auto;
    }
    .tree-panel.open { display: block; }

    .tree {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 16px;
    }
    .tree-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      user-select: none;
    }
    .tree-item:hover { background: var(--hover); }
    .tree-item.active {
      background: rgba(61, 156, 240, 0.15);
      color: var(--accent);
    }
    .tree-item .twisty {
      width: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.7rem;
      flex-shrink: 0;
    }
    .tree-item .label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tree-item .badge {
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--bg3);
      padding: 1px 7px;
      border-radius: 999px;
    }
    .tree-children { margin-left: 12px; border-left: 1px solid var(--border); padding-left: 4px; }
    .tree-children.collapsed { display: none; }

    /* content：整栏可滚动（菜单+列表一起滑），避免菜单占死视口 */
    section.content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
    }
    /* 完整筛选不吸顶；滑动后吸顶显示当前选中的那一行筛选标签 */
    .scope-sticky {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 10px;
      min-height: 48px;
      padding: 8px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(14, 17, 22, 0.96);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }
    .scope-sticky .crumb,
    .sticky-filter-row {
      grid-column: 1;
      grid-row: 1;
      min-width: 0;
    }
    .scope-sticky .crumb {
      padding: 0;
      color: var(--muted);
      font-size: 0.85rem;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }
    .scope-sticky .crumb .sep { opacity: 0.4; }
    .scope-sticky .crumb .count { color: var(--text); }
    .sticky-filter-row {
      display: flex;
      align-items: center;
      gap: 10px;
      visibility: hidden;
      pointer-events: none;
    }
    .scope-sticky.is-stuck.has-filter-row .crumb {
      visibility: hidden;
      pointer-events: none;
    }
    .scope-sticky.is-stuck.has-filter-row .sticky-filter-row {
      visibility: visible;
      pointer-events: auto;
    }
    .sticky-filter-row .filter-label {
      flex-shrink: 0;
      min-width: 42px;
      max-width: 72px;
      font-size: 0.82rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sticky-filter-row .filter-tags {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .scope-filter-btn {
      grid-column: 2;
      grid-row: 1;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.78rem;
      font-family: inherit;
      white-space: nowrap;
    }
    .scope-filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .scope-sticky.is-stuck .scope-filter-btn {
      border-color: rgba(0, 200, 212, 0.35);
      color: var(--accent);
    }
    .status-bar {
      padding: 8px 20px;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.45;
      flex-shrink: 0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      word-break: break-all;
      border-bottom: 1px solid transparent;
    }
    .continue-bar {
      padding: 8px 20px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      background: var(--bg);
    }
    .continue-bar .cont-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-right: 4px;
      flex-shrink: 0;
    }
    .continue-chip {
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.82rem;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .continue-chip:hover { border-color: var(--accent); color: var(--accent); }
    .continue-chip .pct {
      opacity: 0.7;
      font-size: 0.75em;
      margin-left: 6px;
    }
    .media-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
      margin: 10px 0;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg2);
    }
    .media-row-thumb {
      width: 96px;
      min-width: 96px;
      height: 54px;
      border-radius: 6px;
      overflow: hidden;
      background: #0a0c10;
      position: relative;
    }
    .media-row-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .media-row-thumb .ph {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.7rem;
    }
    .media-row-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .media-row-body strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .media-row-meta {
      opacity: 0.75;
      font-size: 0.82em;
      line-height: 1.35;
      word-break: break-all;
    }
    .media-row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .media-row-check {
      margin-top: 4px;
      flex-shrink: 0;
    }
    button.media-row-btn {
      display: flex;
      gap: 12px;
      width: 100%;
      text-align: left;
      align-items: stretch;
      margin: 8px 0;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg2);
      color: var(--text);
      cursor: pointer;
    }
    button.media-row-btn:hover { border-color: var(--accent); }
    .grid-wrap {
      flex: 0 0 auto;
      overflow: visible;
      padding: 8px 20px 48px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }
    .card {
      cursor: pointer;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg2);
      border: 1px solid transparent;
      transition: border-color 0.15s, transform 0.15s;
      content-visibility: auto;
      contain-intrinsic-size: 220px 290px;
    }
    .card:hover {
      border-color: var(--accent-dim);
      transform: translateY(-2px);
    }
    .thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0a0c10;
      overflow: hidden;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb .play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.35);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .card:hover .play { opacity: 1; }
    .play-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(61, 156, 240, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-icon::after {
      content: "";
      width: 0; height: 0;
      border-style: solid;
      border-width: 8px 0 8px 14px;
      border-color: transparent transparent transparent #fff;
      margin-left: 3px;
    }

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
  <script>
    const state = {
      tree: null,
      types: [],
      genres: [],
      categories: [],
      category: "",
      folder: "",
      folderAll: false,
      ext: "",
      genre: "",
      sort: "mtime_desc",
      view: "series",
      query: "",
      expanded: new Set([""]),
      root: "",
      hasFfmpeg: false,
      drives: [],
      offset: 0,
      pageSize: 60,
      hasMore: false,
      totalCount: 0,
      rawCount: 0,
      lastPlayId: "",
      loadedVideos: [],
      virtualEnabled: false,
      lib: "",           // 当前浏览的挂载根；空=全部
      mountedRoots: [],  // [{path,label,count,categories}]
      multi: false,
      libExpanded: null, // Set of expanded disk paths in channel list
    };

    const CHANNEL_ICO = {
      "": "▣",
      "__all__": "◎",
      "电影": "🎬",
      "电视剧": "📺",
      "综艺": "🎤",
      "动漫": "✨",
      "少儿": "🧸",
      "纪录片": "📡",
      "短剧": "▶",
      "体育": "⚽",
      "音乐": "♪",
      "教育": "📚",
      "其他": "⋯",
      "未分类": "▫",
    };

    const SORTS = [
      { id: "mtime_desc", label: "最新" },
      { id: "mtime_asc", label: "最早" },
      { id: "size_desc", label: "最大" },
      { id: "duration_desc", label: "最长" },
      { id: "duration_asc", label: "最短" },
      { id: "name", label: "名称" },
    ];

    const VIRTUAL_MIN = 150;
    const VIRTUAL_ROW_H = 288;
    const VIRTUAL_GAP = 18;

    const $ = (id) => document.getElementById(id);

    const PREFS_KEY = "vg_ui_prefs";
    const PLAY_PROG_KEY = "vg_play_progress";

    function loadUiPrefs() {
      try {
        const raw = localStorage.getItem(PREFS_KEY);
        if (!raw) return;
        const p = JSON.parse(raw);
        if (p.sort) state.sort = p.sort;
        if (p.view === "flat" || p.view === "series") state.view = p.view;
        if (typeof p.category === "string") state.category = p.category;
        if (typeof p.folder === "string") state.folder = p.folder;
        if (typeof p.folderAll === "boolean") state.folderAll = p.folderAll;
        else if (state.folder) state.folderAll = true;
        if (typeof p.ext === "string") state.ext = p.ext;
        if (typeof p.genre === "string") state.genre = p.genre;
        if (typeof p.query === "string") state.query = p.query;
        if (p.drive) state._preferDrive = p.drive;
        if (p.lastPlayId) state.lastPlayId = p.lastPlayId;
      } catch (_) {}
    }

    function saveUiPrefs() {
      try {
        const drive = ($("driveSelect") && $("driveSelect").value) || state._preferDrive || "";
        localStorage.setItem(PREFS_KEY, JSON.stringify({
          sort: state.sort,
          view: state.view || "series",
          category: state.category,
          folder: state.folder,
          folderAll: !!state.folderAll,
          ext: state.ext,
          genre: state.genre,
          query: state.query || "",
          drive,
          lastPlayId: state.lastPlayId || "",
        }));
      } catch (_) {}
    }

    function loadPlayProgressMap() {
      try {
        return JSON.parse(localStorage.getItem(PLAY_PROG_KEY) || "{}") || {};
      } catch (_) {
        return {};
      }
    }

    function getPlayProgress(id) {
      const m = loadPlayProgressMap();
      const row = m[id];
      if (!row) return 0;
      if (row.done) return 0;
      if (!(row.t > 5)) return 0;
      return Number(row.t) || 0;
    }

    function getPlayRow(id) {
      const m = loadPlayProgressMap();
      return m[id] || null;
    }

    function savePlayProgress(id, t, duration, meta) {
      if (!id) return;
      try {
        const m = loadPlayProgressMap();
        const dur = Number(duration) || 0;
        const nearEnd = dur > 30 && t >= dur - 5;
        if (t < 5 && !nearEnd) {
          // 刚开始不算
          if (!m[id]) return;
        }
        const prev = m[id] || {};
        const root = (meta && meta.root) || prev.root || state.root || "";
        const rel = (meta && meta.rel) || prev.rel || "";
        const baseMeta = {
          name: (meta && meta.name) || prev.name || "",
          folder: (meta && meta.folder) || prev.folder || "",
          root,
          rel,
        };
        if (nearEnd) {
          m[id] = {
            t: Math.floor(dur || t),
            duration: Math.floor(dur),
            updated: Date.now(),
            done: true,
            ...baseMeta,
          };
        } else if (t >= 5) {
          m[id] = {
            t: Math.floor(t),
            duration: Math.floor(dur),
            updated: Date.now(),
            done: false,
            ...baseMeta,
          };
        }
        const keys = Object.keys(m);
        if (keys.length > 300) {
          keys.sort((a, b) => (m[a].updated || 0) - (m[b].updated || 0));
          for (let i = 0; i < keys.length - 300; i++) delete m[keys[i]];
        }
        localStorage.setItem(PLAY_PROG_KEY, JSON.stringify(m));
        renderContinueBar();
      } catch (_) {}
    }

    function historyHints(rows) {
      const hints = {};
      (rows || []).forEach((r) => {
        if (!r || !r.id) return;
        if (r.root || r.rel) {
          hints[r.id] = { root: r.root || "", rel: r.rel || "" };
        }
      });
      return hints;
    }

    function infoUrl(id, root) {
      let u = "/api/info/" + encodeURIComponent(id);
      if (root) u += "?root=" + encodeURIComponent(root);
      return u;
    }

    async function openFromHistory(id, rootHint) {
      const row = getPlayRow(id) || {};
      const root = rootHint || row.root || "";
      const r = await fetch(infoUrl(id, root));
      if (!r.ok) {
        const offline = root && !(state.root && String(state.root).toLowerCase() === String(root).toLowerCase());
        throw new Error(
          offline
            ? ("找不到该片。若来自其他磁盘，请确认主机已插入/打开：\n" + root)
            : "无法打开（可能已移出片库，或对应磁盘未连接）"
        );
      }
      const info = await r.json();
      // 补全进度里的 root/rel，方便下次跨盘
      try {
        const m = loadPlayProgressMap();
        if (m[id]) {
          m[id].root = info.root || m[id].root || root || state.root || "";
          m[id].rel = info.rel || m[id].rel || "";
          if (info.name) m[id].name = info.name;
          if (info.folder) m[id].folder = info.folder;
          localStorage.setItem(PLAY_PROG_KEY, JSON.stringify(m));
        }
      } catch (_) {}
      openPlayer(
        id,
        info.name,
        `${info.size_h || ""} · ${info.folder || info.rel || ""}`,
        info.ext,
        info.kind || "",
        info.seg_count || 0,
        {
          path: info.path || "",
          folder: info.folder || "",
          root: info.root || root || state.root || "",
          rel: info.rel || "",
          browser_hard: !!info.browser_hard,
          browser_ok: !!info.browser_ok,
          audio_hard: !!info.audio_hard,
          audio_codec: info.audio_codec || "",
        }
      );
    }

    function historyEntries(kind) {
      const m = loadPlayProgressMap();
      let rows = Object.keys(m).map((id) => ({ id, ...(m[id] || {}) }));
      if (kind === "resume") {
        rows = rows.filter((r) => !r.done && (r.t || 0) > 5);
      } else if (kind === "done") {
        rows = rows.filter((r) => r.done);
      }
      rows.sort((a, b) => (b.updated || 0) - (a.updated || 0));
      return rows;
    }

    function renderContinueBar() {
      const bar = $("continueBar");
      if (!bar) return;
      const rows = historyEntries("resume").slice(0, 8);
      if (!rows.length) {
        bar.style.display = "none";
        bar.innerHTML = "";
        return;
      }
      bar.style.display = "flex";
      // 异步补缩略图信息
      bar.innerHTML = `<span class="cont-label">继续看</span>` + rows.map((r) => {
        const dur = Number(r.duration) || 0;
        const pct = dur > 0 ? Math.min(99, Math.round((r.t / dur) * 100)) : 0;
        const label = escapeHtml(r.name || r.id);
        return `<button type="button" class="continue-chip" data-play-id="${escapeAttr(r.id)}" title="${escapeAttr(r.folder || r.root || "")}" style="display:inline-flex;align-items:center;gap:8px;max-width:260px">
          <span class="media-row-thumb" style="width:48px;min-width:48px;height:28px;border-radius:4px">
            <img src="/thumb/${escapeAttr(r.id)}?v=1${r.root ? `&root=${encodeURIComponent(r.root)}` : ""}" alt="" loading="lazy"
              onerror="this.style.opacity=.15" />
          </span>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${label}${pct ? `<span class="pct">${pct}%</span>` : ""}</span>
        </button>`;
      }).join("");
    }

    async function fetchTree() {
      const params = new URLSearchParams();
      if (state.lib) params.set("lib", state.lib);
      const r = await fetch("/api/tree" + (params.toString() ? ("?" + params) : ""));
      return r.json();

    async function fetchVideos(offset) {
      const params = new URLSearchParams();
      if (state.category) params.set("category", state.category);
      if (state.folder) params.set("folder", state.folder);
      if (state.folder && state.folderAll) params.set("folder_all", "1");
      if (state.ext) params.set("ext", state.ext);
      if (state.genre) params.set("genre", state.genre);
      if (state.sort) params.set("sort", state.sort);
      if (state.view) params.set("view", state.view);

    async function loadDrives() {
      const sel = $("driveSelect");
      $("driveHint").textContent = "正在检测盘符…";

      const apply = (data) => {
        state.drives = data.drives || [];
        state.root = data.current || state.root;
        const n = state.drives.length;
        $("driveCountBadge").textContent = String(n);
        if (!n) {
          sel.innerHTML = '<option value="">未检测到盘符</option>';
          $("driveHint").textContent = "未检测到可用盘符";
          return;
        }
        const prev = sel.value;
        const letters = state.drives.map((d) => d.letter).join("、");
        sel.innerHTML = state.drives.map((d) => {
          const free = d.free_h ? ("（剩余 " + d.free_h + "）") : "";
          const text = (d.display || d.letter) + free;
          const val = d.letter || d.path;
          return '<option value="' + escapeAttr(val) + '">' + escapeHtml(text) + "</option>";
        }).join("");
        const active = state.drives.find((d) => d.active);
        const pick = (d) => d.letter || d.path;
        const prefer = state._preferDrive;
        if (prefer && [...sel.options].some((o) => o.value === prefer)) sel.value = prefer;
        else if (active) sel.value = pick(active);
        else if (prev && [...sel.options].some((o) => o.value === prev)) sel.value = prev;
        else sel.value = pick(state.drives[n - 1]);
        state._preferDrive = sel.value;
        $("driveHint").textContent = "已检测到 " + n + " 个盘符：" + letters;
        updateDriveHint(true);
        saveUiPrefs();
        const scanning = !!data.scanning;
        $("scanDriveBtn").disabled = scanning;
        sel.disabled = scanning;
        $("rescanBtn").disabled = scanning;
        if ($("exportStaticBtn")) $("exportStaticBtn").disabled = scanning || !!data.exporting;
      };

      // 1) 先用页面启动时注入的数据（立刻显示）
      if (window.__BOOT_DRIVES__ && Array.isArray(window.__BOOT_DRIVES__.drives)) {
        apply(window.__BOOT_DRIVES__);
      }

      // 2) 再请求接口刷新（U 盘热插拔等）
      try {
        const r = await fetch("/api/drives");
        if (!r.ok) throw new Error("HTTP " + r.status);
        const data = await r.json();
        window.__BOOT_DRIVES__ = data;
        apply(data);
        return data;
      } catch (e) {
        console.warn("加载盘符失败", e);
        if (!(window.__BOOT_DRIVES__ && window.__BOOT_DRIVES__.drives && window.__BOOT_DRIVES__.drives.length)) {
          $("driveHint").textContent = "盘符检测失败，请关闭黑窗口后重新运行 start.bat";
        }
        return window.__BOOT_DRIVES__ || { drives: [] };
      }
    }

    function updateDriveHint(keepCountText) {
      const val = $("driveSelect").value;
      const d = state.drives.find((x) => x.letter === val || x.path === val);
      if (!d) return;
      const parts = [];
      if (!keepCountText) {
        parts.push(`已检测到 ${state.drives.length} 个盘符`);
      } else {
        // 保留「已检测到 N 个」前缀，后面追加当前盘信息
        const letters = state.drives.map((x) => x.letter).join("、");
        $("driveHint").textContent =
          `已检测到 ${state.drives.length} 个盘符：${letters}` +
          (d.type ? ` · 当前 ${d.letter} ${d.type}` : "") +
          (d.total_h ? ` 共${d.total_h}` : "");
        return;
      }
      if (d.type) parts.push(d.type);
      if (d.total_h) parts.push(`共 ${d.total_h}`);
      $("driveHint").textContent = parts.join(" · ");
    }

    function selectedDrivePath() {
      const val = $("driveSelect").value;
      const d = state.drives.find((x) => x.letter === val || x.path === val);
      return d ? d.path : val;
    }

    function startPoll() {
      if (state._poll) return;
      let wasBusy = true;
      let lastThumbProgress = "";
      let lastScanProgress = "";
      let lastLibGen = state._libGen || 0;
      let lastScanFound = -1;
      let thumbRefreshTimer = 0;
      let lastFullRefresh = 0;
      let driveTick = 0;
      let pollInFlight = false;

      state._poll = setInterval(async () => {
        if (pollInFlight) return;
        pollInFlight = true;
        try {
          const r = await fetch("/api/status");
          const d = await r.json();
          const busy = !!(d.scanning || d.updating);
          const gen = d.lib_gen || 0;
          const found = d.scan_found || 0;
          const genChanged = gen !== lastLibGen;
          const foundJump = found > 0 && (lastScanFound < 0 || found - lastScanFound >= 100);
          const now = Date.now();

          const bits = [];
          if (d.scan_progress) bits.push(d.scan_progress);
          if (d.thumb_progress) bits.push(d.thumb_progress);
          if (d.meta_progress) bits.push(d.meta_progress);
          if (found > 0 && d.scanning) bits.push("本盘 " + found);
          const detail = bits.join(" · ");
          if (detail) {
            const head = state.multi
              ? ("片库扫描中" + (state.lib ? " · 当前盘" : " · 全部"))
              : (d.root ? ("当前: " + d.root) : "扫描中");
            $("status").textContent = head + " · " + detail;
            $("status").title = $("status").textContent;
          }
          $("rescanBtn").disabled = !!d.scanning;
          $("scanDriveBtn").disabled = !!d.scanning;
          $("driveSelect").disabled = !!d.scanning;

          if (busy) {
            wasBusy = true;
            const canFull = now - lastFullRefresh > 3000;
            if (canFull && (genChanged || foundJump)) {
              lastFullRefresh = now;
              lastLibGen = gen;
              lastScanFound = found;
              state._libGen = gen;
              await refresh();
            } else if (
              canFull &&
              d.scan_progress &&
              d.scan_progress !== lastScanProgress &&
              String(d.scan_progress).includes("扫描完成")
            ) {
              lastFullRefresh = now;
              await refresh();
            } else if (d.thumb_progress && d.thumb_progress !== lastThumbProgress) {
              lastThumbProgress = d.thumb_progress;
              if (now - thumbRefreshTimer > 3000) {
                thumbRefreshTimer = now;
                refreshVisibleThumbs();
              }
            }
          } else if (wasBusy) {
            wasBusy = false;
            lastLibGen = gen;
            state._libGen = gen;
            await refresh();
            refreshVisibleThumbs();
            clearInterval(state._poll);
            state._poll = null;
          }
          lastScanProgress = d.scan_progress || lastScanProgress;
          driveTick += 1;
          if (driveTick % 6 === 0) await loadDrives();
        } catch (e) {
          console.warn(e);
        } finally {
          pollInFlight = false;
        }
      }, 2000);
    }

    function refreshVisibleThumbs() {
      const imgs = document.querySelectorAll("#grid .card img");
      imgs.forEach((img) => {
        const card = img.closest(".card");
        if (!card) return;
        const id = card.dataset.cover || card.dataset.id;
        const root = card.dataset.root || "";
        if (!id) return;
        img.dataset.retried = "";
        img.src = "/thumb/" + id + "?v=" + Date.now() + (root ? ("&root=" + encodeURIComponent(root)) : "");
      });
    }

    async function scanSelectedDrive(force) {
      const path = selectedDrivePath();
      if (!path) {
        alert("请先选择盘符");
        return;
      }
      $("scanDriveBtn").disabled = true;
      $("rescanBtn").disabled = true;
      $("driveSelect").disabled = true;
      $("status").textContent = `正在扫描 ${path}，新盘会自动加入片库…`;
      const sameDrive = state.root && path && (
        String(state.root).replace(/[\\/]+$/, "").toLowerCase() ===
        String(path).replace(/[\\/]+$/, "").toLowerCase()
      );
      if (!sameDrive) {
        state.folder = "";
        state.folderAll = false;
        state.category = "";
        state.expanded = new Set([""]);
      }
      saveUiPrefs();
      try {
        const r = await fetch("/api/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path, thumbs: true, force: !!force }),
        });
        const data = await r.json();
        if (!r.ok || !data.ok) {
          alert(data.msg || "无法开始扫描");
          $("scanDriveBtn").disabled = false;
          $("rescanBtn").disabled = false;
          $("driveSelect").disabled = false;
          return;
        }
        if (data.msg) $("status").textContent = data.msg;
        await refresh();
        startPoll();
      } catch (e) {
        alert("请求失败: " + e);
        $("scanDriveBtn").disabled = false;
        $("rescanBtn").disabled = false;
        $("driveSelect").disabled = false;
      }
    }

    function sameLibPath(a, b) {
      return String(a || "").replace(/[\\/]+$/, "").toLowerCase() ===
        String(b || "").replace(/[\\/]+$/, "").toLowerCase();
    }

    function normalizeMountRoots(roots) {
      return (roots || []).map((r) => {
        if (typeof r === "string") {
          return { path: r, label: r, count: 0, categories: [] };
        }
        return {
          path: r.path || "",
          label: r.label || r.path || "",
          count: r.count || 0,
          categories: Array.isArray(r.categories) ? r.categories : [],
          current: !!r.current,
        };
      }).filter((r) => r.path);
    }

    async function renderMountChips(rootsFromApi) {
      // 多根切换已并入频道列表，这里只同步数据
      let roots = rootsFromApi;
      if (!roots) {
        try {
          const data = await fetch("/api/roots").then((r) => r.json());
          roots = data.roots || [];
        } catch (_) {
          roots = state.mountedRoots || [];
        }
      }
      state.mountedRoots = normalizeMountRoots(roots);
      state.multi = state.mountedRoots.length > 1;
      if (state.lib && !state.mountedRoots.some((r) => sameLibPath(r.path, state.lib))) {
        state.lib = "";
      }
      if (!state.multi) state.lib = "";
      if (!(state.libExpanded instanceof Set)) state.libExpanded = new Set();
      // 多盘时默认全部展开，方便看到「盘 → 频道」
      if (state.multi) {
        state.mountedRoots.forEach((r) => state.libExpanded.add(r.path));
      }
      const box = $("libNav");
      if (box) {
        box.classList.remove("show");
        box.innerHTML = "";
      }
      updateAsideTitles();
    }

    function selectLib(libPath) {
      const next = libPath || "";
      if (state.lib === next) return;
      state.lib = next;
      state.folder = "";
      state.folderAll = false;
      state.category = "";
      if (next) {
        if (!(state.libExpanded instanceof Set)) state.libExpanded = new Set();
        state.libExpanded.add(next);
      }
      state.expanded = new Set([""]);
      saveUiPrefs();
      refresh();
    }

    function renderChannels(categories, total) {
      state.categories = categories || [];
      if (!state.multi) {
        const allActive = !state.category;
        let html = `<div class="channel-item ${allActive ? "active" : ""}" data-cat="" data-lib="">
          <span class="ico">${CHANNEL_ICO.__all__}</span>
          <span class="label">全部</span>
          <span class="badge">${total || 0}</span>
        </div>`;
        for (const c of state.categories) {
          const id = c.id === "" ? "__root__" : c.id;
          const isActive = state.category === id;
          const ico = CHANNEL_ICO[c.name] || CHANNEL_ICO[c.id] || "▸";
          html += `<div class="channel-item ${isActive ? "active" : ""}" data-cat="${escapeAttr(id)}" data-lib="">
            <span class="ico">${ico}</span>
            <span class="label">${escapeHtml(c.name)}</span>
            <span class="badge">${c.count}</span>
          </div>`;
        }
        $("channelList").innerHTML = html;
        return;
      }

      // 多根：全部视频 → 各盘分组 → 该盘下的全部视频/频道
      if (!(state.libExpanded instanceof Set)) state.libExpanded = new Set();
      if (state.lib) {
        const hit = (state.mountedRoots || []).find((r) => sameLibPath(r.path, state.lib));
        if (hit) state.libExpanded.add(hit.path);
      }
      if (state.libExpanded.size === 0) {
        (state.mountedRoots || []).forEach((r) => state.libExpanded.add(r.path));
      }
      const roots = state.mountedRoots || [];
      const grand = roots.reduce((s, r) => s + (r.count || 0), 0);
      const allDisksActive = !state.lib && !state.category;
      let html = `<div class="channel-item ${allDisksActive ? "active" : ""}" data-lib="" data-cat="">
        <span class="ico">${CHANNEL_ICO.__all__}</span>
        <span class="label">全部视频</span>
        <span class="badge">${grand || total || 0}</span>
      </div>`;

      for (const root of roots) {
        const expanded = [...state.libExpanded].some((p) => sameLibPath(p, root.path));
        const diskOn = sameLibPath(state.lib, root.path);
        html += `<div class="channel-item channel-disk ${diskOn ? "disk-scoped" : ""}" data-disk-header="${escapeAttr(root.path)}" title="${escapeAttr(root.path)}">
          <span class="ch-twisty" data-expand-lib="${escapeAttr(root.path)}">${expanded ? "▼" : "▶"}</span>
          <span class="ico">▣</span>
          <span class="label">${escapeHtml(root.label || root.path)}</span>
          <span class="badge">${root.count || 0}</span>
          <span class="ch-twisty lib-nav-x" data-unmount="${escapeAttr(root.path)}" title="移出片库">×</span>
        </div>`;
        if (!expanded) continue;
        html += `<div class="channel-children">`;
        const cats = root.categories || [];
        const diskAllActive = diskOn && !state.category;
        html += `<div class="channel-item channel-nested ${diskAllActive ? "active" : ""}" data-lib="${escapeAttr(root.path)}" data-cat="">
          <span class="ico">${CHANNEL_ICO.__all__}</span>
          <span class="label">该盘全部视频</span>
          <span class="badge">${root.count || 0}</span>
        </div>`;
        for (const c of cats) {
          const id = c.id === "" ? "__root__" : c.id;
          const isActive = diskOn && state.category === id;
          const ico = CHANNEL_ICO[c.name] || CHANNEL_ICO[c.id] || "▸";
          html += `<div class="channel-item channel-nested ${isActive ? "active" : ""}" data-lib="${escapeAttr(root.path)}" data-cat="${escapeAttr(id)}">
            <span class="ico">${ico}</span>
            <span class="label">${escapeHtml(c.name)}</span>
            <span class="badge">${c.count}</span>
          </div>`;
        }
        if (!cats.length && !(root.count > 0)) {
          html += `<div class="channel-item channel-nested muted">
            <span class="ico">·</span>
            <span class="label">等待扫描结果…</span>
            <span class="badge">0</span>
          </div>`;
        }
        html += `</div>`;
      }
      $("channelList").innerHTML = html;
    }

    function renderSortTags() {
      $("sortTags").innerHTML = SORTS.map((s) =>
        `<button type="button" class="tag ${state.sort === s.id ? "active" : ""}" data-sort="${s.id}">${s.label}</button>`
      ).join("");
      const vt = $("viewTags");
      if (vt) {

    function renderExtTags(types) {

      let html = `<button type="button" class="tag ${!state.ext ? "active" : ""}" data-ext="">全部</button>`;
      for (const t of state.types) {

    function renderGenreTags(genres) {
      state.genres = genres || [];
      const row = $("genreRow");
      if (!state.genres.length) {
        row.style.display = "none";
        $("genreTags").innerHTML = "";

    function renderSubTags(levels) {
      const box = $("subFolderRows");
      const rows = levels || [];
      if (!state.category || state.category === "__root__" || !rows.length) {
        box.innerHTML = "";
        renderStickyFilterRow();
        return;
      }
      box.innerHTML = rows.map((lv, idx) => {
        const selected = lv.selected || "";
        const allId = lv.all_id || "";
        // 频道行「全部」：未选子类时高亮
        // 更深行「全部」：folderAll 时高亮（默认选中子类后勾选，显示全部视频）
        const allActive = !selected && (!allId || state.folderAll);
        // 用 data-folder 避免空值/dataset 歧义；data-level 标识层级；data-all 标识「全部」
        let tags = `<button type="button" class="tag ${allActive ? "active" : ""}" data-folder="${escapeAttr(allId)}" data-all="1" data-level="${idx}">全部</button>`;
        for (const c of lv.items || []) {
          const active = selected === c.id;
          tags += `<button type="button" class="tag ${active ? "active" : ""}" data-folder="${escapeAttr(c.id)}" data-level="${idx}">${escapeHtml(c.name)}<span class="tag-n">${c.count}</span></button>`;
        }
        return `<div class="filter-row" data-sub-level="${idx}">
          <div class="filter-label">${escapeHtml(lv.label || "子类")}</div>
          <div class="filter-tags">${tags}</div>
        </div>`;
      }).join("");
      renderStickyFilterRow();
    }

    function renderStickyFilterRow() {
      const box = $("stickyFilterRow");
      const sticky = $("scopeSticky");
      if (!box) return;
      const subRows = $("subFolderRows") ? $("subFolderRows").querySelectorAll(".filter-row") : [];
      let src = subRows.length ? subRows[subRows.length - 1] : null;
      if (!src) {
        const extRow = $("extTags") && $("extTags").closest(".filter-row");
        src = extRow || null;
      }
      if (!src) {
        box.innerHTML = "";
        if (sticky) sticky.classList.remove("has-filter-row");
        return;
      }
      box.innerHTML = src.innerHTML;
      if (sticky) sticky.classList.add("has-filter-row");
    }

    function applyFolderButton(btn) {
      let folder = btn.getAttribute("data-folder");
      if (folder == null) return;
      folder = String(folder).replace(/\\/g, "/").replace(/^\/+|\/+$/g, "");
      if (folder && folder === state.category) folder = "";
      const isAll = btn.getAttribute("data-all") === "1";
      const prevFolder = String(state.folder || "").replace(/\\/g, "/").replace(/^\/+|\/+$/g, "");
      const prevAll = !!state.folderAll;
      const parentOf = (path) => {
        const parts = String(path || "").split("/").filter(Boolean);
        parts.pop();
        let parent = parts.join("/");
        if (parent && parent === state.category) parent = "";
        return parent;
      };
      if (isAll && folder) {
        if (prevFolder === folder) {
          state.folderAll = !prevAll;
        } else {
          state.folder = folder;
          state.folderAll = true;
        }
      } else if (!isAll && folder) {
        const selected = prevFolder === folder || prevFolder.startsWith(folder + "/");
        if (selected) {
          state.folder = parentOf(folder);
          state.folderAll = false;
        } else {
          state.folder = folder;
          state.folderAll = true;
        }
      } else {
        state.folder = "";
        state.folderAll = false;
      }
      saveUiPrefs();
      refresh();
    }

    function treeNodeKey(node) {
      const lib = node && node.lib ? String(node.lib) : "";
      const path = (node && node.path) || "";
      return lib ? `${lib}::${path}` : path;
    }

    function renderTree(node, depth = 0) {
      if (!node) return "";
      // 多根：盘节点（有 lib、无 path）或其子文件夹
      const hasChildren = node.children && node.children.length > 0;
      const path = node.path || "";
      const lib = node.lib || "";
      const key = treeNodeKey(node);
      // 激活：点到该盘（无文件夹）或点到该盘下某文件夹
      let isActive = false;
      if (lib) {
        if (!path) isActive = sameLibPath(state.lib, lib) && !state.folder;
        else isActive = sameLibPath(state.lib, lib) && state.folder === path;
      } else {
        isActive = state.folder === path;
      }
      const expanded = state.expanded.has(key) || state.expanded.has(path) || depth === 0
        || (lib && sameLibPath(state.lib, lib) && !path);

      let html = `<div class="tree-item ${isActive ? "active" : ""} ${lib && !path ? "tree-disk" : ""}"
        data-path="${escapeAttr(path)}"
        data-lib="${escapeAttr(lib)}"
        data-tree-key="${escapeAttr(key)}"
        style="padding-left:${10 + depth * 12}px"
        title="${escapeAttr(lib || path || "")}">
        <span class="twisty" data-toggle-key="${escapeAttr(key)}">${hasChildren ? (expanded ? "▼" : "▶") : "·"}</span>
        <span class="label">${escapeHtml(node.name)}</span>
        <span class="badge">${node.count || 0}</span>
      </div>`;

      if (hasChildren && expanded) {
        html += `<div class="tree-children">`;
        for (const c of node.children) html += renderTree(c, depth + 1);
        html += `</div>`;
      }
      return html;
    }

    function renderCrumb() {
      let html = "";
      if (state.multi) {
        if (state.lib) {
          const lab = ((state.mountedRoots || []).find((r) => sameLibPath(r.path, state.lib)) || {}).label || state.lib;
          html = `<span class="lib-badge">${escapeHtml(lab)}</span>`;
        } else {
          html = `<span>全部目录</span>`;
        }
        html += `<span class="sep">·</span>`;
      }
      if (state.category === "__root__") html += `<span>未分类</span>`;
      else if (state.category) html += `<span>${escapeHtml(state.category)}</span>`;
      else html += `<span>全部</span>`;
      if (state.folder) {
        const folder = String(state.folder).replace(/\\/g, "/");
        const rest = state.category && folder.startsWith(state.category + "/")
          ? folder.slice(state.category.length + 1)
          : folder;
        for (const seg of rest.split("/").filter(Boolean)) {
          html += `<span class="sep">/</span><span>${escapeHtml(seg)}</span>`;
        }
        if (!state.folderAll) html += `<span class="sep">·</span><span>仅根目录</span>`;
      }
      if (state.ext) html += `<span class="sep">·</span><span>${escapeHtml(state.ext)}</span>`;
      if (state.genre) html += `<span class="sep">·</span><span>${escapeHtml(state.genre)}</span>`;
      if (state.query) html += `<span class="sep">·</span><span>“${escapeHtml(state.query)}”</span>`;
      if (state.totalCount != null) {
        if (state.view === "series" && state.rawCount != null && state.rawCount !== state.totalCount) {
          html += `<span class="sep">·</span><span class="count">合集 ${state.totalCount} · 共 ${state.rawCount} 部</span>`;
        } else {
          html += `<span class="sep">·</span><span class="count">当前 ${state.rawCount != null ? state.rawCount : state.totalCount}</span>`;
        }
      }
      $("crumb").innerHTML = html;
    }

    function setupScopeSticky() {
      const root = $("contentScroll");
      const filters = $("filters");
      const sticky = $("scopeSticky");
      const btn = $("scopeFilterBtn");
      if (!root || !filters || !sticky || !btn) return;
      if (sticky.dataset.bound === "1") return;
      sticky.dataset.bound = "1";
      if ("IntersectionObserver" in window) {
        const io = new IntersectionObserver(
          (entries) => {
            const visible = entries.some((e) => e.isIntersecting);
            sticky.classList.toggle("is-stuck", !visible);
          },
          { root, threshold: 0 }
        );
        io.observe(filters);
      }
      btn.addEventListener("click", () => {
        filters.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    function cardHtml(v) {
      const year = v.mtime_h ? String(v.mtime_h).slice(0, 4) : "";
      const isSeries = v.kind === "series";
      const thumbId = v.thumb_id || (isSeries ? (v.cover_id || v.id) : v.id);
      const thumbRootQ = v.root ? `&root=${encodeURIComponent(v.root)}` : "";
      const tv = v.thumb_v || (v.has_thumb ? 1 : 0);
      const dup = !!v.dup;
      const dupN = v.dup_n || 0;
      const dupReason = v.dup_reason || "重复";
      const bad = !!v.bad;
      const badReason = v.bad_reason || "无法读取";
      const watched = !isSeries && getPlayProgress(v.id) > 5;
      const epMark = isSeries
        ? `<span class="dur">${v.ep_count || 0} 集</span>`
        : (v.seg_count ? `<span class="dur">${v.seg_count} 段</span>` : (v.kind === "m3u8" || (v.ext || "").toLowerCase() === ".m3u8" ? `<span class="dur">HLS</span>` : (v.duration_h ? `<span class="dur">${escapeHtml(v.duration_h)}</span>` : `<span class="dur">${escapeHtml((v.ext || "").toUpperCase())}</span>`)));
      return `
        <div class="card" data-id="${v.id}" data-root="${escapeAttr(v.root || "")}" data-ext="${escapeAttr(v.ext || "")}" data-kind="${escapeAttr(v.kind || "")}" data-cover="${escapeAttr(thumbId || "")}">
          <div class="thumb">
            <img src="/thumb/${thumbId}?v=${tv}${thumbRootQ}" alt="" loading="lazy" decoding="async"
              onerror="if(!this.dataset.retried){this.dataset.retried=1;this.src='/thumb/${thumbId}?v='+Date.now()+'${thumbRootQ}'}" />
            <div class="play"><div class="play-icon"></div></div>
            ${dup ? `<span class="dup-badge" title="${escapeAttr(dupReason)}">重复×${dupN}</span>` : ""}
            ${bad ? `<span class="bad-badge" title="${escapeAttr(badReason)}">损坏</span>` : ""}
            ${year ? `<span class="dur" style="left:8px;right:auto">${escapeHtml(year)}</span>` : ""}
            ${epMark}
          </div>
          <div class="card-body">
            <div class="card-title" title="${escapeAttr(v.name)}">${escapeHtml(v.name)}${watched ? " · 续播" : ""}${isSeries ? " · 剧集" : ""}</div>
            <div class="card-meta">
              ${(!state.lib && v.lib_label) ? `<span class="lib-badge" title="${escapeAttr(v.root || "")}">${escapeHtml(v.lib_label)}</span>` : ""}
              <span>${escapeHtml(v.size_h || "")}</span>
              <span>${escapeHtml(v.folder || "根目录")}</span>
              ${isSeries ? `<span>${v.ep_count || 0} 集</span>` : ""}
              ${v.seg_count ? `<span>TS 合集</span>` : ""}
              ${(v.kind === "m3u8" || (v.ext || "").toLowerCase() === ".m3u8") ? `<span>m3u8</span>` : ""}
              ${dup ? `<span title="${escapeAttr(dupReason)}">疑似重复</span>` : ""}
              ${bad ? `<span title="${escapeAttr(badReason)}">疑似损坏</span>` : ""}
              ${v.duration_h ? `<span>${escapeHtml(v.duration_h)}</span>` : ""}
              ${(v.genres && v.genres.length) ? `<span>${escapeHtml(v.genres.slice(0, 2).join("·"))}</span>` : ""}
            </div>
          </div>
        </div>`;
    }

    function getVirtualCols() {
      const grid = $("grid");
      const w = (grid && grid.clientWidth) || 800;
      const min = window.matchMedia("(max-width: 900px)").matches ? 160 : 220;
      return Math.max(1, Math.floor((w + VIRTUAL_GAP) / (min + VIRTUAL_GAP)));
    }

    function updateGridHint() {
      const wrap = $("loadMoreWrap");
      const hint = $("loadMoreHint");
      const grid = $("grid");
      const shown = state.virtualEnabled
        ? state.loadedVideos.length
        : (grid ? grid.querySelectorAll(".card").length : 0);
      if (!wrap || !hint) return;
      if (state.hasMore) {
        wrap.style.display = "block";
        hint.textContent = `已加载 ${shown}/${state.totalCount}，继续下滑加载…`;
      } else if (shown > 0) {
        wrap.style.display = "block";
        hint.textContent = shown >= state.totalCount
          ? `共 ${state.totalCount} 个`
          : `已显示 ${shown} 个`;
      } else {
        wrap.style.display = "none";
      }
    }

    function renderVirtualGrid() {
      const grid = $("grid");
      const root = $("contentScroll");
      if (!grid || !root) return;
      const cols = getVirtualCols();
      const total = state.loadedVideos.length;
      const totalRows = Math.ceil(total / cols) || 1;
      const rowStride = VIRTUAL_ROW_H + VIRTUAL_GAP;
      const scrollTop = root.scrollTop;
      const viewH = root.clientHeight;
      const firstRow = Math.max(0, Math.floor(scrollTop / rowStride) - 3);
      const lastRow = Math.min(totalRows - 1, Math.ceil((scrollTop + viewH) / rowStride) + 3);
      const start = firstRow * cols;
      const end = Math.min(total, (lastRow + 1) * cols);
      const padTop = firstRow * rowStride;
      const padBot = Math.max(0, (totalRows - lastRow - 1) * rowStride);
      grid.innerHTML =
        `<div class="v-spacer" style="grid-column:1/-1;height:${padTop}px" aria-hidden="true"></div>` +
        state.loadedVideos.slice(start, end).map(cardHtml).join("") +
        `<div class="v-spacer" style="grid-column:1/-1;height:${padBot}px" aria-hidden="true"></div>`;
      updateGridHint();
      if (state.hasMore && end >= total - cols * 2 && !loadingMore) loadMore();
    }

    let virtualScrollBound = false;
    function bindVirtualScroll() {
      if (virtualScrollBound) return;
      const root = $("contentScroll");
      if (!root) return;
      virtualScrollBound = true;
      let raf = 0;
      root.addEventListener("scroll", () => {
        if (!state.virtualEnabled) return;
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => { raf = 0; renderVirtualGrid(); });
      }, { passive: true });
      window.addEventListener("resize", () => {
        if (state.virtualEnabled) renderVirtualGrid();
      });
    }

    function renderGrid(videos, scanning, append) {
      const grid = $("grid");
      const empty = $("empty");
      const wrap = $("loadMoreWrap");
      if (!append) {
        state.loadedVideos = (videos || []).slice();
      } else if (videos && videos.length) {
        state.loadedVideos = state.loadedVideos.concat(videos);
      }
      state.virtualEnabled = state.totalCount >= VIRTUAL_MIN;
      bindVirtualScroll();

      if (!state.loadedVideos.length && !append) {
        grid.innerHTML = "";
        empty.style.display = "block";
        empty.textContent = scanning
          ? "正在扫描硬盘，请稍候…（页面会自动刷新）"
          : "没有找到视频";
        if (wrap) wrap.style.display = "none";
        return;
      }
      empty.style.display = "none";

      if (state.virtualEnabled) {
        renderVirtualGrid();
        if (!state.hasMore) ensureScrollObserver();
        return;
      }

      if (!append) grid.innerHTML = "";
      if (videos && videos.length) {
        grid.insertAdjacentHTML("beforeend", videos.map(cardHtml).join(""));
      }
      updateGridHint();
      ensureScrollObserver();
    }

    let lastScanning = false;
    let loadingMore = false;
    let scrollObserver = null;

    function ensureScrollObserver() {
      const root = $("contentScroll") || document.querySelector("section.content");
      const sentinel = $("scrollSentinel");
      if (!root || !sentinel) return;
      if (scrollObserver) scrollObserver.disconnect();
      scrollObserver = new IntersectionObserver(
        (entries) => {
          if (entries.some((e) => e.isIntersecting)) loadMore();
        },
        { root, rootMargin: "160px", threshold: 0 }
      );
      scrollObserver.observe(sentinel);
    }

    async function refresh() {
      state.offset = 0;
      loadingMore = false;
      const treeData = await fetchTree();
      lastScanning = !!treeData.scanning;
      state.tree = treeData.tree;
      state.root = treeData.root || state.root;
      await renderMountChips(treeData.roots || []);
      if (treeData.multi || (treeData.roots || []).length > 1) state.multi = true;
      updateAsideTitles();
      renderChannels(treeData.categories || [], treeData.count || 0);
      renderSortTags();
      renderExtTags(treeData.types || []);
      if ($("tree")) $("tree").innerHTML = treeData.tree ? renderTree(treeData.tree) : "";
      if (state.folder && state.folder === state.category) {
        state.folder = "";
        state.folderAll = false;
      }
      if (
        state.folder &&
        state.category &&
        state.category !== "__root__" &&
        state.folder !== state.category &&
        !state.folder.startsWith(state.category + "/")
      ) {
        state.folder = state.category + "/" + state.folder;
      }
      let data = await fetchVideos(0);
      const genreBefore = state.genre;
      renderGenreTags(data.genres || []);
      if (genreBefore && !state.genre) {
        data = await fetchVideos(0);
        renderGenreTags(data.genres || []);
      }
      state.totalCount = data.count || 0;
      state.rawCount = (data.raw_count != null ? data.raw_count : data.count) || 0;
      state.hasMore = !!data.has_more;
      state.offset = (data.videos || []).length;
      // 记忆的频道/子类若在当前盘无效，导致空列表时自动清空
      // 注意：取消「全部」后根目录可能无片，或落在叶子目录，路径仍可能有效
      const levels = data.subfolder_levels || [];
      const folderAlive = !!(state.folder && levels.some((lv) =>
        lv.all_id === state.folder ||
        lv.prefix === state.folder ||
        (lv.items || []).some((it) => it.id === state.folder)
      ));
      if (
        state.totalCount === 0 &&
        !folderAlive &&
        (state.category || state.folder || state.ext || state.genre) &&
        (treeData.count || 0) > 0
      ) {
        state.category = "";
        state.folder = "";
        state.folderAll = false;
        state.ext = "";
        state.genre = "";
        saveUiPrefs();
        data = await fetchVideos(0);
        state.totalCount = data.count || 0;
        state.rawCount = (data.raw_count != null ? data.raw_count : data.count) || 0;
        state.hasMore = !!data.has_more;
        state.offset = (data.videos || []).length;
        renderGenreTags(data.genres || []);
      }
      // 选中某盘但内容为空，而侧栏该盘有数量：清残留筛选后再取一次
      if (state.totalCount === 0 && state.lib) {
        const mount = (state.mountedRoots || []).find((r) => sameLibPath(r.path, state.lib));
        if (mount && (mount.count || 0) > 0 && (state.ext || state.genre || state.category || state.folder)) {
          state.category = "";
          state.folder = "";
          state.folderAll = false;
          state.ext = "";
          state.genre = "";
          saveUiPrefs();
          data = await fetchVideos(0);
          state.totalCount = data.count || 0;
          state.rawCount = (data.raw_count != null ? data.raw_count : data.count) || 0;
          state.hasMore = !!data.has_more;
          state.offset = (data.videos || []).length;
          renderGenreTags(data.genres || []);
        }
      }
      renderSubTags(data.subfolder_levels || []);
      renderCrumb();
      renderGrid(data.videos || [], lastScanning, false);
      const libTip = state.lib
        ? ((state.mountedRoots.find((r) => sameLibPath(r.path, state.lib)) || {}).label || state.lib)
        : (state.multi ? "全部目录" : "");
      const showN = (data.raw_count != null ? data.raw_count : data.count) || 0;
      $("countLabel").textContent = lastScanning
        ? `扫描中… ${showN} 个`
        : (libTip ? `${libTip} · ${showN} 个` : `${showN} 个视频`);
    }

    async function loadMore() {
      if (!state.hasMore || loadingMore) return;
      loadingMore = true;
      const hint = $("loadMoreHint");
      if (hint) hint.textContent = "加载中…";
      try {
        const data = await fetchVideos(state.offset);
        const batch = data.videos || [];
        state.hasMore = !!data.has_more;
        state.offset += batch.length;
        if (!batch.length) state.hasMore = false;
        renderGrid(batch, false, true);
      } catch (e) {
        console.warn(e);
        if (hint) hint.textContent = "加载失败，请继续下滑重试";
        state.hasMore = true;
      } finally {
        loadingMore = false;
      }
    }

    async function refreshTree() {
      const data = await fetchTree();
      state.tree = data.tree;
      state.root = data.root || state.root;
      await renderMountChips(data.roots || []);
      if (data.multi || (data.roots || []).length > 1) state.multi = true;
      updateAsideTitles();
      renderChannels(data.categories || [], data.count || 0);
      renderSortTags();
      renderExtTags(data.types || []);
      if ($("tree")) $("tree").innerHTML = data.tree ? renderTree(data.tree) : "";
      let status = "";
      if (state.multi) {
        const names = (data.roots || []).map((r) => r.label).join(" + ");
        status += `片库: ${names || "多目录"}`;
        if (state.lib) {
          const cur = (data.roots || []).find((r) => sameLibPath(r.path, state.lib));
          status += ` · ${cur ? cur.label : state.lib}`;
        } else {
          status += " · 全部";
        }
      } else if (data.root) {
        status += `当前: ${data.root}`;
      }
      // 状态栏只保留短摘要，完整信息放 title 悬停查看，避免顶栏撑爆盖住「继续看」
      const bits = [];
      if (data.scan_progress) bits.push(data.scan_progress);
      if (data.thumb_progress) bits.push(data.thumb_progress);
      if (data.meta_progress) bits.push(data.meta_progress);
      if (data.exporting && data.export_msg) bits.push(data.export_msg);
      else if (data.export_ok === true && data.export_path) bits.push("静态站已导出");
      if (!data.has_ffmpeg) bits.push("无 ffmpeg");
      let lanShort = "";
      if (data.lan_share && data.lan_urls && data.lan_urls.length) {
        const share = data.lan_urls.filter((u) => !u.includes("127.0.0.1")).slice(0, 2);
        bits.push("局域网 " + share.join(" · "));
        if ($("lanBtn")) $("lanBtn").classList.add("primary");
      } else if ($("lanBtn")) {
        $("lanBtn").classList.remove("primary");
      }
      const detail = bits.join(" · ");
      if (detail) status += (status ? " · " : "") + detail;
      state.hasFfmpeg = !!data.has_ffmpeg;
      state.lanShare = !!data.lan_share;
      const statusEl = $("status");
      statusEl.textContent = status;
      statusEl.title = status;
      $("rescanBtn").disabled = data.scanning;
      $("scanDriveBtn").disabled = data.scanning;
      $("driveSelect").disabled = data.scanning;
      if ($("exportStaticBtn")) {
        $("exportStaticBtn").disabled = !!(data.scanning || data.exporting || !data.root || !(data.count > 0));
        $("exportStaticBtn").textContent = data.exporting ? "正在导出…" : "导出静态站";
      }
      return data;
    }

    function updateAsideTitles() {
      const ch = $("channelAsideTitle");
      const fo = $("folderAsideTitle");
      if (ch) ch.textContent = state.multi ? "频道（按盘）" : "频道";
      if (fo) fo.textContent = state.multi ? "文件夹（按盘）" : "文件夹";
    }

    const HARD_EXTS = new Set([".mkv", ".avi", ".wmv", ".flv", ".rmvb", ".rm", ".ts", ".m2ts", ".mpg", ".mpeg"]);
    let hlsPlayer = null;
    let segPlay = null;
    let currentPlayId = "";
    let currentPlayMeta = { name: "", folder: "" };
    let currentPlayKind = "";
    let convertPollTimer = 0;
    let currentConvertJobId = "";
    let playProgressTimer = 0;

    function destroyHls() {
      if (hlsPlayer) {
        try { hlsPlayer.destroy(); } catch (_) {}
        hlsPlayer = null;
      }
      segPlay = null;
    }

    function playTsSetSequential(id, total, startIndex, root) {
      const video = $("player");
      segPlay = { id, index: startIndex || 0, total };
      const go = (i) => {
        if (!segPlay || segPlay.id !== id) return;
        segPlay.index = i;
        $("modalInfo").textContent =
          `TS 分片 ${i + 1}/${total}（浏览器原生接力播放）· 也可点「系统播放器」`;
        const rootQ = root ? `?root=${encodeURIComponent(root)}` : "";
        video.src = `/stream/${id}/seg/${i}${rootQ}`;
        video.play().catch(() => {});
      };
      video.onended = () => {
        if (!segPlay || segPlay.id !== id) return;
        if (segPlay.index + 1 < total) go(segPlay.index + 1);
      };
      go(segPlay.index);
    }

    function playHls(url, fallback) {
      const video = $("player");
      if (window.Hls && Hls.isSupported()) {
        hlsPlayer = new Hls({ enableWorker: true });
        hlsPlayer.loadSource(url);
        hlsPlayer.attachMedia(video);
        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });
        hlsPlayer.on(Hls.Events.ERROR, (_, data) => {
          if (data && data.fatal) {
            destroyHls();
            if (typeof fallback === "function") fallback();
            else {
              $("modalInfo").textContent =
                "HLS 播放失败。请用「系统播放器」打开，或检查分片是否完整。";
            }
          }
        });
        return;
      }
      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url;
        video.play().catch(() => {});
        return;
      }
      if (typeof fallback === "function") fallback();
    }

          method: "POST",

    async function pollConvertJob(jobId, doneLabel) {
      stopConvertPoll();
      currentConvertJobId = jobId;
      setConvertUi(true);
      const tick = async () => {
        try {
          const r = await fetch("/api/convert-mp4/job/" + encodeURIComponent(jobId));
          const data = await r.json();
          if (!r.ok || !data.ok) {
            stopConvertPoll();
            currentConvertJobId = "";
            setConvertUi(false);
            $("modalInfo").textContent = (data && data.msg) || "查询进度失败";
            return;
          }
          const st = data.status || "";
          const pct = data.percent != null ? data.percent : 0;
          const msg = data.msg || "";
          if (st === "done") {
            stopConvertPoll();
            currentConvertJobId = "";
            setConvertUi(false);
            $("modalInfo").textContent = msg || (doneLabel || "完成，已加入片库");
            try { await refresh(); } catch (_) {}
            return;
          }
          if (st === "error" || st === "cancelled") {
            stopConvertPoll();
            currentConvertJobId = "";
            setConvertUi(false);
            $("modalInfo").textContent = st === "cancelled" ? "已取消" : ("失败：" + (msg || "未知错误"));
            return;
          }
          $("modalInfo").textContent = msg || (`处理中… ${pct}%`);
          const btn = $("btnToMp4");
          if (btn && btn.style.display !== "none") btn.textContent = pct ? `转换中 ${pct}%` : "转换中…";
          const fixBtn = $("btnFixAudio");
          if (fixBtn && fixBtn.style.display !== "none") fixBtn.textContent = pct ? `修复中 ${pct}%` : "修复中…";
        } catch (e) {
          stopConvertPoll();
          currentConvertJobId = "";
          setConvertUi(false);
          $("modalInfo").textContent = "查询进度失败: " + e;
        }
      };
      await tick();
      convertPollTimer = setInterval(tick, 1200);
    }

    function bindPlayProgress(video) {
      if (playProgressTimer) {
        clearInterval(playProgressTimer);
        playProgressTimer = 0;
      }
      playProgressTimer = setInterval(() => {
        if (!currentPlayId || !video || video.paused) return;
        savePlayProgress(currentPlayId, video.currentTime || 0, video.duration || 0, currentPlayMeta);
      }, 4000);
    }

    function formatResumeTime(sec) {
      const s = Math.floor(sec || 0);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      if (h) return `${h}:${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
      return `${m}:${String(r).padStart(2, "0")}`;
    }

    function resumePlayback(video, id) {
      const t = getPlayProgress(id);
      if (!(t > 5)) return;
      const seek = () => {
        try {
          if (video.duration && t < video.duration - 2) {
            video.currentTime = t;
            const base = $("modalInfo").textContent || "";
            if (!base.includes("续播")) {
              $("modalInfo").textContent = base + `\n已从 ${formatResumeTime(t)} 续播`;
            }
          }
        } catch (_) {}
      };
      if (video.readyState >= 1) seek();
      else video.addEventListener("loadedmetadata", seek, { once: true });
    }

    function openPlayer(id, name, meta, ext, kind, segCount, extra) {
      destroyHls();
      stopConvertPoll();
      currentConvertJobId = "";
      currentPlayId = id;
      currentPlayMeta = {
        name: name || "",
        folder: (extra && extra.folder) || "",
        root: (extra && extra.root) || state.root || "",
        rel: (extra && extra.rel) || "",
      };
      currentPlayKind = kind || "";
      state.lastPlayId = id;
      saveUiPrefs();
      if ($("coverPanel")) $("coverPanel").style.display = "none";
      $("modalTitle").textContent = name;
      const hard = !!(extra && extra.browser_hard);
      const audioHard = !!(extra && extra.audio_hard);
      const audioCodec = (extra && extra.audio_codec) || "";
      const path = (extra && extra.path) || "";
      let tip = meta || "";
      if (kind === "m3u8") {
        tip = "HLS 播放列表" + (tip ? " · " + tip : "");
      } else if (kind === "ts_set" && segCount) {
        tip = `${segCount} 个 TS 分片合集` + (tip ? " · " + tip : "");
      } else if (hard || (ext && HARD_EXTS.has(String(ext).toLowerCase()))) {
        tip += (tip ? " · " : "") + "此格式浏览器可能无法播放，建议用「系统播放器」";
      }
      if (audioHard) {
        tip += (tip ? "\n" : "") +
          `浏览器可能听不到声音（音频为 ${audioCodec || "不兼容格式"}）。可点「修复声音」生成 AAC 版，或用「系统播放器」`;
      }
      if (path) tip += (tip ? " · " : "") + path;
      $("modalInfo").textContent = tip;
      updateToMp4Button(kind, ext);
      updateFixAudioButton(extra);
      const video = $("player");
      video.onended = null;
      video.onerror = () => {
        $("modalInfo").textContent =
          "浏览器播放失败。请点「系统播放器」用本地播放器打开" + (path ? "：\n" + path : "");
      };
      $("modal").classList.add("open");
      bindPlayProgress(video);

      if (kind === "m3u8") {
        const rootQ = currentPlayMeta.root ? `?root=${encodeURIComponent(currentPlayMeta.root)}` : "";
        playHls(`/playlist/${id}.m3u8${rootQ}`);
        resumePlayback(video, id);
        return;
      }
      if (kind === "ts_set") {
        const rootQ = currentPlayMeta.root ? `?root=${encodeURIComponent(currentPlayMeta.root)}` : "";
        playHls(`/playlist/${id}.m3u8${rootQ}`, () => playTsSetSequential(id, segCount || 1, 0, currentPlayMeta.root));
        resumePlayback(video, id);
        return;
      }

      const rootQ = currentPlayMeta.root ? `?root=${encodeURIComponent(currentPlayMeta.root)}` : "";
      video.src = "/stream/" + id + rootQ;
      resumePlayback(video, id);
      video.play().catch(() => {});
    }

    function launchClientPlayerScheme(schemeUrl) {
      const a = document.createElement("a");
      a.href = schemeUrl;
      a.rel = "noopener";
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function preferredLanPlayer() {
      try {
        return localStorage.getItem("vg_lan_player") || "potplayer";
      } catch (_) {
        return "potplayer";
      }
    }

    function setPreferredLanPlayer(name) {
      try { localStorage.setItem("vg_lan_player", name); } catch (_) {}
    }

    function openRemoteWithClientPlayer(playUrl) {
      const pref = preferredLanPlayer();
      const scheme = pref === "vlc" ? "vlc://" : "potplayer://";
      launchClientPlayerScheme(scheme + playUrl);
      const escapeAttr = (s) => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
      const urlAttr = escapeAttr(playUrl);
      $("modalInfo").innerHTML =
        "已请求打开本机播放器（" + (pref === "vlc" ? "VLC" : "PotPlayer") + "）。浏览器可能会询问是否允许。<br>" +
        "若没反应，可切换： " +
        '<button type="button" class="btn" data-lan-player="potplayer" data-play-url="' + urlAttr + '">PotPlayer</button> ' +
        '<button type="button" class="btn" data-lan-player="vlc" data-play-url="' + urlAttr + '">VLC</button> ' +
        '<button type="button" class="btn" data-copy-play-url="' + urlAttr + '">复制地址</button><br>' +
        "<code style='word-break:break-all'>" + escapeHtml(playUrl) + "</code>";
    }

    async function localAction(action) {
      if (!currentPlayId) return;
      try {
        const r = await fetch("/api/local/" + currentPlayId, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, root: (currentPlayMeta && currentPlayMeta.root) || "" }),
        });
        const data = await r.json();
        if (!r.ok || !data.ok) {
          alert(data.msg || "操作失败");
          return;
        }
        if (data.remote && action === "open" && data.url) {
          openRemoteWithClientPlayer(data.url);
          return;
        }
        if (action === "path" && data.path) {
          try {
            await navigator.clipboard.writeText(data.path);
            $("modalInfo").textContent = (data.remote ? "已复制播放地址：\n" : "已复制路径：\n") + data.path;
          } catch {
            prompt(data.remote ? "复制播放地址：" : "复制路径：", data.path);
          }
        } else if (data.msg) {
          $("modalInfo").textContent = data.msg + (data.path ? "\n" + data.path : "");
        }
      } catch (e) {
        alert("请求失败: " + e);
      }
    }
