<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>本地视频库</title>
  <style>
    :root {
      --bg: #0e1116;
      --bg2: #151a22;
      --bg3: #1c2330;
      --border: #2a3344;
      --text: #e8edf5;
      --muted: #8b97ab;
      --accent: #00c8d4;
      --accent-dim: #009aa3;
      --tag: #2a2f3a;
      --tag-hover: #353b48;
      --hover: #243044;
      --danger: #e85d5d;
      --radius: 10px;
      --sidebar-w: 280px;
      --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }

    /* top bar */
    header {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 8px;
      padding: 10px 14px;
      background: linear-gradient(180deg, #141920 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 20;
      overflow-x: auto;
      overflow-y: hidden;
    }
    header .btn {
      padding: 7px 11px;
      font-size: 0.82rem;
      flex-shrink: 0;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      background: rgba(255,255,255,0.025);
      flex-shrink: 0;
    }
    .header-actions .btn {
      border-color: transparent;
      background: transparent;
    }
    .header-actions .btn:hover {
      background: var(--hover);
      border-color: var(--border);
    }
    .header-actions a.btn {
      text-decoration: none;
      color: inherit;
      display: inline-flex;
      align-items: center;
    }
    .brand {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand span { color: var(--accent); }
    .search-wrap {
      flex: 1 1 160px;
      width: auto;
      min-width: 120px;
      max-width: 280px;
      position: relative;
      transition: max-width 0.22s ease;
    }
    .search-wrap:focus-within {
      flex: 1 1 320px;
      max-width: min(420px, 36vw);
    }
    .search-wrap input {
      width: 100%;
      padding: 9px 14px 9px 36px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.22s ease, background 0.15s ease;
    }
    .search-wrap input:focus {
      border-color: var(--accent);
      background: #18202b;
      box-shadow: 0 0 0 3px rgba(0, 200, 212, 0.12);
    }
    .search-wrap::before {
      content: "⌕";
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 1rem;
    }
    .meta {
      color: var(--muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .btn:hover { background: var(--hover); border-color: var(--accent-dim); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); }

    .drive-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 1;
      min-width: 0;
    }
    .drive-bar label {
      color: var(--muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .drive-bar select {
      min-width: 140px;
      max-width: 220px;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    .drive-bar select:focus { border-color: var(--accent); }
    .drive-hint {
      font-size: 0.75rem;
      color: var(--muted);
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lib-nav {
      display: none;
      flex-direction: column;
      gap: 2px;
      padding: 8px 10px 10px;
      border-bottom: 1px solid var(--border);
    }
    .lib-nav.show { display: flex; }
    .lib-nav-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 0 6px 4px;
    }
    .lib-nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      width: 100%;
      font-size: 0.85rem;
    }
    .lib-nav-item:hover { background: var(--hover); }
    .lib-nav-item.active {
      background: rgba(56, 132, 255, 0.16);
      border-color: var(--accent-dim);
    }
    .lib-nav-item .lib-nav-text {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lib-nav-item .badge {
      margin-left: auto;
      opacity: 0.75;
      font-size: 0.75rem;
    }
    .lib-nav-item .lib-nav-x {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
    }
    .lib-nav-item .lib-nav-x:hover { color: var(--danger); }
    .lib-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(56, 132, 255, 0.2);
      color: #9ec1ff;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .card-meta .lib-badge { margin-right: 4px; }
    .cover-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 8px 14px 12px;
      border-top: 1px solid var(--border);
      background: var(--bg2);
      font-size: 0.85rem;
    }
    .cover-panel label { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
    .cover-panel input[type="number"] {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 6px;
    }
    .drive-count {
      display: inline-block;
      min-width: 1.2em;
      padding: 0 6px;
      margin-left: 2px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      line-height: 1.4;
      vertical-align: middle;
    }

    /* layout */
    .main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* sidebar */
    aside {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.2s, margin 0.2s, opacity 0.2s;
      position: relative;
      z-index: 40;
    }
    aside.collapsed {
      width: 0;
      border-right: none;
      opacity: 0;
      pointer-events: none;
    }
    .aside-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 12px 6px 16px;
      gap: 8px;
    }
    .aside-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0;
    }
    .aside-hide {
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .aside-hide:hover { color: var(--text); border-color: var(--accent-dim); }
    .sidebar-show {
      display: none;
      position: absolute;
      left: 10px;
      top: 70px;
      z-index: 25;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
    body.sidebar-hidden .sidebar-show { display: block; }
    body.sidebar-hidden aside { width: 0; border: none; opacity: 0; pointer-events: none; }

    .type-list {
      display: none;
    }
    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px 16px;
    }
    .channel-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      user-select: none;
      margin-bottom: 2px;
    }
    .channel-item:hover { background: var(--hover); }
    .channel-item.active {
      background: rgba(0, 200, 212, 0.12);
      color: var(--accent);
      font-weight: 600;
    }
    .channel-item .ico {
      width: 22px;
      text-align: center;
      opacity: 0.85;
      flex-shrink: 0;
    }
    .channel-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .channel-item .badge {
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--bg3);
      padding: 1px 7px;
      border-radius: 999px;
    }
    .channel-item .ch-twisty {
      width: 16px;
      flex-shrink: 0;
      text-align: center;
      opacity: 0.7;
      font-size: 0.7rem;
      cursor: pointer;
      user-select: none;
    }
    .channel-item.channel-disk {
      font-weight: 600;
      margin-top: 4px;
      background: rgba(255,255,255,0.03);
    }
    .channel-item.channel-disk.disk-scoped {
      color: var(--accent);
      background: rgba(0, 200, 212, 0.08);
    }
    .channel-item.channel-nested.muted {
      opacity: 0.55;
      pointer-events: none;
    }
    .channel-children {
      padding: 2px 0 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .channel-item.channel-nested {
      padding-left: 8px;
      font-weight: 400;
      font-size: 0.9rem;
    }
    .tree-item.tree-disk .label { font-weight: 600; }
    .lib-nav { display: none !important; }

    .filters {
      padding: 12px 20px 4px;
      background: linear-gradient(180deg, #12161d 0%, var(--bg) 100%);
      flex-shrink: 0;
    }
    .filter-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .filter-label {
      flex-shrink: 0;
      min-width: 42px;
      max-width: 72px;
      padding-top: 6px;
      font-size: 0.82rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    #subFolderRows {
      height: auto;
      max-height: none;
      overflow: visible;
      margin-bottom: 2px;
    }
    #subFolderRows.is-scrollable {
      max-height: min(36vh, 280px);
      overflow-x: hidden;
      overflow-y: auto;
    }
    #subFolderRows:empty { display: none; margin: 0; }
    .tag {
      border: 1px solid transparent;
      background: var(--bg3);
      color: var(--text);
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.86rem;
      font-family: inherit;
      line-height: 1.35;
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
    }
    .tag:hover { background: var(--tag-hover); border-color: var(--border); }
    .tag.active {
      background: rgba(0, 200, 212, 0.15);
      color: var(--accent);
      border-color: rgba(0, 200, 212, 0.35);
      font-weight: 600;
    }
    .tag .tag-n {
      font-size: 0.72em;
      font-weight: 500;
      color: var(--muted);
      opacity: 0.85;
      letter-spacing: 0;
      transform: translateY(-0.05em);
    }
    .tag.active .tag-n {
      color: var(--accent);
      opacity: 0.7;
    }
    .tree-panel {
      display: none;
      padding: 0 8px 12px;
      border-top: 1px solid var(--border);
      max-height: 40%;
      overflow: auto;
    }
    .tree-panel.open { display: block; }

    .tree {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 16px;
    }
    .tree-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      user-select: none;
    }
    .tree-item:hover { background: var(--hover); }
    .tree-item.active {
      background: rgba(61, 156, 240, 0.15);
      color: var(--accent);
    }
    .tree-item .twisty {
      width: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.7rem;
      flex-shrink: 0;
    }
    .tree-item .label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tree-item .badge {
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--bg3);
      padding: 1px 7px;
      border-radius: 999px;
    }
    .tree-children { margin-left: 12px; border-left: 1px solid var(--border); padding-left: 4px; }
    .tree-children.collapsed { display: none; }

    /* content：整栏可滚动（菜单+列表一起滑），避免菜单占死视口 */
    section.content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
    }
    /* 完整筛选不吸顶；滑动后吸顶显示当前选中的那一行筛选标签 */
    .scope-sticky {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 10px;
      min-height: 48px;
      padding: 7px 20px;
      border-bottom: 1px solid rgba(126, 146, 173, 0.18);
      background: linear-gradient(180deg, rgba(20, 26, 35, 0.98), rgba(14, 18, 25, 0.96));
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }
    .scope-sticky.is-stuck.has-filter-row {
      height: 48px;
      min-height: 48px;
      padding-top: 7px;
      padding-bottom: 7px;
      box-sizing: border-box;
    }
    .scope-sticky .crumb,
    .sticky-filter-row {
      grid-column: 1;
      grid-row: 1;
      min-width: 0;
    }
    .scope-sticky .crumb {
      padding: 0;
      color: var(--muted);
      font-size: 0.85rem;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }
    .scope-sticky .crumb .sep { opacity: 0.4; }
    .scope-sticky .crumb .count { color: var(--text); }
    .sticky-filter-row {
      display: flex;
      align-items: center;
      gap: 10px;
      visibility: hidden;
      pointer-events: none;
      min-height: 30px;
      max-height: 32px;
      overflow: hidden;
    }
    .scope-sticky.is-stuck.has-filter-row .crumb {
      visibility: hidden;
      pointer-events: none;
    }
    .scope-sticky.is-stuck.has-filter-row .sticky-filter-row {
      visibility: visible;
      pointer-events: auto;
    }
    .sticky-filter-row .filter-label {
      flex-shrink: 0;
      min-width: auto;
      max-width: 72px;
      padding: 4px 8px;
      border: 1px solid rgba(126, 146, 173, 0.22);
      border-radius: 7px;
      background: rgba(126, 146, 173, 0.08);
      font-size: 0.76rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sticky-filter-row .filter-tags {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      max-height: 32px;
      padding: 0 0 1px;
      scrollbar-width: none;
    }
    .sticky-filter-row .filter-tags::-webkit-scrollbar { display: none; }
    .sticky-filter-row .tag {
      padding: 4px 10px;
      font-size: 0.78rem;
      line-height: 1.2;
    }
    .scope-actions {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }
    .scope-filter-btn,
    .scope-options > summary {
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.78rem;
      font-family: inherit;
      white-space: nowrap;
    }
    .scope-filter-btn:hover,
    .scope-options > summary:hover,
    .scope-options[open] > summary {
      border-color: var(--accent);
      color: var(--accent);
    }
    .scope-sticky.is-stuck .scope-filter-btn {
      border-color: rgba(0, 200, 212, 0.35);
      color: var(--accent);
    }
    .scope-options { position: relative; }
    .scope-options > summary {
      display: flex;
      align-items: center;
      gap: 5px;
      list-style: none;
      user-select: none;
    }
    .scope-options > summary::-webkit-details-marker { display: none; }
    .scope-options-caret {
      color: var(--muted);
      font-size: 0.68rem;
      transition: transform 0.15s ease;
    }
    .scope-options[open] .scope-options-caret { transform: rotate(180deg); }
    .scope-options-popover {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 20;
      width: min(360px, calc(100vw - 28px));
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #171c24;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.42);
    }
    .scope-options-section + .scope-options-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .scope-options-label {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .scope-options-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .status-bar {
      padding: 8px 20px;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.45;
      flex-shrink: 0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      word-break: break-all;
      border-bottom: 1px solid transparent;
    }
    .continue-bar {
      padding: 8px 20px 10px;
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      background: var(--bg);
      min-height: 64px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
    }
    .continue-bar::-webkit-scrollbar { display: none; }
    .continue-bar .cont-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-right: 4px;
      flex-shrink: 0;
    }
    .continue-chip {
      flex: 0 0 220px;
      width: 220px;
      height: 46px;
      min-height: 46px;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(31, 39, 52, 0.95), rgba(24, 30, 40, 0.95));
      color: var(--text);
      border-radius: 8px;
      padding: 5px 9px;
      cursor: pointer;
      font-size: 0.82rem;
      max-width: 220px !important;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      scroll-snap-align: start;
    }
    .continue-chip:hover { border-color: var(--accent); color: var(--accent); }
    .continue-chip .pct {
      opacity: 0.7;
      font-size: 0.75em;
      margin-left: 6px;
    }
    .continue-chip .media-row-thumb {
      flex: 0 0 52px;
      width: 52px !important;
      min-width: 52px !important;
      height: 32px !important;
      border-radius: 5px !important;
    }
    .continue-chip > span:last-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    @media (max-width: 900px) {
      .continue-chip {
        flex-basis: 190px;
        width: 190px;
        max-width: 190px !important;
      }
    }
    .media-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
      margin: 10px 0;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg2);
    }
    .media-row-thumb {
      width: 96px;
      min-width: 96px;
      height: 54px;
      border-radius: 6px;
      overflow: hidden;
      background: #0a0c10;
      position: relative;
    }
    .media-row-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .media-row-thumb .ph {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.7rem;
    }
    .media-row-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .media-row-body strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .media-row-meta {
      opacity: 0.75;
      font-size: 0.82em;
      line-height: 1.35;
      word-break: break-all;
    }
    .media-row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .media-row-check {
      margin-top: 4px;
      flex-shrink: 0;
    }
    button.media-row-btn {
      display: flex;
      gap: 12px;
      width: 100%;
      text-align: left;
      align-items: stretch;
      margin: 8px 0;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg2);
      color: var(--text);
      cursor: pointer;
    }
    button.media-row-btn:hover { border-color: var(--accent); }
    .grid-wrap {
      flex: 0 0 auto;
      overflow: visible;
      padding: 8px 20px 48px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }
    .card {
      cursor: pointer;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg2);
      border: 1px solid transparent;
      transition: border-color 0.15s, transform 0.15s;
      content-visibility: auto;
      contain-intrinsic-size: 220px 290px;
    }
    .card:hover {
      border-color: var(--accent-dim);
      transform: translateY(-2px);
    }
    .thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0a0c10;
      overflow: hidden;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb .play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.35);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .card:hover .play { opacity: 1; }
    .play-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(61, 156, 240, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-icon::after {
      content: "";
      width: 0; height: 0;
      border-style: solid;
      border-width: 8px 0 8px 14px;
      border-color: transparent transparent transparent #fff;
      margin-left: 3px;
    }
    .dur {
      position: absolute;
      right: 8px;
      bottom: 8px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .dup-badge {
      position: absolute;
      left: 8px;
      top: 8px;
      background: rgba(200, 120, 40, 0.92);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      z-index: 2;
    }
    .bad-badge {
      position: absolute;
      right: 8px;
      top: 8px;
      background: rgba(180, 50, 50, 0.92);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      z-index: 2;
    }
    .card-body { padding: 10px 12px 14px; }
    .card-title {
      font-size: 0.92rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .card-meta {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .load-more-wrap {
      text-align: center;
      padding: 16px 0 8px;
      min-height: 1px;
    }
    .load-more-hint {
      color: var(--muted);
      font-size: 0.82rem;
      padding: 8px;
    }
    #scrollSentinel {
      height: 1px;
      width: 100%;
    }

    /* player modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.85);
      flex-direction: column;
    }
    .modal.open { display: flex; }
    .modal-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: #0a0c10;
    }
    .modal-bar .title {
      flex: 1;
      font-size: 1rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .modal-close {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
    }
    .modal-close:hover { background: var(--danger); border-color: var(--danger); }
    .player-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px 20px;
      min-height: 0;
    }
    .player-wrap video {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 8px;
      outline: none;
    }
    .modal-info {
      padding: 0 20px 8px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.45;
    }
    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 20px 16px;
    }
    .modal-actions .btn {
      font-size: 0.8rem;
      padding: 6px 12px;
    }
    .modal-actions .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #041016;
      font-weight: 600;
    }
    .settings-modal {
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      background: rgba(6, 10, 16, 0.62);
      backdrop-filter: blur(8px);
    }
    .settings-panel {
      display: flex;
      flex-direction: column;
      width: min(440px, 100%);
      max-height: min(86vh, 720px);
      background: #171d27;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .settings-panel .modal-bar {
      flex-shrink: 0;
      background: transparent;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 16px 20px 14px;
    }
    .settings-panel .modal-bar .title {
      font-size: 1.02rem;
      font-weight: 650;
      letter-spacing: 0.01em;
    }
    .settings-panel .modal-close {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 1.35rem;
    }
    .settings-panel .modal-close:hover {
      background: rgba(232, 93, 93, 0.16);
      color: #fff;
    }
    .settings-panel .modal-info {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 6px 16px 18px;
      max-width: none;
      color: var(--text);
      scrollbar-width: thin;
      scrollbar-color: #3a4660 transparent;
      -webkit-overflow-scrolling: touch;
    }
    .settings-panel .modal-info::-webkit-scrollbar {
      width: 8px;
    }
    .settings-panel .modal-info::-webkit-scrollbar-track {
      background: transparent;
    }
    .settings-panel .modal-info::-webkit-scrollbar-thumb {
      background: #3a4660;
      border-radius: 8px;
      border: 2px solid #171d27;
    }
    .settings-panel .modal-actions {
      flex-shrink: 0;
      justify-content: flex-end;
      gap: 10px;
      padding: 12px 16px 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: #131820;
    }
    .settings-section {
      padding: 14px 4px 6px;
    }
    .settings-section h3 {
      margin: 0 0 8px 4px;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .settings-list {
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      background: rgba(8, 12, 18, 0.45);
      overflow: hidden;
    }
    .settings-option,
    .settings-link {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin: 0;
      padding: 12px 14px;
      border: 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: transparent;
      cursor: pointer;
      color: inherit;
      text-decoration: none;
    }
    .settings-option:last-child,
    .settings-link:last-child {
      border-bottom: 0;
    }
    .settings-option:hover,
    .settings-link:hover {
      background: rgba(255,255,255,0.035);
    }
    .settings-option input {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      margin: 2px 0 0;
      flex-shrink: 0;
      border: 1.5px solid #4a5568;
      background: #121820;
      cursor: pointer;
    }
    .settings-option input[type="checkbox"] {
      border-radius: 5px;
    }
    .settings-option input[type="radio"] {
      border-radius: 50%;
    }
    .settings-option input:checked {
      border-color: var(--accent);
      background: var(--accent);
      box-shadow: inset 0 0 0 3px #121820;
    }
    .settings-option input[type="checkbox"]:checked {
      box-shadow: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='none' stroke='%23041016' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' d='M3.5 8.2 6.6 11.2 12.5 4.8'/></svg>");
      background-size: 12px 12px;
      background-position: center;
      background-repeat: no-repeat;
    }
    .settings-option span,
    .settings-link span {
      min-width: 0;
    }
    .settings-option strong,
    .settings-link strong {
      display: block;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
    }
    .settings-option small,
    .settings-link small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }
    .settings-link {
      align-items: center;
    }
    .settings-link-go {
      margin-left: auto;
      color: var(--accent);
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .settings-hint {
      margin: 8px 8px 0;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.45;
      word-break: break-all;
    }

    /* mobile */
    .menu-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .menu-toggle:hover { border-color: var(--accent-dim); }
    @media (max-width: 900px) {
      .drive-hint { display: none; }
      aside {
        position: absolute;
        left: 0; top: 57px; bottom: 0;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.2s;
        box-shadow: 4px 0 24px rgba(0,0,0,0.4);
        width: var(--sidebar-w);
        opacity: 1;
        pointer-events: none;
      }
      aside.open {
        transform: translateX(0);
        pointer-events: auto;
      }
      body.sidebar-hidden aside {
        width: var(--sidebar-w);
        opacity: 1;
        pointer-events: none;
      }
      body.sidebar-hidden aside.open {
        pointer-events: auto;
      }
      body.sidebar-hidden .sidebar-show { display: none; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .meta { display: none; }
      header { flex-wrap: nowrap; }
      .search-wrap,
      .search-wrap:focus-within {
        flex: 1 1 100px;
        max-width: 160px;
      }
    }
  </style>
</head>
<body>
  <header>
    <button class="menu-toggle" id="menuBtn" title="显示/隐藏目录">☰</button>
    <div class="brand">本地<span>视频库</span></div>
    <div class="drive-bar">
      <label for="driveSelect">磁盘/目录 <span id="driveCountBadge" class="drive-count">0</span></label>
      <select id="driveSelect" title="选择要扫描的硬盘">
        <option value="">检测中…</option>
      </select>
      <button class="btn primary" id="scanDriveBtn" title="扫描所选磁盘或目录；新磁盘会自动加入现有片库">扫描所选项</button>
      <span class="drive-hint" id="driveHint">正在检测磁盘和媒体目录…</span>
    </div>
    <div class="search-wrap">
      <input type="search" id="search" placeholder="搜索：拼音/首字母，theme:科幻 background:太空" autocomplete="off" title="支持拼音与首字母；语法：ext:mkv genre:动作 theme:科幻 background:太空 actor:姓名 channel:电影" />
    </div>
    <div class="meta" id="countLabel">—</div>
    <div class="header-actions">
      <button class="btn" id="rescanBtn" title="增量扫描：复用未改动的条目，只处理新增/变更">重新扫描</button>
      <button class="btn" id="queueBtn" title="转换队列：转 MP4 / 修复声音">转换队列</button>
      <button class="btn" id="cleanupBtn" title="查看并清理重复 / 损坏文件">文件清理</button>
      <button class="btn" id="lanBtn" title="允许同一 WiFi 下其它设备访问">局域网共享</button>
      <button class="btn" id="historyBtn" title="最近播放 / 继续看 / 已看完">播放历史</button>
      <button class="btn" id="exportStaticBtn" title="导出到当前盘/_video_gallery_static/，双击即可离线浏览，无需启动服务">导出静态站</button>
      <button class="btn" id="settingsBtn" title="隐私、性能与问题反馈">设置</button>
    </div>
  </header>

  <div class="main">
    <button class="sidebar-show" id="sidebarShowBtn" title="显示频道">频道 ›</button>
    <aside id="sidebar">
      <div id="libNav" class="lib-nav" aria-label="片库目录"></div>
      <div class="aside-head">
        <div class="aside-title" id="channelAsideTitle">频道</div>
        <button class="aside-hide" id="sidebarHideBtn" title="隐藏侧栏">«</button>
      </div>
      <div class="channel-list" id="channelList"></div>
      <div class="aside-head" style="border-top:1px solid var(--border)">
        <div class="aside-title" id="folderAsideTitle">文件夹</div>
        <button class="aside-hide" id="treeToggleBtn" title="展开/收起文件夹" style="width:auto;padding:0 8px;font-size:0.75rem">展开</button>
      </div>
      <div class="tree-panel" id="treePanel">
        <div class="tree" id="tree"></div>
      </div>
    </aside>
    <section class="content" id="contentScroll">
      <div class="filters" id="filters">
        <div class="filter-row" id="categoryRow" style="display:none">
          <div class="filter-label">频道</div>
          <div class="filter-tags" id="categoryTags"></div>
        </div>
        <div class="filter-row">
          <div class="filter-label">格式</div>
          <div class="filter-tags" id="extTags"></div>
        </div>
        <div class="filter-row" id="genreRow" style="display:none">
          <div class="filter-label">主题类型</div>
          <div class="filter-tags" id="genreTags"></div>
        </div>
        <!-- 主题/类型合并为一套去重标签；背景保留独立节点，有数据时才显示。 -->
        <div class="filter-row" id="themeRow" style="display:none">
          <div class="filter-label">主题</div>
          <div class="filter-tags" id="themeTags"></div>
        </div>
        <div class="filter-row" id="backgroundRow" style="display:none">
          <div class="filter-label">背景</div>
          <div class="filter-tags" id="backgroundTags"></div>
        </div>
        <div id="subFolderRows"></div>
      </div>
      <div class="scope-sticky" id="scopeSticky">
        <div class="sticky-filter-row" id="stickyFilterRow"></div>
        <div class="crumb" id="crumb"></div>
        <div class="scope-actions">
          <button type="button" class="scope-filter-btn" id="scopeFilterBtn" title="回到筛选栏">筛选</button>
          <details class="scope-options" id="scopeOptions">
            <summary id="scopeOptionsSummary" title="调整排序与视图">
              <span id="scopeOptionsText">最新 · 单集</span>
              <span class="scope-options-caret" aria-hidden="true">▼</span>
            </summary>
            <div class="scope-options-popover" role="group" aria-label="排序与视图">
              <div class="scope-options-section">
                <div class="scope-options-label">排序</div>
                <div class="scope-options-tags" id="sortTags"></div>
              </div>
              <div class="scope-options-section">
                <div class="scope-options-label">视图</div>
                <div class="scope-options-tags" id="viewTags"></div>
              </div>
            </div>
          </details>
        </div>
      </div>
      <div class="status-bar" id="status"></div>
      <div id="continueBar" class="continue-bar" style="display:none"></div>
      <div class="grid-wrap">
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" style="display:none">没有找到视频</div>
        <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
          <div class="load-more-hint" id="loadMoreHint">下滑加载更多…</div>
          <div id="scrollSentinel" aria-hidden="true"></div>
        </div>
      </div>
    </section>
  </div>

  <div class="modal" id="modal">
    <div class="modal-bar">
      <div class="title" id="modalTitle"></div>
      <button class="modal-close" id="modalClose" title="关闭">×</button>
    </div>
    <div class="player-wrap">
      <video id="player" controls autoplay playsinline></video>
    </div>
    <div class="modal-info" id="modalInfo"></div>
    <div class="modal-actions" id="modalActions">
      <button type="button" class="btn primary" id="btnLocalOpen" title="用系统默认播放器打开">系统播放器</button>
      <button type="button" class="btn" id="btnFixAudio" title="视频直拷，音频转为 AAC（解决浏览器无声）" style="display:none">修复声音</button>
      <button type="button" class="btn" id="btnToMp4" title="用 ffmpeg 转为同目录 MP4" style="display:none">转成 MP4</button>
      <button type="button" class="btn" id="btnCancelMp4" title="取消正在进行的转换" style="display:none">取消转换</button>
      <button type="button" class="btn" id="btnCover" title="用当前画面或指定时间截帧换封面">换封面</button>
      <button type="button" class="btn" id="btnCopyPath" title="复制本地文件路径">复制路径</button>
      <button type="button" class="btn" id="btnReveal" title="在文件管理器中显示">打开位置</button>
    </div>
    <div id="coverPanel" class="cover-panel" style="display:none">
      <label>截帧时间（秒） <input type="number" id="coverSeek" min="0" step="0.5" value="3" style="width:5em" /></label>
      <button type="button" class="btn primary" id="btnCoverSeek">按时间截帧</button>
      <button type="button" class="btn" id="btnCoverNow">用当前画面</button>
      <label class="btn" style="cursor:pointer;margin:0">上传图片
        <input type="file" id="coverFile" accept="image/*" style="display:none" />
      </label>
    </div>
  </div>

  <div class="modal" id="seriesModal">
    <div class="modal-bar">
      <div class="title" id="seriesModalTitle">剧集</div>
      <button class="modal-close" id="seriesModalClose" title="关闭">×</button>
    </div>
    <div class="modal-info" id="seriesModalList" style="flex:1;overflow:auto;max-height:70vh"></div>
  </div>

  <div class="modal settings-modal" id="privacyModal">
    <div class="settings-panel">
      <div class="modal-bar">
        <div class="title">设置</div>
        <button class="modal-close" id="privacyModalClose" title="关闭">×</button>
      </div>
      <div class="modal-info" id="privacyBody">
        <section class="settings-section">
          <h3>隐私与缓存</h3>
          <div class="settings-list">
            <label class="settings-option">
              <input type="checkbox" id="privacyEncrypt" />
              <span>
                <strong>加密预览图</strong>
                <small>开启后缓存为加密文件，不能当普通图片打开。</small>
              </span>
            </label>
            <label class="settings-option">
              <input type="radio" name="privacyCacheLoc" value="program" />
              <span>
                <strong>程序目录（推荐）</strong>
                <small>写到软件旁的 preview_cache，不占用视频盘。</small>
              </span>
            </label>
            <label class="settings-option">
              <input type="radio" name="privacyCacheLoc" value="disk" />
              <span>
                <strong>视频盘内</strong>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
  <!-- Early error catcher: runs in its own script block so it registers
       even if the main <script> below has a syntax error. -->
  <script>
  (function(){
    function _sendLog(ev, fields, lvl) {
      var level = String(lvl || "INFO").toUpperCase();
      var full = !!(window.__BOOT_DRIVES__ && window.__BOOT_DRIVES__.full_logging);
      if (level !== "ERROR" && level !== "WARN" && !full) return;
      try {
        var blob = new Blob(
          [JSON.stringify({event:ev, level:level, fields:fields||{}})],
          {type:"application/json"}
        );
        navigator.sendBeacon("/api/client-log", blob);
      } catch(_){}
    }
    window.addEventListener("error", function(e){
      _sendLog("early_js_error", {
        message: (e.message||"") + " @ " + (e.filename||"") + ":" + (e.lineno||0) + ":" + (e.colno||0),
        stack: e.error ? String(e.error.stack||e.error).slice(0,500) : ""
      }, "ERROR");
    });
    document.addEventListener("DOMContentLoaded", function(){
      _sendLog("page_dom_loaded", {elapsed_ms: Math.round(performance.now())});
      // Verify main script execution by testing a known function
      setTimeout(function(){
        if (typeof state === "undefined") {
          _sendLog("main_script_missing", {reason: "state object not found"}, "ERROR");
        } else {
          _sendLog("main_script_ok", {
            loaded_videos: (state.loadedVideos||[]).length,
            total: state.totalCount||0,
            has_more: !!state.hasMore
          });
        }
      }, 2000);
    });
  })();
  </script>
  <script>
    const state = {
      tree: null,
      types: [],
      genres: [],
      themes: [],
      backgrounds: [],
      categories: [],
      category: "",
      folder: "",
      folderAll: false,
      ext: "",
      genre: "",
      theme: "",
      background: "",
      sort: "mtime_desc",
      // 默认单集：卡片数与左边频道「片子数」一致。合集视图会把多集收成 1 张卡，局域网新访客容易误以为数量错。
      view: "flat",
      query: "",
      expanded: new Set([""]),
      root: "",
      hasFfmpeg: false,
      drives: [],
      offset: 0,
      pageSize: 20,
      hasMore: false,
      totalCount: 0,
      rawCount: 0,
      lastPlayId: "",
      loadedVideos: [],
      loadedBaseOffset: 0,
      virtualEnabled: false,
      lib: "",           // 当前浏览的挂载根；空=全部
      mountedRoots: [],  // [{path,label,count,categories}]
      multi: false,
      libExpanded: null, // Set of expanded disk paths in channel list
      navCache: null,    // last /api/tree payload (sidebar + folder tree)
      trees: Object.create(null), // lib -> folder tree
      paintedTreeLib: null,
      catalogCount: 0,   // all-disks total; never replace with a single-disk list count
      _sidebarFingerprint: "",   // applyNavChrome 总指纹，完全一致时跳过 5 大容器 DOM 重建
      _treeFingerprint: "",      // syncNavFromCache 左栏 folder tree 渲染指纹
      _lastCatTagsKey: "",       // renderCategoryTags 输入指纹（避免软刷新无意义 innerHTML 重写）
      _lastCatTagsHtml: "",      // renderCategoryTags 输出 HTML 缓存
      _lastChannelsHtml: "",     // renderChannels 输出 HTML 缓存
      _lastChannelsKey: "",      // renderChannels 输入指纹
      _lastExtHtml: "",          // renderExtTags 输出 HTML 缓存
      _lastExtKey: "",           // renderExtTags 输入指纹
      _lastSortHtml: "",         // renderSortTags 输出 HTML 缓存
      _lastSortKey: "",          // renderSortTags 输入指纹
      _lastScanning: false,       // API browser-cache safety gate
      _updating: false,
      _fullLogging: !!(window.__BOOT_DRIVES__ && window.__BOOT_DRIVES__.full_logging),
    };

    const CHANNEL_ICO = {
      "": "▣",
      "__all__": "◎",
      "电影": "🎬",
      "电视剧": "📺",
      "综艺": "🎤",
      "动漫": "✨",
      "少儿": "🧸",
      "纪录片": "📡",
      "短剧": "▶",
      "体育": "⚽",
      "音乐": "♪",
      "教育": "📚",
      "其他": "⋯",
      "未分类": "▫",
    };

    const SORTS = [
      { id: "mtime_desc", label: "最新" },
      { id: "mtime_asc", label: "最早" },
      { id: "size_desc", label: "最大" },
      { id: "duration_desc", label: "最长" },
      { id: "duration_asc", label: "最短" },
      { id: "name", label: "名称" },
    ];

    const VIRTUAL_MIN = 150;
    const VIRTUAL_ROW_H = 288;
    const VIRTUAL_GAP = 18;

    const $ = (id) => document.getElementById(id);
    let currentOperationId = "";
    let lastUiOperationId = "";
    let lastUiOperationAt = 0;
    const CLIENT_SESSION_ID =
      (Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
    let lastClientLogFailureAt = 0;
    let clientLogQueue = [];
    let clientLogFlushTimer = 0;
    const CLIENT_LOG_BATCH_MAX = 24;
    const CLIENT_LOG_FLUSH_MS = 80;
    const CLIENT_LOG_CORE_EVENTS = new Set([
      "refresh_render_completed",
      "load_more_done",
      // LAN share button regressions: always ship these even without full logging.
      "lan_share_ui_sync",
      "lan_share_boot",
      "lan_share_click",
    ]);
    const CLIENT_LOG_LOOP_EVENTS = new Set([
      "filter_layout",
      "sticky_layout",
      "scroll_tick",
      "virtual_scroll_geometry",
      "virtual_spacer_state",
      "virtual_bottom_spacer_change",
      "continue_layout",
    ]);
    const clientLogLastSent = new Map();

    function newOperationId(prefix) {
      return `${prefix || "op"}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function postClientLogs(events) {
      if (!events || !events.length) return;
      const body = events.length === 1 ? events[0] : { events };
      fetch("/api/client-log", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...(events.length === 1 && events[0].operation_id
            ? { "X-VG-Operation-ID": events[0].operation_id }
            : {}),
        },
        body: JSON.stringify(body),
        keepalive: true,
      }).then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
      }).catch((error) => {
        const now = Date.now();
        if (now - lastClientLogFailureAt >= 5000) {
          lastClientLogFailureAt = now;
          console.error("[video-gallery] client log upload failed", {
            count: events.length,
            error: String(error && (error.stack || error) || "unknown"),
          });
        }
      });
    }

    function flushClientLogs() {
      if (clientLogFlushTimer) {
        clearTimeout(clientLogFlushTimer);
        clientLogFlushTimer = 0;
      }
      if (!clientLogQueue.length) return;
      const batch = clientLogQueue.splice(0, CLIENT_LOG_BATCH_MAX);
      postClientLogs(batch);
      if (clientLogQueue.length) {
        clientLogFlushTimer = setTimeout(flushClientLogs, CLIENT_LOG_FLUSH_MS);
      }
    }

    function clientLog(event, fields, level, operationId) {
      const eventName = String(event || "unknown");
      const levelName = String(level || "INFO").toUpperCase();
      const important = levelName === "ERROR" || levelName === "WARN";
      if (!important && !state._fullLogging && !CLIENT_LOG_CORE_EVENTS.has(eventName)) {
        return;
      }
      if (!important && CLIENT_LOG_LOOP_EVENTS.has(eventName)) {
        const now = Date.now();
        const previous = clientLogLastSent.get(eventName) || 0;
        if (now - previous < 1000) return;
        clientLogLastSent.set(eventName, now);
      }
      const payload = {
        event: eventName,
        level: levelName,
        operation_id: operationId || currentOperationId || lastUiOperationId || "",
        page: location.pathname + location.search,
        fields: {
          session_id: CLIENT_SESSION_ID,
          ...(fields || {}),
        },
      };
      try {
        if (important) {
          postClientLogs([payload]);
          return;
        }
        clientLogQueue.push(payload);
        if (clientLogQueue.length >= CLIENT_LOG_BATCH_MAX) {
          flushClientLogs();
        } else if (!clientLogFlushTimer) {
          clientLogFlushTimer = setTimeout(flushClientLogs, CLIENT_LOG_FLUSH_MS);
        }
      } catch (error) {
        console.error("[video-gallery] client log setup failed", {
          event: payload.event,
          error: String(error && (error.stack || error) || "unknown"),
        });
      }
    }

    function clientNow() {
      return (window.performance && performance.now) ? performance.now() : Date.now();
    }

    function clientElapsedMs(started) {
      return Math.max(0, clientNow() - Number(started || 0));
    }

    // 筛选区布局诊断：记录真实盒模型尺寸，尤其关注子类容器的
    // clientHeight/scrollHeight 以及最后一行到容器底部的空白。
    let filterLayoutLogTimer = 0;
    function filterLayoutSnapshot(reason) {
      const started = clientNow();
      const root = $("filters");
      if (!root || !root.getBoundingClientRect) return;
      const rect = (el) => {
        if (!el) return null;
        const r = el.getBoundingClientRect();
        const cs = getComputedStyle(el);
        return {
          id: el.id || "",
          class_name: String(el.className || "").slice(0, 80),
          x: Math.round(r.x), y: Math.round(r.y),
          width: Math.round(r.width), height: Math.round(r.height),
          top: Math.round(r.top), bottom: Math.round(r.bottom),
          client_height: el.clientHeight, scroll_height: el.scrollHeight,
          display: cs.display, box_sizing: cs.boxSizing,
          margin_bottom: cs.marginBottom, padding: cs.padding,
        };
      };
      const rows = Array.from(root.querySelectorAll(".filter-row")).map((row, index) => ({
        index,
        level: row.getAttribute("data-sub-level") || "",
        row: rect(row),
        tags: rect(row.querySelector(".filter-tags")),
        tag_count: row.querySelectorAll(".tag").length,
      }));
      const sub = $("subFolderRows");
      const visibleRows = rows.filter((item) => item.row && item.row.display !== "none" && item.row.height > 0);
      const last = visibleRows.length ? visibleRows[visibleRows.length - 1].row : null;
      const rootRect = root.getBoundingClientRect();
      const sticky = $("scopeSticky");
      const stickyRow = $("stickyFilterRow");
      const content = $("contentScroll");
      clientLog("filter_layout", {
        reason: String(reason || "unknown"),
        elapsed_ms: Number(clientElapsedMs(started).toFixed(1)),
        root: JSON.stringify(rect(root)),
        rows: JSON.stringify(rows).slice(0, 3600),
        visible_row_count: visibleRows.length,
        subfolder: JSON.stringify(rect(sub)),
        last_row_bottom: last ? last.bottom : null,
        bottom_gap: last ? Math.round(rootRect.bottom - last.bottom) : null,
        sticky: JSON.stringify(rect(sticky)),
        sticky_row: JSON.stringify(rect(stickyRow)),
        sticky_state: sticky ? {
          is_stuck: sticky.classList.contains("is-stuck"),
          has_filter_row: sticky.classList.contains("has-filter-row"),
          visibility: getComputedStyle(stickyRow || sticky).visibility,
          grid_rows: getComputedStyle(sticky).gridTemplateRows,
        } : null,
        content_scroll_top: content ? Math.round(content.scrollTop) : null,
        viewport_width: window.innerWidth,
        viewport_height: window.innerHeight,
      });
    }
    function scheduleFilterLayoutLog(reason) {
      clearTimeout(filterLayoutLogTimer);
      filterLayoutLogTimer = setTimeout(() => filterLayoutSnapshot(reason), 120);
    }
    function syncSubfolderOverflow(reason) {
      const started = clientNow();
      const box = $("subFolderRows");
      if (!box || !box.children.length) {
        if (box) box.classList.remove("is-scrollable");
        clientLog("subfolder_overflow", {
          reason: String(reason || "unknown"),
          elapsed_ms: Number(clientElapsedMs(started).toFixed(1)),
          content_height: 0,
          max_height: Math.round(Math.min(window.innerHeight * 0.36, 280)),
          client_height: box ? box.clientHeight : 0,
          scroll_height: box ? box.scrollHeight : 0,
          scrollable: false,
          row_count: 0,
        });
        return;
      }
      // 先以完整内容测量，再决定是否启用 max-height，避免空白高度被预留。
      box.classList.remove("is-scrollable");
      const maxHeight = Math.min(window.innerHeight * 0.36, 280);
      const contentHeight = box.scrollHeight;
      const scrollable = contentHeight > maxHeight + 1;
      box.classList.toggle("is-scrollable", scrollable);
      clientLog("subfolder_overflow", {
        reason: String(reason || "unknown"),
        elapsed_ms: Number(clientElapsedMs(started).toFixed(1)),
        content_height: contentHeight,
        max_height: Math.round(maxHeight),
        client_height: box.clientHeight,
        scroll_height: box.scrollHeight,
        scrollable,
        row_count: box.querySelectorAll(".filter-row").length,
      });
    }
    window.addEventListener("resize", () => {
      syncSubfolderOverflow("resize");
      scheduleFilterLayoutLog("resize");
    });
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => scheduleFilterLayoutLog("resize_observer"));
      const root = $("filters");
      if (root) ro.observe(root);
    }
    if (window.MutationObserver) {
      const mo = new MutationObserver(() => scheduleFilterLayoutLog("mutation"));
      const root = $("filters");
      if (root) mo.observe(root, { childList: true, subtree: true, attributes: true, attributeFilter: ["style", "class"] });
    }

    function filterStateFields(extra) {
      return {
        category: state.category || "",
        folder: state.folder || "",
        folder_all: !!state.folderAll,
        lib: state.lib || "",
        ext: state.ext || "",
        genre: state.genre || "",
        theme: state.theme || "",
        background: state.background || "",
        ...(extra || {}),
      };
    }

    const nativeFetch = window.fetch.bind(window);
    window.fetch = function tracedFetch(input, init) {
      const options = { ...(init || {}) };
      const operationId =
        currentOperationId ||
        (Date.now() - lastUiOperationAt < 10000 ? lastUiOperationId : "");
      if (operationId) {
        const headers = new Headers(
          options.headers || (input instanceof Request ? input.headers : undefined)
        );
        if (!headers.has("X-VG-Operation-ID")) {
          headers.set("X-VG-Operation-ID", operationId);
        }
        options.headers = headers;
      }
      return nativeFetch(input, options);
    };

    document.addEventListener("click", (e) => {
      const target = e.target && e.target.closest
        ? e.target.closest("button,a,[role='button'],.card,video")
        : null;
      if (!target) return;
      const operationId = currentOperationId || newOperationId("ui");
      lastUiOperationId = operationId;
      lastUiOperationAt = Date.now();
      const isButton = target.matches("button,[role='button']");
      clientLog("ui_click", {
        target_id: target.id || "",
        tag: target.tagName || "",
        control_type: isButton ? "button" : "ui_control",
        type: target.getAttribute("type") || "",
        disabled: !!target.disabled,
        action: target.dataset ? (target.dataset.action || "") : "",
        item_id: target.dataset ? (target.dataset.id || target.dataset.epid || "") : "",
        kind: target.dataset ? (target.dataset.kind || "") : "",
        label: String(target.getAttribute("aria-label") || target.title || target.textContent || "").trim().slice(0, 120),
      }, "INFO", operationId);
    }, true);

    document.addEventListener("change", (e) => {
      const target = e.target;
      if (!target) return;
      const operationId = currentOperationId || newOperationId("ui");
      lastUiOperationId = operationId;
      lastUiOperationAt = Date.now();
      clientLog("ui_change", {
        target_id: target.id || "",
        tag: target.tagName || "",
        value: target.type === "file" ? (target.files ? target.files.length : 0) : String(target.value || "").slice(0, 120),
      }, "INFO", operationId);
    }, true);

    let clientInputLogTimer = 0;
    document.addEventListener("input", (e) => {
      const target = e.target;
      if (!target || !target.id) return;
      clearTimeout(clientInputLogTimer);
      clientInputLogTimer = setTimeout(() => {
        clientLog("ui_input", {
          target_id: target.id,
          value: target.type === "password" ? "[hidden]" : String(target.value || "").slice(0, 120),
          value_length: String(target.value || "").length,
        });
      }, 500);
    }, true);

    window.addEventListener("error", (e) => {
      clientLog("browser_javascript_error", {
        message: e.message || "",
        source: e.filename || "",
        line: e.lineno || 0,
        column: e.colno || 0,
        error: e.error ? String(e.error.stack || e.error) : "",
      }, "ERROR");
    });
    window.addEventListener("unhandledrejection", (e) => {
      const reason = e && e.reason;
      if (isAbortError(reason)) return;
      clientLog("browser_unhandled_rejection", {
        reason: String(reason && (reason.stack || reason) || "unknown"),
      }, "ERROR");
    });

    const PREFS_KEY = "vg_ui_prefs_v2";
    const PLAY_PROG_KEY = "vg_play_progress";

    function loadUiPrefs() {
      try {
        const raw = localStorage.getItem(PREFS_KEY);
        if (!raw) return;
        const p = JSON.parse(raw);
        if (p.sort) state.sort = p.sort;
        if (p.view === "flat" || p.view === "series") state.view = p.view;
        if (typeof p.category === "string") state.category = p.category;
        if (typeof p.folder === "string") state.folder = p.folder;
        if (typeof p.folderAll === "boolean") state.folderAll = p.folderAll;
        else if (state.folder) state.folderAll = true;
        if (typeof p.ext === "string") state.ext = p.ext;
        if (typeof p.genre === "string") state.genre = p.genre;
        if (typeof p.theme === "string") state.theme = p.theme;
        if (typeof p.background === "string") state.background = p.background;
        if (typeof p.query === "string") state.query = p.query;
        if (p.drive) state._preferDrive = p.drive;
        if (p.lastPlayId) state.lastPlayId = p.lastPlayId;
      } catch (_) {}
    }

    function saveUiPrefs() {
      try {
        const drive = ($("driveSelect") && $("driveSelect").value) || state._preferDrive || "";
        localStorage.setItem(PREFS_KEY, JSON.stringify({
          sort: state.sort,
          view: state.view || "flat",
          category: state.category,
          folder: state.folder,
          folderAll: !!state.folderAll,
          ext: state.ext,
          genre: state.genre,
          theme: state.theme,
          background: state.background,
          query: state.query || "",
          drive,
          lastPlayId: state.lastPlayId || "",
        }));
      } catch (_) {}
    }

    function loadPlayProgressMap() {
      try {
        return JSON.parse(localStorage.getItem(PLAY_PROG_KEY) || "{}") || {};
      } catch (_) {
        return {};
      }
    }

    function getPlayProgress(id) {
      const m = loadPlayProgressMap();
      const row = m[id];
      if (!row) return 0;
      if (row.done) return 0;
      if (!(row.t > 5)) return 0;
      return Number(row.t) || 0;
    }

    function getPlayRow(id) {
      const m = loadPlayProgressMap();
      return m[id] || null;
    }

    function savePlayProgress(id, t, duration, meta) {
      if (!id) return;
      try {
        const m = loadPlayProgressMap();
        const dur = Number(duration) || 0;
        const nearEnd = dur > 30 && t >= dur - 5;
        if (t < 5 && !nearEnd) {
          // 刚开始不算
          if (!m[id]) return;
        }
        const prev = m[id] || {};
        const root = (meta && meta.root) || prev.root || state.root || "";
        const rel = (meta && meta.rel) || prev.rel || "";
        const baseMeta = {
          name: (meta && meta.name) || prev.name || "",
          folder: (meta && meta.folder) || prev.folder || "",
          root,
          rel,
        };
        if (nearEnd) {
          m[id] = {
            t: Math.floor(dur || t),
            duration: Math.floor(dur),
            updated: Date.now(),
            done: true,
            ...baseMeta,
          };
        } else if (t >= 5) {
          m[id] = {
            t: Math.floor(t),
            duration: Math.floor(dur),
            updated: Date.now(),
            done: false,
            ...baseMeta,
          };
        }
        const keys = Object.keys(m);
        if (keys.length > 300) {
          keys.sort((a, b) => (m[a].updated || 0) - (m[b].updated || 0));
          for (let i = 0; i < keys.length - 300; i++) delete m[keys[i]];
        }
        localStorage.setItem(PLAY_PROG_KEY, JSON.stringify(m));
        renderContinueBar();
      } catch (_) {}
    }

    function historyHints(rows) {
      const hints = {};
      (rows || []).forEach((r) => {
        if (!r || !r.id) return;
        if (r.root || r.rel) {
          hints[r.id] = { root: r.root || "", rel: r.rel || "" };
        }
      });
      return hints;
    }

    function beginPlaybackOperation(id, source, root, extra) {
      currentOperationId = newOperationId("play");
      clientLog("video_open_requested", {
        video_id: id,
        source: source || "unknown",
        root: root || "",
        ...(extra || {}),
      }, "INFO", currentOperationId);
      return currentOperationId;
    }

    function infoUrl(id, root, operationId) {
      const params = new URLSearchParams();
      if (root) params.set("root", root);
      const op = operationId || currentOperationId || "";
      if (op) params.set("op", op);
      const query = params.toString();
      return "/api/info/" + encodeURIComponent(id) + (query ? ("?" + query) : "");
    }

    async function openFromHistory(id, rootHint) {
      const row = getPlayRow(id) || {};
      const root = rootHint || row.root || "";
      const operationId = beginPlaybackOperation(id, "history", root);
      const r = await fetch(infoUrl(id, root, operationId), {
        headers: { "X-VG-Operation-ID": operationId },
      });
      if (!r.ok) {
        const offline = root && !(state.root && String(state.root).toLowerCase() === String(root).toLowerCase());
        throw new Error(
          offline
            ? ("找不到该片。若来自其他磁盘，请确认主机已插入/打开：\n" + root)
            : "无法打开（可能已移出片库，或对应磁盘未连接）"
        );
      }
      const info = await r.json();
      // 补全进度里的 root/rel，方便下次跨盘
      try {
        const m = loadPlayProgressMap();
        if (m[id]) {
          m[id].root = info.root || m[id].root || root || state.root || "";
          m[id].rel = info.rel || m[id].rel || "";
          if (info.name) m[id].name = info.name;
          if (info.folder) m[id].folder = info.folder;
          localStorage.setItem(PLAY_PROG_KEY, JSON.stringify(m));
        }
      } catch (_) {}
      openPlayer(
        id,
        info.name,
        `${info.size_h || ""} · ${info.folder || info.rel || ""}`,
        info.ext,
        info.kind || "",
        info.seg_count || 0,
        {
          path: info.path || "",
          folder: info.folder || "",
          root: info.root || root || state.root || "",
          rel: info.rel || "",
          browser_hard: !!info.browser_hard,
          browser_ok: !!info.browser_ok,
          audio_hard: !!info.audio_hard,
          audio_codec: info.audio_codec || "",
        }
      );
    }

    function historyEntries(kind) {
      const m = loadPlayProgressMap();
      let rows = Object.keys(m).map((id) => ({ id, ...(m[id] || {}) }));
      if (kind === "resume") {
        rows = rows.filter((r) => !r.done && (r.t || 0) > 5);
      } else if (kind === "done") {
        rows = rows.filter((r) => r.done);
      }
      rows.sort((a, b) => (b.updated || 0) - (a.updated || 0));
      return rows;
    }

    function renderContinueBar() {
      const started = clientNow();
      const bar = $("continueBar");
      if (!bar) return;
      const rows = historyEntries("resume").slice(0, 8);
      if (!rows.length) {
        bar.style.display = "none";
        bar.innerHTML = "";
        clientLog("continue_layout", {
          elapsed_ms: Number(clientElapsedMs(started).toFixed(1)),
          item_count: 0,
          client_height: bar.clientHeight,
          child_rows: 0,
          single_row: true,
        });
        return;
      }
      bar.style.display = "flex";
      // 异步补缩略图信息
      bar.innerHTML = `<span class="cont-label">继续看</span>` + rows.map((r) => {
        const dur = Number(r.duration) || 0;
        const pct = dur > 0 ? Math.min(99, Math.round((r.t / dur) * 100)) : 0;
        const label = escapeHtml(r.name || r.id);
        return `<button type="button" class="continue-chip" data-play-id="${escapeAttr(r.id)}" title="${escapeAttr(r.folder || r.root || "")}">
          <span class="media-row-thumb">
            <img ${lazyThumbMarkup(r.id, 1, r.root || "")} />
          </span>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${label}${pct ? `<span class="pct">${pct}%</span>` : ""}</span>
        </button>`;
      }).join("");
      watchThumbs(bar);
      clientLog("continue_layout", {
        elapsed_ms: Number(clientElapsedMs(started).toFixed(1)),
        item_count: rows.length,
        client_width: bar.clientWidth,
        scroll_width: bar.scrollWidth,
        client_height: bar.clientHeight,
        child_rows: bar.children.length,
        single_row: Array.from(bar.children).every((el) => el.getBoundingClientRect().height <= 50),
      });
    }

    async function fetchTree(opts) {
      const started = clientNow();
      const operationId = newOperationId("tree");
      const params = new URLSearchParams();
      if (state.lib) params.set("lib", state.lib);
      params.set("gen", String(state._libGen || 0));
      const forceNoStore = !!(opts && opts.cache === "no-store");
      const browserCacheMode = forceNoStore
        ? "no-store"
        : ((state._lastScanning || state._updating) ? "no-store" : "default");
      clientLog("tree_load_requested", {
        lib: state.lib || "all",
        cache_mode: browserCacheMode,
        cache_generation: state._libGen || 0,
      }, "INFO", operationId);
      const r = await fetch("/api/tree" + (params.toString() ? ("?" + params) : ""), {
        cache: browserCacheMode,
        headers: { "X-VG-Operation-ID": operationId },
      });
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        clientLog("tree_load_failed", {
          elapsed_ms: Number(clientElapsedMs(started).toFixed(1)),
          status: r.status,
          request_id: r.headers.get("X-VG-Request-ID") || "",
          reason: err.msg || "",
        }, "ERROR", operationId);
        throw new Error(err.msg || ("树接口失败 HTTP " + r.status));
      }
      const data = await r.json();
      state._lastScanning = !!data.scanning;
      state._updating = !!data.updating;
      clientLog("tree_load_completed", {
        elapsed_ms: Number(clientElapsedMs(started).toFixed(1)),
        request_id: r.headers.get("X-VG-Request-ID") || "",
        count: data.count || 0,
        roots: Array.isArray(data.roots) ? data.roots.length : 0,
        scanning: !!data.scanning,
        updating: !!data.updating,
        cache_layer: r.headers.get("X-VG-Cache-Layer") || "",
        cache_policy: r.headers.get("X-VG-Cache-Policy") || "",
      }, "INFO", operationId);
      return data;
    }

    const activeListControllers = new Set();
    function isAbortError(err) {
      if (err == null) return false;
      const text = String((err && (err.message || err.reason || err)) || err);
      return (
        err === "channel-switch" ||
        err.name === "AbortError" ||
        err.name === "TimeoutError" ||
        /aborted|AbortError|channel-switch/i.test(text)
      );
    }
    function cancelListRequests() {
      activeListControllers.forEach((controller) => {
        try {
          controller.abort("channel-switch");
        } catch (_) {}
      });
      activeListControllers.clear();
    }

    async function fetchVideos(offset, requestReason) {
      const started = clientNow();
      const operationId = newOperationId("page");
      let terminalStatus = "pending";
      let terminalError = "";
      let responseRequestId = "";
      const requestedOffset = offset == null ? state.offset : offset;
      const params = new URLSearchParams();
      if (state.category) params.set("category", state.category);
      if (state.folder) params.set("folder", state.folder);
      if (state.folder && state.folderAll) params.set("folder_all", "1");
      if (state.ext) params.set("ext", state.ext);
      if (state.genre) params.set("genre", state.genre);
      if (state.theme) params.set("theme", state.theme);
      if (state.background) params.set("background", state.background);
      if (state.sort) params.set("sort", state.sort);
      if (state.view) params.set("view", state.view);
      if (state.query) params.set("q", state.query);
      if (state.lib) params.set("lib", state.lib);
      params.set("gen", String(state._libGen || 0));
      params.set("offset", String(requestedOffset));
      params.set("limit", String(state.pageSize));
      const browserCacheMode = (state._lastScanning || state._updating) ? "no-store" : "default";
      clientLog("page_load_requested", {
        request_reason: requestReason || "unspecified",
        offset: offset == null ? state.offset : offset,
        limit: state.pageSize,
        lib: state.lib || "all",
        category: state.category || "",
        folder: state.folder || "",
        ext: state.ext || "",
        view: state.view || "",
        sort: state.sort || "",
        query_length: (state.query || "").length,
        cache_mode: browserCacheMode,
        cache_generation: state._libGen || 0,
      }, "INFO", operationId);
      const controller = new AbortController();
      activeListControllers.add(controller);
      try {
        const r = await fetch("/api/videos?" + params, {
          cache: browserCacheMode,
          signal: controller.signal,
          headers: { "X-VG-Operation-ID": operationId },
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          throw new Error(err.msg || ("列表接口失败 HTTP " + r.status));
        }
        const data = await r.json();
        responseRequestId = r.headers.get("X-VG-Request-ID") || "";
        terminalStatus = "completed";
        clientLog("page_load_completed", {
          elapsed_ms: Number(clientElapsedMs(started).toFixed(1)),
          request_id: responseRequestId,
          offset: data.offset || 0,
          rows: Array.isArray(data.videos) ? data.videos.length : 0,
          total: data.count || 0,
          has_more: !!data.has_more,
          ext: state.ext || "",
          cache_layer: r.headers.get("X-VG-Cache-Layer") || "",
          cache_policy: r.headers.get("X-VG-Cache-Policy") || "",
        }, "INFO", operationId);
        return data;
      } catch (e) {
        // 切换频道/筛选时主动取消旧请求，不算失败
        if (controller.signal.aborted || isAbortError(e)) {
          terminalStatus = "aborted";
          terminalError = String(e && (e.reason || e.message || e) || "aborted");
          clientLog("page_load_aborted", {
            elapsed_ms: Number(clientElapsedMs(started).toFixed(1)),
            reason: controller.signal.aborted ? "channel-switch" : String(e),
          }, "INFO", operationId);
          return null;
        }
        terminalStatus = "failed";
        terminalError = String(e && (e.stack || e) || "unknown");
        clientLog("page_load_failed", {
          elapsed_ms: Number(clientElapsedMs(started).toFixed(1)),
          reason: String(e),
        }, "ERROR", operationId);
        throw e;
      } finally {
        activeListControllers.delete(controller);
        // 首屏请求（offset 空或 0）只要结束（成功/失败/取消）就清掉
        // 「等待 facets」标记：避免请求异常后 tree_nav 永远被压制不渲染。
        const wasFirstPage = offset == null || Number(offset) === 0;
        if (wasFirstPage) state._firstPageVideoPending = false;
        clientLog("page_load_finally", {
          request_reason: requestReason || "unspecified",
          elapsed_ms: Number(clientElapsedMs(started).toFixed(1)),
          status: terminalStatus,
          requested_offset: requestedOffset,
          response_request_id: responseRequestId,
          first_page: wasFirstPage,
          active_requests_after: activeListControllers.size,
          error: terminalError,
        }, terminalStatus === "failed" ? "ERROR" : "INFO", operationId);
      }
    }

    async function loadDrives() {
      const sel = $("driveSelect");
      $("driveHint").textContent = "正在检测磁盘和媒体目录…";

      const apply = (data) => {
        if (typeof data.full_logging === "boolean") {
          state._fullLogging = data.full_logging;
        }
        state.drives = data.drives || [];
        state.root = data.current || state.root;
        const n = state.drives.length;
        $("driveCountBadge").textContent = String(n);
        if (!n) {
          sel.innerHTML = '<option value="">未检测到磁盘或媒体目录</option>';
          $("driveHint").textContent = "未检测到可用磁盘或媒体目录";
          return;
        }
        const prev = sel.value;
        const letters = state.drives.map((d) => d.letter).join("、");
        sel.innerHTML = state.drives.map((d) => {
          const free = d.free_h ? ("（剩余 " + d.free_h + "）") : "";
          const text = (d.display || d.letter) + free;
          const val = d.path;
          return '<option value="' + escapeAttr(val) + '">' + escapeHtml(text) + "</option>";
        }).join("");
        const active = state.drives.find((d) => d.active);
        const pick = (d) => d.path;
        const prefer = state._preferDrive;
        if (prefer && [...sel.options].some((o) => o.value === prefer)) sel.value = prefer;
        else if (active) sel.value = pick(active);
        else if (prev && [...sel.options].some((o) => o.value === prev)) sel.value = prev;
        else sel.value = pick(state.drives[0]);
        state._preferDrive = sel.value;
        $("driveHint").textContent = "已检测到 " + n + " 个磁盘/目录：" + letters;
        updateDriveHint(true);
        saveUiPrefs();
        const scanning = !!data.scanning;
        $("scanDriveBtn").disabled = scanning;
        sel.disabled = scanning;
        $("rescanBtn").disabled = scanning;
        if ($("exportStaticBtn")) $("exportStaticBtn").disabled = scanning || !!data.exporting;
      };

      // 1) 先用页面启动时注入的数据（立刻显示）
      if (window.__BOOT_DRIVES__ && Array.isArray(window.__BOOT_DRIVES__.drives)) {
        apply(window.__BOOT_DRIVES__);
      }

      // 2) 再请求接口刷新（U 盘热插拔等）
      try {
        const r = await fetch("/api/drives");
        if (!r.ok) throw new Error("HTTP " + r.status);
        const data = await r.json();
        window.__BOOT_DRIVES__ = data;
        apply(data);
        return data;
      } catch (e) {
        console.warn("加载磁盘/目录失败", e);
        if (!(window.__BOOT_DRIVES__ && window.__BOOT_DRIVES__.drives && window.__BOOT_DRIVES__.drives.length)) {
          $("driveHint").textContent = "磁盘检测失败，请重启应用";
        }
        return window.__BOOT_DRIVES__ || { drives: [] };
      }
    }

    function updateDriveHint(keepCountText) {
      const val = $("driveSelect").value;
      const d = state.drives.find((x) => x.path === val);
      if (!d) return;
      const parts = [];
      if (!keepCountText) {
        parts.push(`已检测到 ${state.drives.length} 个磁盘/目录`);
      } else {
        // 保留「已检测到 N 个」前缀，后面追加当前盘信息
        const letters = state.drives.map((x) => x.letter).join("、");
        $("driveHint").textContent =
          `已检测到 ${state.drives.length} 个磁盘/目录：${letters}` +
          (d.type ? ` · 当前 ${d.letter} ${d.type}` : "") +
          (d.total_h ? ` 共${d.total_h}` : "");
        return;
      }
      if (d.type) parts.push(d.type);
      if (d.total_h) parts.push(`共 ${d.total_h}`);

    function selectedDrivePath() {
      const val = $("driveSelect").value;

      return d ? d.path : val;
